# 判例レンズ: 収集元データセット（japanese-law-analysis/data_set）の更新を毎週取り込む
name: Update case data

on:
  schedule:
    - cron: "17 20 * * 0"   # 毎週月曜 05:17 JST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest dataset
        run: git clone --depth 1 https://github.com/japanese-law-analysis/data_set.git /tmp/data_set
      - name: Rebuild data files
        run: |
          python3 tools/build_data.py /tmp/data_set/precedent data 240
          python3 tools/make_site.py
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "hanrei-lens bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data index.html sw.js robots.txt manifest.webmanifest terms.html src/part3.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No data changes."
          else
            git commit -m "data: update from japanese-law-analysis/data_set ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  # GITHUB_TOKEN による push では pages.yml が起動しないため、ここで配信まで行う
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_pages.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
