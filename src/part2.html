const CASES = [
{id:"c001",lid:51807,name:"尊属殺重罰規定違憲判決",caseNo:"昭和45(あ)1310",date:"1973-04-04",wareki:"昭和48年4月4日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄自判",reporter:"刑集27巻3号265頁",areas:["憲法","刑事"],
 holdings:"尊属殺の法定刑を死刑又は無期懲役刑のみに限っている刑法200条は、憲法14条1項に違反する。",
 summary:"尊属に対する尊重報恩という道義を保護するという立法目的自体は不合理とはいえない。しかし、法定刑を死刑・無期懲役に限定し、執行猶予を付す余地をほとんど残さない点は、普通殺に関する刑法199条の法定刑と比べて著しく不合理な差別的取扱いであり、憲法14条1項に違反して無効である。最高裁が法令を違憲と判断した最初の判決。",
 laws:["憲法14条1項","刑法199条","刑法200条"],tags:["法の下の平等","法令違憲","尊属殺","刑罰の均衡"]},
{id:"c002",lid:51936,name:"薬事法距離制限違憲判決",caseNo:"昭和43(行ツ)120",date:"1975-04-30",wareki:"昭和50年4月30日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄自判",reporter:"民集29巻4号572頁",areas:["憲法","行政"],
 holdings:"薬局開設の許可条件として適正配置（距離制限）を定める薬事法6条2項・4項は、憲法22条1項に違反する。",
 summary:"職業の許可制は、重要な公共の利益のために必要かつ合理的な措置であることを要し、国民の生命・健康に対する危険防止という消極的・警察的目的の規制は、より緩やかな規制では目的を達成できない場合に限って許される。薬局の距離制限は、不良医薬品の供給防止という目的との関係で必要かつ合理的とはいえず、違憲・無効である。",
 laws:["憲法22条1項","薬事法6条2項","薬事法6条4項"],tags:["職業選択の自由","営業の自由","消極目的規制","法令違憲"]},
{id:"c003",lid:55203,name:"森林法共有林分割制限違憲判決",caseNo:"昭和59(オ)805",date:"1987-04-22",wareki:"昭和62年4月22日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"民集41巻3号408頁",areas:["憲法","民事"],
 holdings:"共有森林につき持分価額2分の1以下の共有者の分割請求を禁じる森林法186条は、憲法29条2項に違反する。",
 summary:"財産権に対する規制は、規制目的が公共の福祉に合致し、規制手段が目的達成のため必要性・合理性を有していなければならない。森林法186条は森林経営の安定を目的とするが、共有林の分割を制限することがその目的に合理的に結びつくとはいえず、必要な限度を超えた規制であるとして違憲とされた。",
 laws:["憲法29条2項","森林法186条","民法256条1項"],tags:["財産権","共有物分割","法令違憲","規制目的二分論"]},
{id:"c004",lid:57038,name:"郵便法違憲判決",caseNo:"平成11(オ)1767",date:"2002-09-11",wareki:"平成14年9月11日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"民集56巻7号1439頁",areas:["憲法","民事"],
 holdings:"書留郵便物について郵便業務従事者の故意又は重過失による損害の賠償責任を免除・制限する郵便法68条・73条の規定は、憲法17条に違反する。",
 summary:"憲法17条は国家賠償の要件を法律に委ねているが、立法裁量は無制限ではなく、免責・制限の目的の正当性とその手段の合理性・必要性を総合的に判断する必要がある。書留郵便物について故意・重過失による損害の賠償責任まで免除・制限する部分、および特別送達郵便物について軽過失による損害の賠償責任を免除・制限する部分は、合理性・必要性を欠き違憲である。",
 laws:["憲法17条","郵便法68条","郵便法73条","国家賠償法"],tags:["国家賠償","立法裁量","法令違憲","書留"]},
{id:"c005",lid:52338,name:"在外日本人選挙権訴訟",caseNo:"平成13(行ツ)82 ほか",date:"2005-09-14",wareki:"平成17年9月14日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"一部破棄自判",reporter:"民集59巻7号2087頁",areas:["憲法","行政"],
 holdings:"在外国民に選挙区選挙の投票を認めていなかった公職選挙法の規定は憲法15条1項・3項、43条1項、44条ただし書に違反する。立法不作為を理由とする国家賠償請求を認容した。",
 summary:"国民の選挙権またはその行使を制限するには、やむを得ないと認められる事由がなければならない。在外国民の投票を長期にわたり認めなかった立法不作為は、国会が正当な理由なく長期にわたり立法措置を怠った場合に当たり、例外的に国家賠償法上違法となる。次回の選挙において在外国民が投票できる地位にあることの確認請求も認められた。",
 laws:["憲法15条1項","憲法15条3項","憲法43条1項","憲法44条","公職選挙法","国家賠償法1条1項"],tags:["選挙権","立法不作為","国家賠償","確認訴訟"]},
{id:"c006",lid:36415,name:"国籍法違憲判決",caseNo:"平成18(行ツ)135",date:"2008-06-04",wareki:"平成20年6月4日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄自判",reporter:"民集62巻6号1367頁",areas:["憲法","家族"],
 holdings:"日本国民である父から出生後に認知された子について、父母の婚姻を国籍取得の要件とする国籍法3条1項は、遅くとも平成15年当時には憲法14条1項に違反していた。",
 summary:"国籍は重要な法的地位であり、子にとって自らの意思や努力で変えられない事柄を理由に不利益を及ぼすことは、慎重な検討を要する。父母の婚姻という要件は、家族生活の実態の変化や国際的動向に照らして立法目的との合理的関連性を失っており、違憲である。違憲部分を除いた規定に基づき、届出による国籍取得を認めた。",
 laws:["憲法14条1項","国籍法3条1項"],tags:["法の下の平等","国籍","嫡出","法令違憲"]},
{id:"c007",lid:83520,name:"非嫡出子相続分違憲決定",caseNo:"平成24(ク)984・985",date:"2013-09-04",wareki:"平成25年9月4日",court:"最高裁判所",bench:"大法廷",kind:"決定",result:"破棄差戻",reporter:"民集67巻6号1320頁",areas:["憲法","家族","民事"],
 holdings:"嫡出でない子の相続分を嫡出子の2分の1とする民法900条4号ただし書前段は、遅くとも平成13年7月当時において憲法14条1項に違反していた。",
 summary:"家族形態の多様化、国民意識の変化、諸外国の立法動向、国際人権条約上の指摘などを総合すると、父母が婚姻関係になかったという子が自ら選択できない事柄を理由に不利益を及ぼすことは許されない。本決定の違憲判断は、すでに確定した遺産分割等の法律関係には影響を及ぼさないとされた。",
 laws:["憲法14条1項","民法900条4号"],tags:["法の下の平等","相続分","非嫡出子","法令違憲"]},
{id:"c008",lid:85547,name:"再婚禁止期間違憲判決",caseNo:"平成25(オ)1079",date:"2015-12-16",wareki:"平成27年12月16日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"民集69巻8号2427頁",areas:["憲法","家族"],
 holdings:"女性についてのみ6か月の再婚禁止期間を定める民法733条1項のうち、100日を超えて再婚を禁止する部分は憲法14条1項・24条2項に違反する。",
 summary:"再婚禁止期間の立法目的である父性推定の重複回避との関係で、100日の禁止期間は合理性を有するが、それを超える部分は医療・科学技術の発達や社会状況の変化により合理性を欠くに至った。ただし、国会が正当な理由なく立法措置を怠ったとまではいえず、国家賠償法上の違法はないとして請求は棄却された。",
 laws:["憲法14条1項","憲法24条2項","民法733条1項","国家賠償法1条1項"],tags:["法の下の平等","婚姻","再婚禁止期間","法令違憲"]},
{id:"c009",lid:85546,name:"夫婦同氏制合憲判決",caseNo:"平成26(オ)1023",date:"2015-12-16",wareki:"平成27年12月16日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"民集69巻8号2586頁",areas:["憲法","家族"],
 holdings:"夫婦が婚姻の際に夫又は妻の氏を称すると定める民法750条は、憲法13条、14条1項、24条に違反しない。",
 summary:"氏の変更を強制されない自由は憲法13条によって保障される人格権の一内容とはいえない。夫婦同氏制は形式的には性別による不平等を定めたものではなく、家族の呼称を一つに定めることには合理性がある。通称使用の広がりにより不利益は一定程度緩和されており、制度の在り方は国会で論ぜられ判断されるべきとした。",
 laws:["憲法13条","憲法14条1項","憲法24条","民法750条"],tags:["婚姻","氏","人格権","立法裁量"]},
{id:"c010",lid:52665,name:"北方ジャーナル事件",caseNo:"昭和56(オ)609",date:"1986-06-11",wareki:"昭和61年6月11日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"民集40巻4号872頁",areas:["憲法","民事"],
 holdings:"名誉毀損のおそれのある出版物の事前差止めは原則として許されないが、表現内容が真実でなく又は専ら公益を図る目的でないことが明白で、かつ被害者が重大で著しく回復困難な損害を被るおそれがあるときは例外的に許される。",
 summary:"出版物の頒布等の事前差止めは表現の自由に対する重大な制約であり、公務員や公職の候補者に対する評価・批判に関する表現については原則として許されない。ただし、上記の厳格な要件を満たす場合には、人格権としての名誉権に基づく差止めが例外的に認められる。",
 laws:["憲法21条","民法709条","民法710条","民法723条"],tags:["表現の自由","事前抑制","名誉毀損","差止め"]},
{id:"c011",lid:51931,name:"三菱樹脂事件",caseNo:"昭和43(オ)932",date:"1973-12-12",wareki:"昭和48年12月12日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"民集27巻11号1536頁",areas:["憲法","労働"],
 holdings:"憲法の自由権的基本権の保障規定は私人相互の関係を直接規律するものではなく、企業が特定の思想・信条を有する者の雇入れを拒んでも当然に違法とはいえない。",
 summary:"憲法19条・14条の規定は国または公共団体と個人との関係を規律するものであり、私人間の関係には直接適用されない。私人間の利益衝突は民法1条、90条や不法行為に関する規定の適正な運用によって調整される（間接適用説）。企業には契約締結の自由があり、採用にあたり応募者の思想・信条を調査し、それを理由に採用を拒否しても違法ではない。",
 laws:["憲法14条","憲法19条","民法1条","民法90条","民法709条"],tags:["私人間効力","思想良心の自由","採用の自由","試用期間"]},
{id:"c012",lid:53530,name:"苫米地事件",caseNo:"昭和30(オ)96",date:"1960-06-08",wareki:"昭和35年6月8日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"民集14巻7号1206頁",areas:["憲法"],
 holdings:"衆議院の解散のような直接国家統治の基本に関する高度に政治性のある国家行為は、裁判所の審査権の外にある。",
 summary:"三権分立のもと、高度に政治性のある国家行為の有効性の判断は、主権者である国民に対して政治的責任を負う政府・国会等の政治部門の判断に委ねられ、最終的には国民の政治判断に委ねられるべきものである。衆議院の解散の効力について、裁判所はその有効無効を審査しない（統治行為論）。",
 laws:["憲法7条","憲法69条","憲法81条"],tags:["統治行為","衆議院の解散","司法審査の限界"]},
{id:"c013",lid:55816,name:"砂川事件",caseNo:"昭和34(あ)710",date:"1959-12-16",wareki:"昭和34年12月16日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"刑集13巻13号3225頁",areas:["憲法","刑事"],
 holdings:"日米安全保障条約のように高度の政治性を有する条約は、一見極めて明白に違憲無効であると認められない限り、裁判所の司法審査権の範囲外にある。",
 summary:"憲法9条は日本が主権国として持つ固有の自衛権を否定していない。安保条約は主権国としての日本の存立の基礎に極めて重大な関係を持つ高度の政治性を有し、その内容の違憲審査は純司法的機能を使命とする司法裁判所の審査には原則としてなじまず、第一次的には内閣・国会の判断に従うべきである。",
 laws:["憲法9条","憲法98条2項","日米安全保障条約","刑事特別法2条"],tags:["統治行為","安保条約","自衛権","司法審査の限界"]},
{id:"c014",lid:50906,name:"全農林警職法事件",caseNo:"昭和43(あ)2780",date:"1973-04-25",wareki:"昭和48年4月25日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"刑集27巻4号547頁",areas:["憲法","労働","刑事"],
 holdings:"国家公務員の争議行為を一律に禁止し、そのあおり行為等を処罰する国家公務員法の規定は憲法28条に違反しない。",
 summary:"公務員の地位の特殊性と職務の公共性に照らし、争議行為の禁止は勤労者の団結権等を保障した憲法28条に違反しない。公務員の勤務条件は法律・予算によって定められるべきもので、争議行為は議会制民主主義に背馳し、市場の抑制力も欠く。それまでの全逓東京中郵事件判決等の限定的解釈を改めた。",
 laws:["憲法28条","国家公務員法98条","国家公務員法110条1項17号"],tags:["公務員の労働基本権","争議行為","判例変更"]},
{id:"c015",lid:55154,name:"堀木訴訟",caseNo:"昭和51(行ツ)30",date:"1982-07-07",wareki:"昭和57年7月7日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"民集36巻7号1235頁",areas:["憲法","行政"],
 holdings:"憲法25条の規定の趣旨を具体的立法として実現するには立法府の広い裁量が認められ、著しく合理性を欠き明らかに裁量の逸脱・濫用と見ざるを得ない場合を除き、裁判所の審査判断に適しない。",
 summary:"「健康で文化的な最低限度の生活」は抽象的・相対的な概念で、その具体化には高度の専門技術的考察と政策的判断を要する。障害福祉年金と児童扶養手当の併給を禁止する規定は、立法裁量の範囲内であり憲法25条・14条に違反しない。",
 laws:["憲法25条","憲法14条1項","児童扶養手当法4条3項3号"],tags:["生存権","立法裁量","併給禁止","社会保障"]},
{id:"c016",lid:54970,name:"朝日訴訟",caseNo:"昭和39(行ツ)14",date:"1967-05-24",wareki:"昭和42年5月24日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"訴訟終了",reporter:"民集21巻5号1043頁",areas:["憲法","行政"],
 holdings:"生活保護受給権は一身専属の権利であり相続の対象とならず、上告人の死亡により訴訟は終了する。なお憲法25条1項は直接個々の国民に具体的権利を賦与したものではない。",
 summary:"生活保護法に基づく保護受給権は被保護者自身の最低限度の生活を維持するための権利で、被保護者の死亡により当然消滅する。「念のため」として付された意見において、何が健康で文化的な最低限度の生活かの認定判断は厚生大臣の合目的的裁量に委ねられ、その裁量権の限界を超え又は濫用した場合に限り違法となりうるとされた。",
 laws:["憲法25条","生活保護法8条","生活保護法9条"],tags:["生存権","プログラム規定","生活保護","一身専属"]},
{id:"c017",lid:51271,name:"チャタレー事件",caseNo:"昭和28(あ)1713",date:"1957-03-13",wareki:"昭和32年3月13日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"刑集11巻3号997頁",areas:["憲法","刑事"],
 holdings:"刑法175条のわいせつ文書とは、徒らに性欲を興奮又は刺激せしめ、普通人の正常な性的羞恥心を害し、善良な性的道義観念に反するものをいう。",
 summary:"翻訳小説の出版がわいせつ文書販売罪に問われた事件。芸術的作品であってもわいせつ性を否定されるものではなく、芸術性とわいせつ性は次元を異にする。性的秩序を守り最小限度の性道徳を維持することは公共の福祉の内容をなし、出版の自由も公共の福祉によって制限される。",
 laws:["憲法21条","刑法175条"],tags:["表現の自由","わいせつ","公共の福祉","出版"]},
{id:"c018",lid:50977,name:"博多駅テレビフィルム提出命令事件",caseNo:"昭和44(し)68",date:"1969-11-26",wareki:"昭和44年11月26日",court:"最高裁判所",bench:"大法廷",kind:"決定",result:"特別抗告棄却",reporter:"刑集23巻11号1490頁",areas:["憲法","刑事"],
 holdings:"報道の自由は憲法21条の保障のもとにあり、報道のための取材の自由も憲法21条の精神に照らし十分尊重に値する。取材フィルムの提出命令の可否は、公正な刑事裁判実現の必要性と取材の自由が妨げられる程度等を比較衡量して決する。",
 summary:"報道機関の報道は国民の知る権利に奉仕するものであり、取材の自由も尊重されるべきである。しかし公正な刑事裁判の実現という憲法上の要請があるときは、取材の自由もある程度の制約を受ける。本件フィルムは証拠上必要性が高く、報道機関の不利益は将来の取材の自由が妨げられるおそれにとどまるとして、提出命令は適法とされた。",
 laws:["憲法21条","刑事訴訟法99条","刑事訴訟法1条"],tags:["報道の自由","取材の自由","比較衡量","知る権利"]},
{id:"c019",lid:54189,name:"津地鎮祭事件",caseNo:"昭和46(行ツ)69",date:"1977-07-13",wareki:"昭和52年7月13日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄自判",reporter:"民集31巻4号533頁",areas:["憲法","行政"],
 holdings:"憲法20条3項が禁止する宗教的活動とは、国及びその機関の活動で宗教とのかかわり合いをもつすべての行為ではなく、行為の目的が宗教的意義をもち、その効果が宗教に対する援助・助長・促進又は圧迫・干渉等になるような行為をいう。",
 summary:"市が市体育館の起工式を神式の地鎮祭として挙行し公金を支出したことについて、地鎮祭は建築工事の慣習化した社会的儀礼であり、その目的は世俗的で、効果も神道を援助・助長するものではないとして、宗教的活動には当たらないとした。いわゆる目的効果基準を示した判決。",
 laws:["憲法20条3項","憲法89条","地方自治法242条の2"],tags:["政教分離","目的効果基準","住民訴訟","地鎮祭"]},
{id:"c020",lid:54777,name:"愛媛玉串料訴訟",caseNo:"平成4(行ツ)156",date:"1997-04-02",wareki:"平成9年4月2日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄自判",reporter:"民集51巻4号1673頁",areas:["憲法","行政"],
 holdings:"県が靖国神社の例大祭等に際し玉串料等を公金から支出して奉納したことは、憲法20条3項の禁止する宗教的活動に当たり、憲法89条にも違反する。",
 summary:"玉串料等の奉納は、地鎮祭のような慣習化した社会的儀礼とはいえず、その目的が宗教的意義を持つことを免れず、特定の宗教団体との間にのみ意識的に特別のかかわり合いを持つことになる。一般人に対して県が特定の宗教団体を特別に支援しているとの印象を与え、特定の宗教への関心を呼び起こすものであり違憲。",
 laws:["憲法20条3項","憲法89条","地方自治法242条の2"],tags:["政教分離","目的効果基準","住民訴訟","玉串料"]},
{id:"c021",lid:38347,name:"空知太神社事件",caseNo:"平成19(行ツ)260",date:"2010-01-20",wareki:"平成22年1月20日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"民集64巻1号1頁",areas:["憲法","行政"],
 holdings:"市が神社施設の敷地として市有地を無償で提供している状態は、諸般の事情を考慮し社会通念に照らして総合的に判断すると、憲法89条・20条1項後段に違反する。",
 summary:"国公有地が無償で宗教的施設の敷地として利用されている状態が政教分離原則に違反するかは、施設の性格、無償提供に至った経緯、利用の態様、一般人の評価等を考慮して総合的に判断すべきである。本件では違憲状態にあるが、その解消手段には撤去以外の合理的方法もありうるとして差し戻された。",
 laws:["憲法20条1項","憲法89条","地方自治法242条の2"],tags:["政教分離","総合判断","公有地","住民訴訟"]},
{id:"c022",lid:53234,name:"衆議院議員定数不均衡訴訟（昭和51年）",caseNo:"昭和49(行ツ)75",date:"1976-04-14",wareki:"昭和51年4月14日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"民集30巻3号223頁",areas:["憲法","行政"],
 holdings:"議員定数配分規定は、投票価値の平等の要求に反する程度となり、かつ合理的期間内にその是正が行われない場合に憲法14条1項等に違反する。本件配分規定は違憲であるが、事情判決の法理により選挙自体は無効としない。",
 summary:"各選挙人の投票価値の平等は憲法の要求するところであり、最大較差約1対5に達していた本件定数配分規定は、合理的期間内に是正されなかったものとして違憲である。ただし選挙を無効とすると憲法の予定しない事態を生じるため、行政事件訴訟法31条の事情判決の法理を適用し、主文で違法を宣言するにとどめた。",
 laws:["憲法14条1項","憲法15条","憲法44条","公職選挙法204条","行政事件訴訟法31条"],tags:["投票価値の平等","一票の較差","事情判決","定数配分"]},
{id:"c023",lid:51070,name:"徳島市公安条例事件",caseNo:"昭和48(あ)910",date:"1975-09-10",wareki:"昭和50年9月10日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"刑集29巻8号489頁",areas:["憲法","刑事","行政"],
 holdings:"刑罰法規の定める犯罪構成要件があいまい不明確のゆえに憲法31条に違反するかは、通常の判断能力を有する一般人の理解において具体的場合に当該行為がその適用を受けるかどうかの判断を可能ならしめる基準が読みとれるかによって決する。",
 summary:"「交通秩序を維持すること」を集団行進の遵守事項とする市条例の規定は、一般人が殊更な交通秩序の阻害をもたらす行為を禁止していると理解できるため、不明確とはいえない。また条例が国の法令に違反するかは、両者の対象事項と規定文言を対比するのみでなく、それぞれの趣旨・目的・内容・効果を比較して矛盾抵触があるかで判断する。",
 laws:["憲法31条","憲法94条","道路交通法77条","徳島市公安条例3条"],tags:["明確性の原則","条例と法律","集団行進","漠然性"]},
{id:"c024",lid:0,name:"麹町中学内申書事件",caseNo:"昭和57(オ)915",date:"1988-07-15",wareki:"昭和63年7月15日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"上告棄却",reporter:"判時1287号65頁",areas:["憲法","民事"],
 holdings:"内申書に生徒の学生運動等の外部的活動を記載しても、その思想・信条そのものを記載したものではなく、憲法19条・21条に違反しない。",
 summary:"高校入試の内申書に「校内において麹町中全共闘を名乗り機関紙を発行した」等の記載がされたことについて、記載内容は生徒の思想・信条そのものではなく、これを了知しうるものでもないから、記載に係る外部的行為によって思想・信条を了知しうるとはいえず、これを入学者選抜の資料に供したことは違法ではないとした。",
 laws:["憲法19条","憲法21条","憲法26条","民法709条"],tags:["思想良心の自由","内申書","教育","表現の自由"]},
{id:"c025",lid:55882,name:"エホバの証人剣道拒否事件",caseNo:"平成7(行ツ)74",date:"1996-03-08",wareki:"平成8年3月8日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"上告棄却",reporter:"民集50巻3号469頁",areas:["憲法","行政"],
 holdings:"信仰上の理由で剣道実技への参加を拒否した学生に対し、代替措置を検討することもなく行われた原級留置処分・退学処分は、社会観念上著しく妥当を欠き裁量権の範囲を超え違法である。",
 summary:"高等専門学校における剣道実技の履修は必須のものとはいえず、学生の拒否は信仰の核心部分と密接に関連する真摯なものであった。退学処分は学生の身分を剥奪する重大な措置であり、他の体育種目やレポート提出等の代替措置が可能であったにもかかわらず考慮しなかった学校長の判断は、裁量権の逸脱に当たる。",
 laws:["憲法20条","学校教育法","学校教育法施行規則"],tags:["信教の自由","裁量権の逸脱","退学処分","代替措置"]},
{id:"c026",lid:52449,name:"泉佐野市民会館事件",caseNo:"平成元(オ)762",date:"1995-03-07",wareki:"平成7年3月7日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"上告棄却",reporter:"民集49巻3号687頁",areas:["憲法","行政"],
 holdings:"集会の用に供される公の施設の利用を拒否できるのは、利用によって他の基本的人権が侵害され公共の安全が損なわれる危険を回避する必要性が優越する場合に限られ、その危険性は明らかな差し迫った危険の発生が具体的に予見されることを要する。",
 summary:"市民会館条例の「公の秩序をみだすおそれがある場合」という不許可事由は、集会の自由を保障する憲法21条の趣旨に照らして厳格に限定解釈すべきである。本件では対立する団体との衝突により生命・身体に対する危険が具体的に予見されたとして不許可処分は適法とされた。",
 laws:["憲法21条","地方自治法244条","泉佐野市民会館条例7条"],tags:["集会の自由","公の施設","明白かつ現在の危険","限定解釈"]},
{id:"c027",lid:53375,name:"成田新法事件",caseNo:"昭和61(行ツ)11",date:"1992-07-01",wareki:"平成4年7月1日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"民集46巻5号437頁",areas:["憲法","行政"],
 holdings:"憲法31条の定める法定手続の保障は行政手続にも及びうるが、行政処分の相手方に事前の告知・弁解・防御の機会を与えるかどうかは、制限を受ける権利利益の内容・性質と達成しようとする公益の内容・程度・緊急性等を総合較量して決定される。",
 summary:"いわゆる成田新法に基づく工作物使用禁止命令について、暴力主義的破壊活動を防止するという公益の高度の必要性と緊急性に照らし、事前に告知・弁解・防御の機会を与える旨の規定がなくとも憲法31条に違反しないとした。命令によって制限される集会の自由についても、憲法21条に違反しない。",
 laws:["憲法31条","憲法21条","憲法35条","新東京国際空港の安全確保に関する緊急措置法3条"],tags:["適正手続","行政手続","告知と聴聞","総合較量"]},
{id:"c028",lid:51765,name:"京都府学連事件",caseNo:"昭和40(あ)1187",date:"1969-12-24",wareki:"昭和44年12月24日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"刑集23巻12号1625頁",areas:["憲法","刑事"],
 holdings:"何人もその承諾なしにみだりにその容ぼう・姿態を撮影されない自由を有する。ただし現に犯罪が行われ又は行われた後間がないと認められ、証拠保全の必要性・緊急性があり、撮影が一般的に許容される限度を超えない相当な方法で行われる場合、警察官による写真撮影は許容される。",
 summary:"個人の私生活上の自由の一つとして、承諾なしに容ぼう等を撮影されない自由が憲法13条により保障される。デモ行進の許可条件違反の状況を確認するために警察官が行った写真撮影は、上記の要件を満たし適法であり、これに対する公務執行妨害罪の成立が認められた。",
 laws:["憲法13条","憲法35条","刑法95条1項"],tags:["肖像権","プライバシー","写真撮影","任意捜査"]},
{id:"c029",lid:52357,name:"早稲田大学講演会名簿提出事件",caseNo:"平成14(受)1656",date:"2003-09-12",wareki:"平成15年9月12日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"民集57巻8号973頁",areas:["民事","憲法"],
 holdings:"学籍番号、氏名、住所及び電話番号は、プライバシーに係る情報として法的保護の対象となり、本人の同意を得ずに警察に開示した大学の行為は不法行為を構成する。",
 summary:"外国要人の講演会に参加を申し込んだ学生の名簿を大学が無断で警察に提出した事件。個人識別等のための単純な情報であっても、本人が自己の欲しない他者にはみだりに開示されたくないと考えることは自然であり、その期待は保護されるべきである。同意を得ることは容易であったにもかかわらず無断で開示したことは、プライバシーの侵害として不法行為に当たる。",
 laws:["民法709条","民法710条","憲法13条"],tags:["プライバシー","個人情報","不法行為","大学"]},
{id:"c030",lid:35933,name:"住基ネット訴訟",caseNo:"平成19(オ)403・平成19(受)454",date:"2008-03-06",wareki:"平成20年3月6日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄自判",reporter:"民集62巻3号665頁",areas:["憲法","行政"],
 holdings:"個人に関する情報をみだりに第三者に開示又は公表されない自由は憲法13条により保障されるが、住民基本台帳ネットワークシステムによる本人確認情報の管理・利用等は、この自由を侵害するものではない。",
 summary:"本人確認情報は秘匿性の高い情報とはいえず、住基ネットのシステム上の安全性や法制度上の保護措置に照らし、正当な行政目的の範囲を逸脱して第三者に開示・公表される具体的な危険は認められない。したがって行政機関が住基ネットにより住民の本人確認情報を管理・利用することは憲法13条に違反しない。",
 laws:["憲法13条","住民基本台帳法30条の5"],tags:["プライバシー","個人情報","住基ネット","自己情報コントロール"]},
{id:"c031",lid:81179,name:"衆議院一人別枠方式違憲状態判決",caseNo:"平成22(行ツ)207",date:"2011-03-23",wareki:"平成23年3月23日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"民集65巻2号755頁",areas:["憲法","行政"],
 holdings:"一人別枠方式を含む衆議院小選挙区の選挙区割りは、憲法の投票価値の平等の要求に反する状態に至っていたが、憲法上要求される合理的期間内における是正がされなかったとはいえず、憲法に違反しない。",
 summary:"各都道府県にあらかじめ1議席を配分する一人別枠方式は、制度導入時の合理性が失われており、投票価値の較差を生じさせる主要な要因となっていた。本件選挙時点では違憲状態にあったが、合理的期間内の是正がされなかったとまではいえないとして、選挙を無効とはしなかった。できるだけ速やかに一人別枠方式を廃止し、区割規定を改正することが求められるとした。",
 laws:["憲法14条1項","憲法43条","公職選挙法13条","衆議院議員選挙区画定審議会設置法3条"],tags:["投票価値の平等","一票の較差","違憲状態","一人別枠方式"]},
{id:"c032",lid:91190,name:"在外邦人国民審査権訴訟",caseNo:"令和2(行ツ)255 ほか",date:"2022-05-25",wareki:"令和4年5月25日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"民集76巻4号711頁",areas:["憲法","行政"],
 holdings:"在外国民に最高裁判所裁判官の国民審査権の行使を認めていない国民審査法は、憲法15条1項、79条2項・3項に違反する。",
 summary:"国民審査権は選挙権と同様の性質を有し、その行使を制限するにはやむを得ない事由がなければならない。在外国民に審査権の行使を全く認めていないことについてやむを得ない事由があるとはいえず、違憲である。次回の国民審査において審査権を行使できる地位にあることの確認請求を認容し、立法不作為の違法を理由とする国家賠償請求も認容した。",
 laws:["憲法15条1項","憲法79条2項","憲法79条3項","最高裁判所裁判官国民審査法","国家賠償法1条1項"],tags:["国民審査","選挙権","立法不作為","法令違憲"]},
{id:"c033",lid:90039,name:"孔子廟訴訟",caseNo:"令和元(行ツ)222",date:"2021-02-24",wareki:"令和3年2月24日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"民集75巻2号29頁",areas:["憲法","行政"],
 holdings:"市が管理する都市公園内に孔子等を祀った施設を設置することを許可した上でその敷地使用料の全額を免除した行為は、憲法20条3項の禁止する宗教的活動に該当する。",
 summary:"施設の外観や祭礼の内容から、本件施設は社寺との類似性があり宗教性を肯定できる。市が使用料を全額免除したことは、特定の宗教に対して特別の便益を提供し援助していると評価されてもやむを得ないものであり、諸般の事情を総合考慮すると、社会通念に照らして相当とされる限度を超えるとした。",
 laws:["憲法20条1項","憲法20条3項","憲法89条","地方自治法242条の2"],tags:["政教分離","総合判断","住民訴訟","公園"]},
{id:"c034",lid:92527,name:"性同一性障害特例法生殖不能要件違憲決定",caseNo:"令和2(ク)993",date:"2023-10-25",wareki:"令和5年10月25日",court:"最高裁判所",bench:"大法廷",kind:"決定",result:"破棄差戻",reporter:"民集77巻7号1792頁",areas:["憲法","家族"],
 holdings:"性別の取扱いの変更の審判を受けるための要件として生殖腺がないこと又は生殖機能を永続的に欠く状態にあることを定める特例法3条1項4号は、憲法13条に違反する。",
 summary:"自己の意思に反して身体への侵襲を受けない自由は人格的生存に関わる重要な権利として憲法13条により保障される。本件規定は、性別変更を望む者に対し生殖腺除去手術を受けることを事実上強制するもので、その制約の必要性は低減しており、制約の程度は重大である。個人の尊重の観点から、必要かつ合理的とはいえず違憲である。",
 laws:["憲法13条","性同一性障害者の性別の取扱いの特例に関する法律3条1項4号"],tags:["人格権","身体への侵襲","性別変更","法令違憲"]},
{id:"c035",lid:0,name:"旧優生保護法国家賠償請求訴訟",caseNo:"",date:"2024-07-03",wareki:"令和6年7月3日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"一部破棄自判",reporter:"裁判所ウェブサイト掲載",areas:["憲法","民事"],
 holdings:"旧優生保護法の不妊手術に関する規定は憲法13条・14条1項に違反し、同法を制定した国会の立法行為は国家賠償法上違法である。国が除斥期間の経過を主張して損害賠償責任を免れることは、信義則に反し権利の濫用として許されない。",
 summary:"特定の障害等を有する者を一方的に不良と断定し不妊手術を強制することは、個人の尊厳と人格の尊重の精神に著しく反し、立法目的自体が正当とはいえない。除斥期間について、その適用が著しく正義・公平の理念に反し到底容認できない場合には適用が制限されうるとして、従来の判例を変更した。",
 laws:["憲法13条","憲法14条1項","国家賠償法1条1項","民法724条後段"],tags:["国家賠償","除斥期間","判例変更","立法行為"]},
{id:"c036",lid:86600,name:"GPS捜査違法判決",caseNo:"平成28(あ)442",date:"2017-03-15",wareki:"平成29年3月15日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"刑集71巻3号13頁",areas:["刑事","憲法"],
 holdings:"車両にGPS端末を秘かに取り付けて位置情報を検索・把握するGPS捜査は、個人のプライバシーを侵害しうるもので、令状がなければ行うことのできない強制の処分に当たる。",
 summary:"GPS捜査は公道上のみならず個人のプライバシーが強く保護されるべき場所・空間に関わる位置情報も取得でき、個人の意思を制圧して憲法の保障する重要な法的利益を侵害する。刑訴法上の各種強制処分の令状では対応困難な問題があり、GPS捜査を導入するには立法的措置が講じられることが望ましいとした。",
 laws:["憲法35条","刑事訴訟法197条1項"],tags:["強制処分","令状主義","プライバシー","GPS"]},
{id:"c037",lid:38241,name:"川崎協同病院事件",caseNo:"平成19(あ)585",date:"2009-12-07",wareki:"平成21年12月7日",court:"最高裁判所",bench:"第三小法廷",kind:"決定",result:"上告棄却",reporter:"刑集63巻11号1899頁",areas:["刑事"],
 holdings:"回復可能性や余命について的確な判断を下せる状況になく、患者の推定的意思にも基づかないで行われた気管内チューブの抜管は、法律上許容される治療中止には当たらない。",
 summary:"被害者は昏睡状態にあったが、必要な検査が尽くされておらず余命等の判断は困難であり、家族からの要請も病状について適切な情報が伝えられた上でのものではなかった。抜管行為は殺人行為を構成するとして、殺人罪の成立が肯定された。",
 laws:["刑法199条","刑法202条"],tags:["終末期医療","治療中止","殺人罪","推定的意思"]},
{id:"c038",lid:51033,name:"白鳥決定",caseNo:"昭和46(し)67",date:"1975-05-20",wareki:"昭和50年5月20日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"特別抗告棄却",reporter:"刑集29巻5号177頁",areas:["刑事"],
 holdings:"再審請求の要件である「無罪を言い渡すべき明らかな証拠」の判断においても、「疑わしいときは被告人の利益に」という刑事裁判の鉄則が適用される。",
 summary:"再審開始のためには、確定判決における事実認定について合理的な疑いを抱かせ、その認定を覆すに足りる蓋然性のある証拠であれば足りる。新証拠の明白性は、新証拠のみを取り上げるのではなく、確定判決の証拠と総合的に評価して判断すべきとした。再審の門を広げた決定として知られる。",
 laws:["刑事訴訟法435条6号"],tags:["再審","疑わしきは被告人の利益に","新証拠","明白性"]},
{id:"c039",lid:50962,name:"川崎民商事件",caseNo:"昭和44(あ)734",date:"1972-11-22",wareki:"昭和47年11月22日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"刑集26巻9号554頁",areas:["憲法","刑事","行政"],
 holdings:"憲法35条・38条の保障は刑事手続以外の手続にも及びうるが、旧所得税法上の質問検査は刑事責任追及を目的とするものではなく、令状なしに行われても憲法35条に違反せず、供述拒否権の告知がなくても憲法38条に違反しない。",
 summary:"行政手続であっても、刑事責任追及のための資料収集に直接結びつく作用を一般的に有するものは、憲法35条・38条の保障の枠外にあるとはいえない。しかし所得税法の質問検査は、公益上の必要性と合理性があり、強制の程度も間接的心理的なものにとどまるため、令状によらないことが憲法に違反するものではない。",
 laws:["憲法35条","憲法38条1項","所得税法"],tags:["行政調査","令状主義","黙秘権","質問検査"]},
{id:"c040",lid:51825,name:"任意捜査における有形力行使事件",caseNo:"昭和50(あ)146",date:"1976-03-16",wareki:"昭和51年3月16日",court:"最高裁判所",bench:"第三小法廷",kind:"決定",result:"上告棄却",reporter:"刑集30巻2号187頁",areas:["刑事"],
 holdings:"強制処分とは、個人の意思を制圧し、身体・住居・財産等に制約を加えて強制的に捜査目的を実現する行為など、特別の根拠規定がなければ許容されない手段をいう。任意捜査においても、有形力の行使は必要性・緊急性等を考慮し、具体的状況のもとで相当と認められる限度で許容される。",
 summary:"酒気帯び運転の疑いで任意同行された者が呼気検査を拒んで退室しようとした際に警察官がその左手首をつかんだ行為について、強制処分には当たらず、任意捜査として許容される範囲内であるとして適法とされた。",
 laws:["刑事訴訟法197条1項","刑法95条1項","警察官職務執行法2条"],tags:["任意捜査","強制処分","有形力","任意同行"]},
{id:"c041",lid:0,name:"宇奈月温泉事件",caseNo:"",date:"1935-10-05",wareki:"昭和10年10月5日",court:"大審院",bench:"",kind:"判決",result:"上告棄却",reporter:"民集14巻1965頁",areas:["民事"],
 holdings:"所有権の行使が権利者に何らの利益もなく、専ら相手方を害する目的でなされる場合は、権利の濫用として許されない。",
 summary:"温泉の引湯管がわずかに他人の土地を通過していることを奇貨として、その土地を買い受けた者が引湯管の撤去または土地の高額買取りを求めた事案。撤去には莫大な費用と温泉経営への重大な支障が生じる一方、土地は利用価値がほとんどないことから、妨害排除請求は権利濫用に当たり許されないとした。",
 laws:["民法1条3項","民法206条"],tags:["権利濫用","所有権","妨害排除","信義則"]},
{id:"c042",lid:0,name:"富喜丸事件",caseNo:"",date:"1926-05-22",wareki:"大正15年5月22日",court:"大審院",bench:"連合部",kind:"判決",result:"破棄差戻",reporter:"民集5巻386頁",areas:["民事"],
 holdings:"不法行為による損害賠償の範囲についても民法416条の規定が類推適用され、通常生ずべき損害のほか、特別の事情により生じた損害は当事者がその事情を予見し又は予見しえた場合に賠償の対象となる。",
 summary:"船舶の衝突事故によって沈没した船の所有者が、事故後の船価の騰貴を前提とする損害の賠償を求めた事案。物の滅失による損害は原則として滅失当時の交換価格であるが、その後の価格騰貴による損害は、加害者が騰貴を予見しえた特別事情の損害として賠償の対象となりうるとした。",
 laws:["民法416条","民法709条"],tags:["損害賠償の範囲","相当因果関係","予見可能性","中間最高価格"]},
{id:"c043",lid:0,name:"大阪アルカリ事件",caseNo:"",date:"1916-12-22",wareki:"大正5年12月22日",court:"大審院",bench:"",kind:"判決",result:"破棄差戻",reporter:"民録22輯2474頁",areas:["民事"],
 holdings:"化学工業に従事する会社が、事業の性質に従い相当な設備を施した以上、その事業から生じた損害について過失があるとはいえない。",
 summary:"工場から排出された亜硫酸ガス等により農作物被害を受けた農民が損害賠償を求めた事案。損害の予防に相当な設備を施していたかどうかを審理することなく過失を認めた原判決を破棄した。過失の判断において企業の設備の相当性を基準とする判決として、公害事件における過失論の出発点となった。",
 laws:["民法709条"],tags:["過失","公害","相当な設備","不法行為"]},
{id:"c044",lid:54204,name:"東大ルンバール事件",caseNo:"昭和48(オ)517",date:"1975-10-24",wareki:"昭和50年10月24日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"民集29巻9号1417頁",areas:["民事"],
 holdings:"訴訟上の因果関係の立証は、一点の疑義も許されない自然科学的証明ではなく、経験則に照らして全証拠を総合検討し、特定の事実が特定の結果発生を招来した関係を是認しうる高度の蓋然性を証明することで足りる。",
 summary:"化膿性髄膜炎で入院中の幼児に対する腰椎穿刺（ルンバール）の実施直後に発作が生じ後遺症が残った事案。施術と発作・後遺症との間の因果関係について、時間的接着や病状の推移などの事情を総合すると高度の蓋然性が認められるとし、因果関係を否定した原判決を破棄した。",
 laws:["民法709条","民事訴訟法247条"],tags:["因果関係","高度の蓋然性","医療過誤","証明度"]},
{id:"c045",lid:81506,name:"更新料条項の有効性",caseNo:"平成22(オ)863",date:"2011-07-15",wareki:"平成23年7月15日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄自判",reporter:"民集65巻5号2269頁",areas:["民事"],
 holdings:"賃貸借契約書に一義的かつ具体的に記載された更新料条項は、更新料の額が賃料の額、賃貸借契約が更新される期間等に照らし高額に過ぎるなどの特段の事情がない限り、消費者契約法10条により無効とはいえない。",
 summary:"更新料は、賃料の補充ないし前払い、契約継続の対価等の趣旨を含む複合的な性質を有し、一概に不合理とはいえない。更新料条項が消費者である賃借人の利益を一方的に害するものとはいえず、本件（1年更新で賃料2か月分の更新料）は無効ではないとした。",
 laws:["消費者契約法10条","民法1条2項","借地借家法"],tags:["更新料","消費者契約","賃貸借","不当条項"]},
{id:"c046",lid:81180,name:"敷引特約の有効性",caseNo:"平成21(受)1679",date:"2011-03-24",wareki:"平成23年3月24日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"上告棄却",reporter:"民集65巻2号903頁",areas:["民事"],
 holdings:"賃貸借契約における敷引特約は、敷引金の額が補修費用として通常想定される額、賃料の額、礼金等の有無等に照らして高額に過ぎると評価される場合を除き、消費者契約法10条により無効とはいえない。",
 summary:"敷引金は通常損耗等の補修費用を賃借人に負担させる趣旨を含み、契約書に明記され賃借人が明確に認識した上で契約した場合、通常損耗の補修費用が賃料に含まれていないことを前提として合意されたものといえる。敷引金の額が高額に過ぎるとはいえない本件では、特約は有効とされた。",
 laws:["消費者契約法10条","民法1条2項"],tags:["敷引","消費者契約","賃貸借","原状回復"]},
{id:"c047",lid:86354,name:"預貯金債権の遺産分割決定",caseNo:"平成27(許)11",date:"2016-12-19",wareki:"平成28年12月19日",court:"最高裁判所",bench:"大法廷",kind:"決定",result:"破棄差戻",reporter:"民集70巻8号2121頁",areas:["民事","家族"],
 holdings:"共同相続された普通預金債権、通常貯金債権及び定期貯金債権は、いずれも相続開始と同時に当然に相続分に応じて分割されることはなく、遺産分割の対象となる。",
 summary:"預貯金は現金に近い性質を持ち、具体的な遺産分割の方法を定めるに当たっての調整に資する財産である。預貯金債権が相続開始と同時に当然分割されるとしていた従来の判例を変更し、遺産分割において預貯金を含めて共同相続人間の実質的公平を図ることを可能にした。",
 laws:["民法898条","民法907条","民法427条"],tags:["遺産分割","預貯金","判例変更","相続"]},
{id:"c048",lid:86482,name:"検索結果削除請求事件",caseNo:"平成28(許)45",date:"2017-01-31",wareki:"平成29年1月31日",court:"最高裁判所",bench:"第三小法廷",kind:"決定",result:"抗告棄却",reporter:"民集71巻1号63頁",areas:["民事","憲法"],
 holdings:"検索事業者に対し検索結果の削除を求めることができるのは、当該事実を公表されない法的利益と当該URL等を検索結果として提供する理由に関する諸事情を比較衡量し、前者が優越することが明らかな場合である。",
 summary:"検索結果の提供は検索事業者自身による表現行為の側面を有し、インターネット上の情報流通の基盤として大きな役割を果たしている。過去の逮捕歴に関する検索結果の削除請求について、事実の性質・内容、被害の程度、社会的地位、記事の目的・意義等を考慮し、公表されない利益が優越することが明らかとはいえないとして削除を認めなかった。",
 laws:["民法709条","憲法13条","憲法21条"],tags:["忘れられる権利","プライバシー","検索エンジン","比較衡量"]},
{id:"c049",lid:54992,name:"秋北バス事件",caseNo:"昭和40(オ)145",date:"1968-12-25",wareki:"昭和43年12月25日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"民集22巻13号3459頁",areas:["労働"],
 holdings:"就業規則は、その内容が合理的なものである限り、個々の労働者が同意しているか否かを問わず、その適用を受ける。新たに定年制を設ける就業規則の変更も、それが合理的なものである限り、これに同意しない労働者にも適用される。",
 summary:"就業規則は経営主体が労働条件を統一的・画一的に決定するために定めるもので、法的規範としての性質を有する。就業規則の不利益変更は原則として個々の労働者の同意なしに許されないが、当該条項が合理的なものである限り、反対する労働者も拘束される。55歳定年制の新設は合理的とされた。",
 laws:["労働基準法89条","労働基準法93条","労働基準法90条"],tags:["就業規則","不利益変更","定年制","合理性"]},
{id:"c050",lid:51922,name:"日本食塩製造事件",caseNo:"昭和43(オ)499",date:"1975-04-25",wareki:"昭和50年4月25日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"民集29巻4号456頁",areas:["労働"],
 holdings:"使用者の解雇権の行使も、それが客観的に合理的な理由を欠き社会通念上相当として是認することができない場合には、権利の濫用として無効となる。",
 summary:"ユニオン・ショップ協定に基づく解雇について、労働組合からの除名が無効である場合には、使用者が協定に基づいてした解雇は解雇権の濫用として無効になるとした。解雇権濫用法理を明示した判決であり、現在の労働契約法16条の基礎となった。",
 laws:["民法1条3項","労働組合法7条","労働契約法16条"],tags:["解雇権濫用","ユニオン・ショップ","除名","解雇"]},
{id:"c051",lid:74499,name:"高知放送事件",caseNo:"昭和49(オ)165",date:"1977-01-31",wareki:"昭和52年1月31日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"上告棄却",reporter:"労判268号17頁",areas:["労働"],
 holdings:"就業規則所定の普通解雇事由に該当する事実がある場合でも、解雇が著しく不合理であり社会通念上相当なものとして是認できないときは、権利の濫用として無効となる。",
 summary:"アナウンサーが宿直勤務中に寝過ごし、2週間に2回ラジオニュースを放送できなかったことを理由とする解雇について、悪意・故意によるものではなく、事故防止の体制も十分でなかったこと、過去に同種事故で解雇された例がないことなどから、解雇は苛酷にすぎ社会通念上相当でないとして無効とされた。",
 laws:["民法1条3項","労働契約法16条"],tags:["解雇権濫用","普通解雇","社会的相当性","放送事故"]},
{id:"c052",lid:54173,name:"東芝柳町工場事件",caseNo:"昭和45(オ)1175",date:"1974-07-22",wareki:"昭和49年7月22日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"上告棄却",reporter:"民集28巻5号927頁",areas:["労働"],
 holdings:"期間2か月の労働契約が反復更新され、期間の定めのない契約と実質的に異ならない状態で存在していた場合、雇止めの意思表示には解雇に関する法理が類推適用される。",
 summary:"臨時工として5回から23回にわたり契約が更新されてきた労働者に対する雇止めについて、契約の更新が形式的に反復されており当事者双方も長期継続を期待していた場合、雇止めは実質的に解雇の意思表示に当たるとし、解雇権濫用法理の類推により、雇止めの効力を判断すべきとした。",
 laws:["民法1条3項","民法629条","労働契約法19条"],tags:["雇止め","有期契約","解雇法理の類推","臨時工"]},
{id:"c053",lid:52138,name:"大日本印刷事件",caseNo:"昭和52(オ)94",date:"1979-07-20",wareki:"昭和54年7月20日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"上告棄却",reporter:"民集33巻5号582頁",areas:["労働"],
 holdings:"採用内定通知により、就労の始期を大学卒業直後とし、それまでの間に内定取消事由が生じた場合には解約できる旨の解約権留保付労働契約が成立する。内定取消しは、採用内定当時知ることができず知ることが期待できないような事実で、客観的に合理的で社会通念上相当と是認できるものに限られる。",
 summary:"大学卒業予定者に対し「グルーミー（陰気）な印象」を理由に採用内定を取り消した事案。その印象は内定当時から会社が把握していたものであり、内定取消事由に当たらないとして取消しを無効とした。採用内定の法的性質を明らかにした判決。",
 laws:["民法1条3項","民法627条","労働契約法16条"],tags:["採用内定","内定取消し","解約権留保","労働契約の成立"]},
{id:"c054",lid:62925,name:"東亜ペイント事件",caseNo:"昭和59(オ)1318",date:"1986-07-14",wareki:"昭和61年7月14日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"労判477号6頁",areas:["労働"],
 holdings:"転勤命令は、業務上の必要性が存しない場合、不当な動機・目的をもってなされた場合、労働者に対し通常甘受すべき程度を著しく超える不利益を負わせる場合など特段の事情がない限り、権利の濫用にならない。",
 summary:"就業規則に転勤条項があり労働協約にも同旨の規定がある場合、使用者は個別の同意なしに転勤を命じることができる。業務上の必要性は余人をもって代えがたいという高度のものである必要はなく、企業の合理的運営に寄与する点があれば足りる。母親と妻子との別居という不利益は通常甘受すべき程度のものとされた。",
 laws:["民法1条3項","労働契約法3条5号"],tags:["配転命令","転勤","権利濫用","業務上の必要性"]},
{id:"c055",lid:62868,name:"日立メディコ事件",caseNo:"昭和56(オ)225",date:"1986-12-04",wareki:"昭和61年12月4日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"上告棄却",reporter:"労判486号6頁",areas:["労働"],
 holdings:"臨時員の雇止めに解雇の法理が類推適用される場合であっても、終身雇用の期待のもとに期間の定めのない契約を締結している正社員の整理解雇とは合理的な差異があり、独立採算制の事業所において人員削減が必要な場合、臨時員の雇止めを先行させることは不合理ではない。",
 summary:"5回にわたり契約が更新された臨時員に対する雇止めについて、契約更新への期待がある程度あったとして解雇法理の類推適用を認めつつ、事業所の業績悪化に伴う人員削減の必要性と、正社員の希望退職募集を行わずに臨時員を雇止めした点も不合理とはいえないとして、雇止めを有効とした。",
 laws:["民法1条3項","労働契約法19条"],tags:["雇止め","整理解雇","有期契約","臨時員"]},
{id:"c056",lid:62769,name:"片山組事件",caseNo:"平成7(オ)1230",date:"1998-04-09",wareki:"平成10年4月9日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄差戻",reporter:"労判736号15頁",areas:["労働"],
 holdings:"労働者が職種や業務内容を特定せずに雇用された場合、現に就業を命じられた特定の業務について労務の提供が十全にはできないとしても、その能力・経験・地位、企業の規模等に照らして配置される現実的可能性がある他の業務について労務の提供ができ、かつその提供を申し出ているならば、なお債務の本旨に従った履行の提供があるといえる。",
 summary:"病気により現場監督業務に就けないと申し出た労働者に対して自宅治療命令を発し賃金を支給しなかった事案。事務作業であれば就労可能であり、その旨申し出ていたのであるから、賃金請求権を失わないとして、賃金請求を認めなかった原判決を破棄した。",
 laws:["民法536条2項","民法493条"],tags:["賃金請求権","労務提供","私傷病","債務の本旨"]},
{id:"c057",lid:52222,name:"電通事件",caseNo:"平成10(オ)217・218",date:"2000-03-24",wareki:"平成12年3月24日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"一部破棄差戻",reporter:"民集54巻3号1155頁",areas:["労働","民事"],
 holdings:"使用者は、業務の遂行に伴う疲労や心理的負荷等が過度に蓄積して労働者の心身の健康を損なうことがないよう注意する義務を負う。長時間労働によりうつ病に罹患し自殺した労働者について会社の損害賠償責任が認められ、労働者の性格等を理由とする過失相殺は許されない。",
 summary:"入社後の恒常的な長時間労働と過重な業務によって労働者がうつ病に罹患し自殺した事案。上司が労働者の健康状態の悪化を認識しながら業務軽減等の措置を講じなかったことに過失があるとして、会社の使用者責任を認めた。労働者の性格が通常想定される範囲を外れるものでない限り、過失相殺の斟酌は許されないとした。",
 laws:["民法415条","民法709条","民法715条","民法722条2項","労働安全衛生法"],tags:["安全配慮義務","過労自殺","過失相殺","長時間労働"]},
{id:"c058",lid:87785,name:"長澤運輸事件",caseNo:"平成29(受)442",date:"2018-06-01",wareki:"平成30年6月1日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"一部破棄差戻",reporter:"民集72巻2号202頁",areas:["労働"],
 holdings:"定年退職後に再雇用された有期契約労働者と正社員との労働条件の相違が労働契約法20条にいう不合理と認められるものに当たるかは、賃金の総額を比較するのみでなく、賃金項目ごとにその趣旨を個別に考慮して判断すべきである。",
 summary:"定年後再雇用の嘱託乗務員と正社員との賃金格差について、定年後再雇用であることは労働契約法20条の「その他の事情」として考慮できる。能率給・職務給の不支給や住宅手当・家族手当の不支給は不合理とはいえないが、精勤手当の不支給と、それに連動する超勤手当の計算基礎からの除外は不合理とされた。",
 laws:["労働契約法20条","パートタイム・有期雇用労働法8条"],tags:["同一労働同一賃金","定年後再雇用","有期契約","不合理な待遇差"]},
{id:"c059",lid:87784,name:"ハマキョウレックス事件",caseNo:"平成28(受)2099・2100",date:"2018-06-01",wareki:"平成30年6月1日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"一部破棄自判",reporter:"民集72巻2号88頁",areas:["労働"],
 holdings:"労働契約法20条は有期契約労働者と無期契約労働者との労働条件の相違が不合理と認められるものであることを禁止する規定であり、同条違反の労働条件の定めは無効となるが、有期契約労働者の労働条件が無期契約労働者と同一になるものではない。",
 summary:"契約社員のトラック運転手と正社員との間の各手当の相違について、無事故手当・作業手当・給食手当・通勤手当・皆勤手当の不支給は不合理とされ、住宅手当の不支給は転居を伴う配転の有無の違いから不合理ではないとされた。手当ごとにその趣旨を個別に検討する枠組みを示した判決。",
 laws:["労働契約法20条","パートタイム・有期雇用労働法8条"],tags:["同一労働同一賃金","有期契約","手当","不合理な待遇差"]},
{id:"c060",lid:52790,name:"ボールスプライン軸受事件",caseNo:"平成6(オ)1083",date:"1998-02-24",wareki:"平成10年2月24日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄差戻",reporter:"民集52巻1号113頁",areas:["知的財産"],
 holdings:"特許請求の範囲に記載された構成中に対象製品と異なる部分がある場合でも、その部分が特許発明の本質的部分ではなく、置き換えても目的を達成でき同一の作用効果を奏し、当業者が製造時点で容易に想到でき、対象製品が公知技術と同一又は容易推考でなく、出願手続で意識的に除外されたものでない場合、均等として技術的範囲に属する。",
 summary:"特許権侵害訴訟における均等論の成立要件（5要件）を最高裁として初めて明示した判決。特許出願時に将来のあらゆる侵害態様を予想して明細書を記載することは困難であり、些細な置換によって侵害を免れることを認めると発明の保護が不十分になるとして、均等侵害を肯定する余地を認めた。",
 laws:["特許法70条","特許法100条"],tags:["均等論","技術的範囲","特許侵害","5要件"]},
{id:"c061",lid:52224,name:"キルビー事件",caseNo:"平成10(オ)364",date:"2000-04-11",wareki:"平成12年4月11日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"上告棄却",reporter:"民集54巻4号1368頁",areas:["知的財産"],
 holdings:"特許に無効理由が存在することが明らかであるときは、その特許権に基づく差止め・損害賠償等の請求は、特段の事情がない限り、権利の濫用に当たり許されない。",
 summary:"特許庁の無効審決を経なくても、侵害訴訟を審理する裁判所は特許に無効理由が存在することが明らかであるか否かを判断できるとした。半導体集積回路（キルビー特許）に関する事案。この判決を受けて特許法104条の3（特許権者の権利行使の制限）が新設された。",
 laws:["特許法104条の3","特許法123条","民法1条3項"],tags:["権利濫用","無効の抗弁","特許侵害","特許法104条の3"]},
{id:"c062",lid:9356,name:"一太郎事件",caseNo:"平成17(ネ)10040",date:"2005-09-30",wareki:"平成17年9月30日",court:"知的財産高等裁判所",bench:"特別部",kind:"判決",result:"原判決取消",reporter:"判時1904号47頁",areas:["知的財産"],
 holdings:"ワープロソフトのヘルプ機能に関する特許について、出願前の引用発明から当業者が容易に発明できたものであり無効理由が存在することが明らかであるとして、特許権に基づく差止請求は権利の濫用に当たり許されない。",
 summary:"アイコンの機能説明を表示する特許を侵害するとして、ワープロソフト「一太郎」の製造販売差止めと廃棄が命じられた第一審判決を、知財高裁が大合議で取り消した事案。ソフトウェア関連発明の進歩性判断と、間接侵害の成否が争点となり、社会的にも注目された。",
 laws:["特許法29条2項","特許法101条","特許法104条の3"],tags:["進歩性","権利濫用","間接侵害","ソフトウェア特許"]},
{id:"c063",lid:81012,name:"まねきTV事件",caseNo:"平成21(受)653",date:"2011-01-18",wareki:"平成23年1月18日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄差戻",reporter:"民集65巻1号121頁",areas:["知的財産"],
 holdings:"放送番組を利用者の求めに応じて自動的に送信する機器（ベースステーション）を管理・設置し、これに放送を入力している事業者は、送信の主体として自動公衆送信を行っているものであり、送信可能化権及び公衆送信権を侵害する。",
 summary:"利用者が所有する機器を事業者が預かり、テレビ放送を利用者のインターネット端末に転送するサービスについて、各機器は1対1の送信であっても、事業者が多数の機器を管理し不特定多数の利用者に送信している以上、自動公衆送信装置に当たるとした。",
 laws:["著作権法2条1項7号の2","著作権法2条1項9号の5","著作権法23条1項","著作権法99条の2"],tags:["公衆送信権","送信可能化","自動公衆送信","放送"]},
{id:"c064",lid:81015,name:"ロクラクII事件",caseNo:"平成21(受)788",date:"2011-01-20",wareki:"平成23年1月20日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄差戻",reporter:"民集65巻1号399頁",areas:["知的財産"],
 holdings:"放送番組の複製機器を管理・支配し、放送を受信して複製機器に入力する者は、利用者の求めに応じて複製する場合であっても、複製の主体と認められ、複製権侵害となりうる。",
 summary:"親機を事業者が管理し、利用者が子機から録画指示を送ってテレビ番組を視聴するサービスについて、複製の主体の判断は、複製の対象、方法、複製への関与の内容・程度等の諸要素を考慮して行うべきとした。事業者が単なる環境提供にとどまらず、放送の受信と複製機器への入力という枢要な行為を行っている場合は複製の主体とされる。",
 laws:["著作権法21条","著作権法30条1項","著作権法98条"],tags:["複製権","利用主体","私的複製","録画サービス"]},
{id:"c065",lid:85145,name:"プロダクト・バイ・プロセス・クレーム事件",caseNo:"平成24(受)1204",date:"2015-06-05",wareki:"平成27年6月5日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"民集69巻4号700頁",areas:["知的財産"],
 holdings:"物の発明についての特許請求の範囲に物の製造方法が記載されている場合、特許発明の技術的範囲はその製造方法により製造された物と構造・特性等が同一である物として確定される。ただし、出願時に物の構造・特性を直接特定することが不可能又はおよそ実際的でない事情がない限り、明確性要件に適合しない。",
 summary:"血圧降下剤の製造方法が請求項に記載されていた特許について、いわゆる物同一説を採用し、製造方法にかかわらず同一の物であれば技術的範囲に含まれるとした。同時に、そのようなクレームの記載が許されるのは物の特定が不可能・非実際的である場合に限られるとして、明確性要件の判断枠組みを示した。",
 laws:["特許法36条6項2号","特許法70条1項"],tags:["プロダクト・バイ・プロセス","明確性要件","技術的範囲","物同一説"]},
{id:"c066",lid:53255,name:"マクリーン事件",caseNo:"昭和50(行ツ)120",date:"1978-10-04",wareki:"昭和53年10月4日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"上告棄却",reporter:"民集32巻7号1223頁",areas:["憲法","行政"],
 holdings:"外国人の在留の権利は憲法上保障されていない。外国人に対する基本的人権の保障は在留制度の枠内で与えられているにすぎず、在留期間更新の許否は法務大臣の広範な裁量に委ねられる。",
 summary:"基本的人権の保障は権利の性質上日本国民のみを対象とするものを除き外国人にも及び、政治活動の自由も外国人の地位に鑑み相当でないものを除いて保障される。しかし在留中の政治活動を在留期間更新の際に消極的事情として斟酌することは妨げられず、更新不許可処分は裁量権の逸脱・濫用に当たらないとした。",
 laws:["憲法22条","憲法21条","出入国管理令21条3項"],tags:["外国人の人権","在留資格","法務大臣の裁量","政治活動の自由"]},
{id:"c067",lid:52414,name:"小田急線高架化訴訟（原告適格）",caseNo:"平成16(行ヒ)114",date:"2005-12-07",wareki:"平成17年12月7日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"民集59巻10号2645頁",areas:["行政"],
 holdings:"都市計画事業の認可の取消訴訟において、事業地の周辺に居住し、事業に伴う騒音・振動等によって健康又は生活環境に係る著しい被害を直接的に受けるおそれのある住民は、認可の取消しを求める原告適格を有する。",
 summary:"行政事件訴訟法9条2項に基づき、処分の根拠法令のみならず関連法令（公害対策基本法、環境影響評価条例等）の趣旨・目的、および処分において考慮されるべき利益の内容・性質を考慮して法律上の利益の有無を判断すべきとした。事業地内の不動産に権利を有する者に限定していた従来の判例を変更した。",
 laws:["行政事件訴訟法9条","都市計画法59条","公害対策基本法"],tags:["原告適格","法律上の利益","判例変更","都市計画"]},
{id:"c068",lid:36787,name:"浜松市土地区画整理事業計画事件",caseNo:"平成17(行ヒ)397",date:"2008-09-10",wareki:"平成20年9月10日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"民集62巻8号2029頁",areas:["行政"],
 holdings:"市町村の施行に係る土地区画整理事業の事業計画の決定は、施行地区内の宅地所有者等の法的地位に直接的な影響を及ぼすものであり、抗告訴訟の対象となる行政処分に当たる。",
 summary:"事業計画の決定により施行地区内の宅地所有者等は換地処分を受けるべき地位に立たされ、建築行為の制限を伴うなど法的地位に変動が生じる。換地処分後に事業計画の違法を争っても事情判決がされる可能性が高く、実効的な権利救済のためには事業計画の段階で取消訴訟を認めるべきとして、処分性を否定していた従来の判例を変更した。",
 laws:["行政事件訴訟法3条2項","土地区画整理法52条","土地区画整理法76条"],tags:["処分性","事業計画","判例変更","実効的な権利救済"]},
{id:"c069",lid:54276,name:"伊方原発訴訟",caseNo:"昭和60(行ツ)133",date:"1992-10-29",wareki:"平成4年10月29日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"上告棄却",reporter:"民集46巻7号1174頁",areas:["行政"],
 holdings:"原子炉設置許可処分の取消訴訟における裁判所の審理・判断は、原子力委員会等の専門技術的な調査審議及び判断を基にしてされた行政庁の判断に不合理な点があるか否かという観点から行われるべきである。",
 summary:"具体的審査基準に不合理な点があるか、または調査審議・判断の過程に看過し難い過誤・欠落があるかを審査し、これがある場合に限り許可処分は違法となる。安全審査に関する資料は行政庁側が保持しているため、行政庁が判断に不合理な点がないことを相当の根拠・資料に基づき主張立証する必要があり、これを尽くさない場合には不合理な点があることが事実上推認される。",
 laws:["核原料物質、核燃料物質及び原子炉の規制に関する法律24条","行政事件訴訟法"],tags:["専門技術的裁量","判断過程審査","原子炉","立証責任"]},
{id:"c070",lid:90200,name:"同性婚訴訟（札幌地裁）",caseNo:"平成31(ワ)267",date:"2021-03-17",wareki:"令和3年3月17日",court:"札幌地方裁判所",bench:"",kind:"判決",result:"請求棄却",reporter:"判時2487号3頁",areas:["憲法","家族"],
 holdings:"同性愛者に対し、婚姻によって生じる法的効果の一部ですら享受する法的手段を提供していないことは、合理的根拠を欠く差別的取扱いとして憲法14条1項に違反する。ただし国家賠償法上の違法は認められない。",
 summary:"性的指向は自らの意思で選択・変更できないものであり、同性愛者と異性愛者との間の区別は性別や人種と同様に慎重に検討すべきである。婚姻の法的効果を一切享受できないことは立法府の裁量権の範囲を超えるとして違憲判断を示したが、違憲であることが国会にとって明白であったとはいえないとして損害賠償請求は棄却した。同性婚をめぐる一連の訴訟で初めての違憲判断。",
 laws:["憲法14条1項","憲法24条","民法739条","国家賠償法1条1項"],tags:["同性婚","法の下の平等","婚姻","国家賠償"]},
{id:"c071",lid:50746,name:"全逓東京中郵事件",caseNo:"昭和39(あ)296",date:"1966-10-26",wareki:"昭和41年10月26日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"刑集 第20巻8号901頁",areas:["憲法", "労働", "刑事"],
 holdings:"公務員も憲法28条の勤労者に当たり労働基本権の保障を受けるが、その制限は合理性の認められる必要最小限度にとどめるべきである。",
 summary:"郵政職員の争議行為をめぐり、公共企業体等労働関係法による争議禁止と刑事免責の関係が争われた事件。公務員にも労働基本権が保障されることを正面から認め、争議行為に対する刑事制裁は必要やむを得ない場合に限られるとした。後の全農林警職法事件で判例変更される。",
 laws:["憲法28条", "郵便法79条", "公共企業体等労働関係法17条"],tags:["公務員の労働基本権", "争議行為", "刑事免責", "判例変更前"]},
{id:"c072",lid:50812,name:"都教組事件",caseNo:"昭和41(あ)401",date:"1969-04-02",wareki:"昭和44年4月2日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄自判",reporter:"刑集 第23巻5号305頁",areas:["憲法", "労働", "刑事"],
 holdings:"地方公務員法の争議行為のあおり行為処罰規定は、違法性の強い争議行為を違法性の強い態様であおった場合に限って適用されると限定解釈すべきである。",
 summary:"教職員組合による勤務評定反対の一斉休暇闘争をめぐる事件。争議行為の禁止規定を文字どおり適用すると違憲の疑いがあるとして、処罰対象を二重に絞り込む限定解釈（二重のしぼり論）を示した。全農林警職法事件により変更された。",
 laws:["憲法28条", "地方公務員法37条", "地方公務員法61条4号"],tags:["公務員の労働基本権", "限定解釈", "二重のしぼり", "判例変更前"]},
{id:"c073",lid:51800,name:"猿払事件",caseNo:"昭和44(あ)1501",date:"1974-11-06",wareki:"昭和49年11月6日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄自判",reporter:"刑集 第28巻9号393頁",areas:["憲法", "刑事"],
 holdings:"国家公務員の政治的行為を禁止し刑罰をもって臨む国家公務員法の規定は、公務員の政治的中立性を確保するためのやむを得ない制限であり、憲法21条に違反しない。",
 summary:"郵便局員が選挙用ポスターを掲示した行為が国家公務員法違反に問われた事件。行政の中立的運営とそれに対する国民の信頼の確保という目的は正当で、禁止される行為と目的との間に合理的関連性があり、得られる利益は失われる利益に優越するとして合憲とした。",
 laws:["憲法21条", "国家公務員法102条1項", "人事院規則14-7"],tags:["公務員の政治的行為", "表現の自由", "合理的関連性", "政治的中立"]},
{id:"c074",lid:82801,name:"堀越事件",caseNo:"平成22(あ)762",date:"2012-12-07",wareki:"平成24年12月7日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"刑集 第66巻12号1337頁",areas:["憲法", "刑事"],
 holdings:"国家公務員法が禁止する政治的行為とは、公務員の職務の遂行の政治的中立性を損なうおそれが実質的に認められる行為に限られる。",
 summary:"管理職でない公務員が休日に政党機関紙を配布した行為について、職務と無関係に行われ、公務員による行為と認識しうる態様でもなかったことから、政治的中立性を損なうおそれが実質的に認められず、処罰対象に当たらないとして無罪とした。猿払事件判決を実質的に限定した。",
 laws:["憲法21条", "国家公務員法102条1項", "国家公務員法110条1項19号"],tags:["公務員の政治的行為", "実質的なおそれ", "表現の自由", "無罪"]},
{id:"c075",lid:50720,name:"三井美唄炭鉱労組事件",caseNo:"昭和38(あ)974",date:"1968-12-04",wareki:"昭和43年12月4日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"刑集 第22巻13号1425頁",areas:["憲法", "労働", "刑事"],
 holdings:"労働組合が統一候補以外の組合員の立候補を思いとどまらせるため統制処分をもって威嚇することは、組合の統制権の限界を超え違法である。",
 summary:"市議会議員選挙で組合の統一候補に選ばれなかった組合員が独自に立候補したところ、組合が統制処分をちらつかせて立候補の断念を求めた事件。労働組合には組合員に対する統制権があるが、立候補の自由は憲法15条1項の趣旨に照らし重要な基本的人権であり、これを制約することは許されないとした。",
 laws:["憲法15条1項", "憲法28条", "公職選挙法225条"],tags:["労働組合の統制権", "立候補の自由", "団体と個人", "選挙"]},
{id:"c076",lid:55040,name:"八幡製鉄事件",caseNo:"昭和41(オ)444",date:"1970-06-24",wareki:"昭和45年6月24日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"民集 第24巻6号625頁",areas:["憲法", "民事"],
 holdings:"会社は自然人と同様に政治的行為をなす自由を有し、政党への政治資金の寄付もその一環として許される。",
 summary:"会社による政党への政治献金が定款の目的の範囲外で、取締役の忠実義務違反に当たるとして株主が争った事件。会社の活動は定款所定の目的の範囲内で、社会的役割を果たすための行為も含まれ、政治献金もその範囲内であるとした。法人の人権享有主体性を認めた代表判例。",
 laws:["憲法21条", "民法43条", "商法254条の2"],tags:["法人の人権", "政治献金", "定款の目的", "株主代表訴訟"]},
{id:"c077",lid:55864,name:"南九州税理士会事件",caseNo:"平成4(オ)1796",date:"1996-03-19",wareki:"平成8年3月19日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"その他",reporter:"民集 第50巻3号615頁",areas:["憲法", "民事"],
 holdings:"税理士会が政治団体に寄付するために会員から特別会費を徴収する旨の総会決議は、税理士会の目的の範囲外の行為であり無効である。",
 summary:"強制加入団体である税理士会が、税理士法改正運動のための政治献金を目的として特別会費を徴収することの可否が争われた。政党への寄付は会員各人が市民として自主的に決めるべき事柄であり、強制加入団体がこれを多数決で会員に強制することはできないとした。",
 laws:["憲法19条", "憲法21条", "税理士法49条"],tags:["強制加入団体", "政治献金", "思想の自由", "目的の範囲"]},
{id:"c078",lid:56345,name:"日産自動車事件（女子若年定年制）",caseNo:"昭和54(オ)750",date:"1981-03-24",wareki:"昭和56年3月24日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第35巻2号300頁",areas:["憲法", "労働", "民事"],
 holdings:"女子の定年年齢を男子より低く定めた就業規則は、性別のみによる不合理な差別を定めたものとして、民法90条により無効である。",
 summary:"男子55歳、女子50歳とする定年制について、憲法14条の平等原則の趣旨を民法90条の公序良俗を通じて私人間に及ぼし、性別のみを理由とする差別として無効とした。間接適用説の典型的な適用例。",
 laws:["憲法14条1項", "民法90条", "民法1条の2"],tags:["男女差別", "定年制", "私人間効力", "公序良俗"]},
{id:"c079",lid:52690,name:"税関検査事件",caseNo:"昭和57(行ツ)156",date:"1984-12-12",wareki:"昭和59年12月12日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"民集 第38巻12号1308頁",areas:["憲法", "行政"],
 holdings:"税関検査による輸入禁制品の該当性審査は憲法21条2項の検閲に当たらない。検閲とは、行政権が主体となり、思想内容等の表現物を対象に、発表前に網羅的一般的に審査して発表を禁止することをいう。",
 summary:"わいせつ表現物の輸入を禁じる関税定率法の規定と税関検査の合憲性が争われた事件。検閲の定義を明確にし、税関検査は国外で既に発表済みの表現物を対象とし、思想内容の審査を目的とせず、司法審査の機会もあることから検閲に当たらないとした。",
 laws:["憲法21条2項", "関税定率法21条1項3号"],tags:["検閲", "税関検査", "表現の自由", "事前抑制"]},
{id:"c080",lid:51114,name:"外務省秘密電文漏洩事件（西山記者事件）",caseNo:"昭和51(あ)1581",date:"1978-05-31",wareki:"昭和53年5月31日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"棄却",reporter:"刑集 第32巻3号457頁",areas:["憲法", "刑事"],
 holdings:"報道機関の取材活動は、真に報道の目的から出たもので、手段・方法が法秩序全体の精神に照らし相当なものである限り正当な業務行為に当たるが、取材対象者の人格の尊厳を著しく蹂躙する手段による場合は正当性を欠く。",
 summary:"新聞記者が外務省職員から沖縄返還交渉に関する秘密電文を入手した行為が国家公務員法の秘密漏洩そそのかし罪に問われた事件。取材の自由の重要性を認めつつ、本件の取材手段は相手方の人格を著しく蹂躙するものとして違法と判断した。",
 laws:["憲法21条", "国家公務員法100条1項", "国家公務員法111条"],tags:["取材の自由", "国家秘密", "正当業務行為", "報道"]},
{id:"c081",lid:50801,name:"夕刊和歌山時事事件",caseNo:"昭和41(あ)2472",date:"1969-06-25",wareki:"昭和44年6月25日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"刑集 第23巻7号975頁",areas:["憲法", "刑事"],
 holdings:"名誉毀損行為について、摘示した事実が真実であることの証明がなくても、行為者がその事実を真実と誤信し、誤信したことについて確実な資料・根拠に照らし相当の理由があるときは、故意がなく名誉毀損罪は成立しない。",
 summary:"新聞記事で他紙の記者の不正行為を報じた記者が名誉毀損罪に問われた事件。刑法230条の2の真実性の証明に失敗しても、相当の理由をもって真実と誤信した場合には処罰されないとし、表現の自由と名誉の保護の調整を図った。",
 laws:["憲法21条", "刑法230条", "刑法230条の2"],tags:["名誉毀損", "真実性の誤信", "相当の理由", "報道"]},
{id:"c082",lid:51844,name:"月刊ペン事件",caseNo:"昭和55(あ)273",date:"1981-04-16",wareki:"昭和56年4月16日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄差戻",reporter:"刑集 第35巻3号84頁",areas:["憲法", "刑事"],
 holdings:"私人の私生活上の行状であっても、その携わる社会的活動の性質やこれを通じて社会に及ぼす影響力の程度によっては、刑法230条の2第1項にいう公共の利害に関する事実に当たる場合がある。",
 summary:"宗教団体の指導者の女性問題を雑誌で報じた編集長が名誉毀損罪に問われた事件。多数の信者を擁する宗教団体の会長の行状は、その社会的影響力の大きさから公共の利害に関する事実に当たりうるとして、これを否定した原判決を破棄した。",
 laws:["刑法230条の2", "憲法21条"],tags:["名誉毀損", "公共の利害", "私人の私生活", "宗教団体"]},
{id:"c083",lid:76093,name:"石に泳ぐ魚事件",caseNo:"平成13(オ)851",date:"2002-09-24",wareki:"平成14年9月24日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"集民 第207号243頁",areas:["憲法", "民事"],
 holdings:"小説の出版等により公的立場にない者の名誉、プライバシー、名誉感情が侵害され、重大で回復困難な損害を被らせるおそれがある場合には、人格権に基づき出版等の差止めが認められる。",
 summary:"モデルとされた女性が小説の出版差止めを求めた事件。公的立場にない私人について、障害や経歴などを描写した小説が公表されれば重大で回復困難な損害を与えるおそれがあるとして、人格権に基づく差止めを認めた。表現の自由と人格権の衝突に関する代表例。",
 laws:["民法709条", "民法710条", "憲法21条", "憲法13条"],tags:["プライバシー", "出版差止め", "人格権", "小説"]},
{id:"c084",lid:52442,name:"ノンフィクション「逆転」事件",caseNo:"平成1(オ)1649",date:"1994-02-08",wareki:"平成6年2月8日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第48巻2号149頁",areas:["憲法", "民事"],
 holdings:"前科等に関わる事実を公表されない法的利益は、公表する理由との比較衡量において前者が優越する場合に法的保護を受け、公表は不法行為となる。",
 summary:"米軍統治下の沖縄で有罪判決を受けた者の実名をノンフィクション作品で公表したことが争われた事件。刑を終え社会復帰している者には前科を公表されない利益があり、作品の公表当時の社会的状況や著者の目的に照らしても実名使用の必要性はなかったとして損害賠償を認めた。",
 laws:["民法709条", "憲法13条", "憲法21条"],tags:["前科の公表", "プライバシー", "更生", "比較衡量"]},
{id:"c085",lid:52287,name:"長良川事件報道訴訟",caseNo:"平成12(受)1335",date:"2003-03-14",wareki:"平成15年3月14日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第57巻3号229頁",areas:["憲法", "民事", "少年"],
 holdings:"少年法61条が禁止する推知報道に当たるかどうかは、その記事等により不特定多数の一般人がその者を当該事件の本人であると推知できるかを基準に判断すべきである。",
 summary:"少年事件の被告人を仮名で報じた週刊誌記事がプライバシー侵害等に当たるとして争われた事件。推知報道の該当性の基準を示し、本件記事は一般人には本人と推知できないとして、違法性を認めた原判決を破棄した。",
 laws:["少年法61条", "民法709条", "憲法21条"],tags:["少年事件報道", "推知報道", "プライバシー", "仮名"]},
{id:"c086",lid:57386,name:"謝罪広告事件",caseNo:"昭和28(オ)1241",date:"1956-07-04",wareki:"昭和31年7月4日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"民集 第10巻7号785頁",areas:["憲法", "民事"],
 holdings:"名誉毀損の救済として、単に事態の真相を告白し陳謝の意を表明する程度の謝罪広告を新聞に掲載するよう命ずることは、憲法19条の良心の自由を侵害しない。",
 summary:"選挙中の演説で対立候補の名誉を毀損した者に対し、謝罪広告の掲載が命じられた事件。謝罪広告の強制が思想・良心の自由を侵すかが争われ、単に真相を告白し陳謝する程度の内容であれば、強制執行も可能で合憲とした。",
 laws:["憲法19条", "民法723条"],tags:["良心の自由", "謝罪広告", "名誉毀損", "原状回復"]},
{id:"c087",lid:52169,name:"自衛官合祀事件",caseNo:"昭和57(オ)902",date:"1988-06-01",wareki:"昭和63年6月1日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄自判",reporter:"民集 第42巻5号277頁",areas:["憲法", "民事"],
 holdings:"殉職自衛官の護国神社への合祀申請に自衛隊地方連絡部が協力した行為は、宗教とのかかわり合いが間接的で、憲法20条3項の宗教的活動に当たらない。遺族の静謐な宗教的環境の下で信仰生活を送るべき利益は、法的利益として認めることができない。",
 summary:"キリスト教徒である妻の意思に反して、殉職した自衛官が護国神社に合祀された事件。信教の自由の保障は他者の宗教上の行為に対する寛容を要請するとして、合祀により妻の法的利益が侵害されたとはいえないとした。",
 laws:["憲法20条1項", "憲法20条3項", "民法709条"],tags:["政教分離", "信教の自由", "宗教的人格権", "合祀"]},
{id:"c088",lid:56361,name:"箕面忠魂碑・慰霊祭訴訟",caseNo:"昭和62(行ツ)148",date:"1993-02-16",wareki:"平成5年2月16日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第47巻3号1687頁",areas:["憲法", "行政"],
 holdings:"市が忠魂碑を移設・再建し、その敷地を遺族会に無償貸与した行為、および市教育長が慰霊祭に参列した行為は、憲法20条3項の宗教的活動に当たらない。",
 summary:"市が小学校の増改築のために忠魂碑を移設し、遺族会に敷地を無償で貸した行為等が政教分離原則に反するとして争われた事件。忠魂碑は戦没者記念碑的な性格のものであり、市の行為の目的は専ら世俗的で、特定宗教を援助する効果もないとした。",
 laws:["憲法20条3項", "憲法89条", "地方自治法242条の2"],tags:["政教分離", "目的効果基準", "忠魂碑", "住民訴訟"]},
{id:"c089",lid:51694,name:"東京都公安条例事件",caseNo:"昭和35(あ)112",date:"1960-07-20",wareki:"昭和35年7月20日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"刑集 第14巻9号1243頁",areas:["憲法", "刑事"],
 holdings:"集団行動について公安委員会の許可を要するとする公安条例は、許可が義務付けられており実質的には届出制と異ならず、憲法21条に違反しない。",
 summary:"デモ行進を許可制とする東京都公安条例の合憲性が争われた事件。集団行動は潜在的な暴力の可能性を含むとして、公共の安寧秩序を維持するための必要最小限度の措置であれば許されるとした。新潟県公安条例事件判決よりも規制に寛容な判断として知られる。",
 laws:["憲法21条", "東京都公安条例"],tags:["集会の自由", "集団行動", "公安条例", "許可制"]},
{id:"c090",lid:56788,name:"新潟県公安条例事件",caseNo:"昭和26(あ)3188",date:"1954-11-24",wareki:"昭和29年11月24日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"刑集 第8巻11号1866頁",areas:["憲法", "刑事"],
 holdings:"行列行進や集団示威運動について、特定の場所・方法につき合理的かつ明確な基準の下に許可制をとることは憲法21条に違反しないが、一般的な許可制で事前に抑制することは許されない。",
 summary:"デモ行進を許可制とする県条例の合憲性が争われた事件。公共の秩序に対する明らかな差し迫った危険が予見されるときは不許可にできるが、一般的許可制による事前抑制は憲法の趣旨に反するとの基準を示した。",
 laws:["憲法21条", "新潟県公安条例"],tags:["集会の自由", "集団行動", "公安条例", "事前抑制"]},
{id:"c091",lid:50995,name:"小売市場距離制限事件",caseNo:"昭和45(あ)23",date:"1972-11-22",wareki:"昭和47年11月22日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"刑集 第26巻9号586頁",areas:["憲法", "刑事"],
 holdings:"小売商業調整特別措置法による小売市場の開設許可制と距離制限は、中小企業保護という積極的な社会経済政策の一環として立法裁量の範囲内にあり、憲法22条1項に違反しない。",
 summary:"個人の経済活動に対する規制のうち、社会経済政策の実施の一手段としてなされる積極目的の規制については、立法府の裁量を尊重し、規制が著しく不合理であることが明白な場合に限って違憲とする（明白性の原則）とした。薬事法事件とともに規制目的二分論の出発点となった。",
 laws:["憲法22条1項", "小売商業調整特別措置法3条1項"],tags:["営業の自由", "積極目的規制", "明白性の原則", "規制目的二分論"]},
{id:"c092",lid:54281,name:"酒類販売免許制事件",caseNo:"昭和63(行ツ)56",date:"1992-12-15",wareki:"平成4年12月15日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第46巻9号2829頁",areas:["憲法", "行政"],
 holdings:"酒税法が酒類販売業を免許制とし、経営の基礎が薄弱である場合に免許を拒否できるとしていることは、租税の適正かつ確実な賦課徴収を図るという目的のため必要かつ合理的な範囲内にあり、憲法22条1項に違反しない。",
 summary:"酒類販売業免許の拒否処分の取消しを求めた事件。租税の賦課徴収を目的とする規制については立法府の政策的・技術的判断に委ねられ、著しく不合理でない限り合憲であるとした。",
 laws:["憲法22条1項", "酒税法9条", "酒税法10条10号"],tags:["営業の自由", "免許制", "租税", "立法裁量"]},
{id:"c093",lid:56959,name:"第三者所有物没収事件",caseNo:"昭和30(あ)995",date:"1962-11-28",wareki:"昭和37年11月28日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄自判",reporter:"刑集 第16巻11号1577頁",areas:["憲法", "刑事"],
 holdings:"第三者の所有物を没収する場合に、その所有者に対し告知・弁解・防御の機会を与えることなく没収することは、憲法31条・29条に違反する。",
 summary:"密輸に使われた貨物のうち第三者の所有物を、所有者に手続上の機会を与えずに没収したことが争われた事件。被告人自身も第三者の所有物の没収について違憲を主張できるとし、適正手続の保障が財産権の剥奪にも及ぶことを明らかにした。",
 laws:["憲法31条", "憲法29条", "関税法118条1項"],tags:["適正手続", "没収", "第三者の財産", "告知と聴聞"]},
{id:"c094",lid:51808,name:"高田事件",caseNo:"昭和45(あ)1700",date:"1972-12-20",wareki:"昭和47年12月20日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄自判",reporter:"刑集 第26巻10号631頁",areas:["憲法", "刑事"],
 holdings:"審理の著しい遅延により迅速な裁判の保障条項が守られなかったと認められる異常な事態が生じた場合には、憲法37条1項に基づき審理を打ち切るという非常救済手段が認められる。",
 summary:"約15年間にわたり公判が中断された事件。迅速な裁判を受ける権利は単なるプログラム規定ではなく、保障条項に反する異常な事態が生じた場合には免訴の判決により手続を打ち切るべきであるとした。",
 laws:["憲法37条1項", "刑事訴訟法337条"],tags:["迅速な裁判", "免訴", "審理の遅延", "刑事手続"]},
{id:"c095",lid:82642,name:"参議院定数不均衡訴訟（平成24年）",caseNo:"平成23(行ツ)64",date:"2012-10-17",wareki:"平成24年10月17日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄自判",reporter:"集民 第241号91頁",areas:["憲法", "行政"],
 holdings:"最大較差1対5.00であった平成22年参議院議員通常選挙当時の定数配分規定は、投票価値の平等の要求に反する状態に至っていたが、合理的期間内に是正がされなかったとはいえず、違憲とはいえない。",
 summary:"参議院選挙についても、都道府県を単位とする選挙区制度の仕組み自体を見直すなどして投票価値の不均衡を是正する必要があるとし、都道府県単位の選挙区を維持したままでは較差を解消することが困難である旨を指摘した。",
 laws:["憲法14条1項", "憲法43条", "公職選挙法14条"],tags:["投票価値の平等", "参議院", "違憲状態", "一票の較差"]},
{id:"c096",lid:83745,name:"衆議院定数不均衡訴訟（平成25年）",caseNo:"平成25(行ツ)209",date:"2013-11-20",wareki:"平成25年11月20日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"その他",reporter:"民集 第67巻8号1503頁",areas:["憲法", "行政"],
 holdings:"平成24年衆議院議員総選挙当時の選挙区割りは、投票価値の平等の要求に反する状態にあったが、憲法上要求される合理的期間内における是正がされなかったとはいえず、憲法に違反しない。",
 summary:"一人別枠方式の廃止等を内容とする改正法が成立したものの区割りが間に合わず、最大較差2.43倍のまま行われた選挙について、違憲状態としつつ、国会の是正に向けた取組を考慮して合理的期間は経過していないとした。",
 laws:["憲法14条1項", "憲法43条", "公職選挙法13条"],tags:["投票価値の平等", "衆議院", "違憲状態", "合理的期間"]},
{id:"c097",lid:52213,name:"レペタ事件（法廷メモ訴訟）",caseNo:"昭和63(オ)436",date:"1989-03-08",wareki:"平成元年3月8日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"民集 第43巻2号89頁",areas:["憲法", "民事"],
 holdings:"傍聴人が法廷でメモを取ることは、その見聞する裁判を認識・記憶するためになされる限り、憲法21条1項の精神に照らして尊重されるべきであり、故なく妨げられてはならない。",
 summary:"米国人弁護士が裁判の傍聴中にメモを取ることを禁止されたとして国家賠償を求めた事件。筆記行為の自由は憲法21条の精神に照らし尊重されるべきで、メモを取ることが法廷の秩序を乱すおそれは通常考えられないとした。賠償請求自体は棄却された。",
 laws:["憲法21条1項", "憲法82条", "裁判所法71条"],tags:["法廷メモ", "知る権利", "裁判の公開", "法廷警察権"]},
{id:"c098",lid:57016,name:"旭川学力テスト事件",caseNo:"昭和43(あ)1614",date:"1976-05-21",wareki:"昭和51年5月21日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"その他",reporter:"刑集 第30巻5号615頁",areas:["憲法", "刑事"],
 holdings:"国は、子どもの教育の内容について、必要かつ相当と認められる範囲で決定する権能を有する。教師の教育の自由は一定の範囲で認められるが、完全な自由は認められない。",
 summary:"全国一斉学力テストを阻止しようとした教師らが公務執行妨害罪等に問われた事件。教育内容の決定権が国にあるか国民にあるかという「教育権の所在」論争について、いずれの主張も極端であるとし、国と親・教師がそれぞれ一定範囲で教育の自由を持つとした。",
 laws:["憲法26条", "憲法23条", "憲法13条", "地方公務員法"],tags:["教育権", "教育の自由", "学力テスト", "国民の教育権"]},
{id:"c099",lid:56358,name:"家永教科書訴訟（第一次）",caseNo:"昭和61(オ)1428",date:"1993-03-16",wareki:"平成5年3月16日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第47巻5号3483頁",areas:["憲法", "行政", "民事"],
 holdings:"教科書検定は、一般図書としての発行を妨げるものではなく発表禁止目的や発表前の審査などの特質がないから検閲に当たらず、表現の自由、学問の自由、教育を受ける権利を侵害しない。",
 summary:"高校日本史教科書の検定不合格処分等について、執筆者が国家賠償を求めた事件。検定制度自体は合憲としつつ、検定の判断に看過し難い過誤がある場合には裁量権の逸脱として違法になりうるとの枠組みを示した。",
 laws:["憲法21条", "憲法23条", "憲法26条", "学校教育法21条"],tags:["教科書検定", "検閲", "教育の自由", "裁量権"]},
{id:"c100",lid:54203,name:"国労広島地本事件",caseNo:"昭和48(オ)499",date:"1975-11-28",wareki:"昭和50年11月28日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"その他",reporter:"民集 第29巻10号1698頁",areas:["憲法", "労働", "民事"],
 holdings:"労働組合が組合員に対し、特定の政党や候補者を支援するための資金の納付を強制することは許されないが、他組合の争議支援のための資金の納付は組合の目的の範囲内として強制できる。",
 summary:"組合を脱退した組合員に対する未納組合費等の請求をめぐり、臨時組合費の納付義務の範囲が争われた。組合員の協力義務は組合の目的達成のため必要な範囲に限られ、政治活動への支援は組合員個人の政治的自由に関わるため強制できないとした。",
 laws:["憲法28条", "憲法19条", "労働組合法"],tags:["組合費", "協力義務", "政治活動", "労働組合"]},
{id:"c101",lid:34185,name:"君が代ピアノ伴奏拒否事件",caseNo:"平成16(行ツ)328",date:"2007-02-27",wareki:"平成19年2月27日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第61巻1号291頁",areas:["憲法", "行政"],
 holdings:"市立小学校の入学式で校長が音楽専科の教諭に国歌のピアノ伴奏を命じた職務命令は、教諭の思想・良心の自由を侵害するものとして憲法19条に違反するとはいえない。",
 summary:"ピアノ伴奏を拒否した教諭に対する戒告処分の取消しが求められた事件。伴奏を命じる職務命令は、教諭の歴史観・世界観それ自体を否定するものではなく、特定の思想を強制したり告白を求めたりするものでもないとして合憲とした。",
 laws:["憲法19条", "地方公務員法32条", "学校教育法"],tags:["思想良心の自由", "職務命令", "国歌", "公立学校"]},
{id:"c102",lid:81351,name:"君が代起立斉唱事件",caseNo:"平成22(行ツ)54",date:"2011-05-30",wareki:"平成23年5月30日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"民集 第65巻4号1780頁",areas:["憲法", "行政"],
 holdings:"卒業式における国歌斉唱の際の起立斉唱を命じる校長の職務命令は、個人の歴史観・世界観に由来する行動と異なる外部的行為を求める点で思想・良心の自由についての間接的な制約となる面があるが、その制約を許容しうる必要性・合理性が認められ、憲法19条に違反しない。",
 summary:"起立斉唱を拒否して再雇用を拒否された元教諭が争った事件。起立斉唱行為は慣例上の儀礼的所作であること、式典の円滑な進行や職務の公共性を考慮すると、間接的制約は許容されるとした。",
 laws:["憲法19条", "地方公務員法32条"],tags:["思想良心の自由", "間接的制約", "国歌", "職務命令"]},
{id:"c103",lid:52525,name:"外国人地方参政権訴訟",caseNo:"平成5(行ツ)163",date:"1995-02-28",wareki:"平成7年2月28日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第49巻2号639頁",areas:["憲法", "行政"],
 holdings:"憲法93条2項の「住民」とは日本国民を意味し、在留外国人に地方公共団体の選挙権を保障したものではないが、永住者等について法律で地方選挙権を付与することは憲法上禁止されていない。",
 summary:"定住外国人が選挙人名簿への登録を求めた事件。憲法は外国人に地方参政権を保障していないとしつつ、地域と密接な関係を持つ永住者等に法律で選挙権を与えることは立法政策の問題として許されるとした、いわゆる許容説を採用した判決。",
 laws:["憲法15条1項", "憲法93条2項", "公職選挙法"],tags:["外国人の人権", "地方参政権", "許容説", "住民"]},
{id:"c104",lid:52248,name:"東京都管理職選考受験拒否事件",caseNo:"平成10(行ツ)93",date:"2005-01-26",wareki:"平成17年1月26日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄自判",reporter:"民集 第59巻1号128頁",areas:["憲法", "行政"],
 holdings:"地方公共団体が、公権力行使等地方公務員の職とこれに昇任するための職を包含する一体的な管理職の任用制度を構築し、日本国籍の職員に限って管理職に昇任できるとすることは、労働基準法3条・憲法14条1項に違反しない。",
 summary:"韓国籍の保健師が管理職選考の受験を国籍を理由に拒否されたことを争った事件。公権力の行使や公の意思形成への参画に携わる公務員には国民主権の原理から国籍要件が許され、管理職全体を一体的に扱う制度も合理的であるとした。",
 laws:["憲法14条1項", "労働基準法3条", "地方公務員法"],tags:["外国人の人権", "公務就任権", "国籍", "国民主権"]},
{id:"c105",lid:50119,name:"指紋押捺拒否事件",caseNo:"平成2(あ)848",date:"1995-12-15",wareki:"平成7年12月15日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"刑集 第49巻10号842頁",areas:["憲法", "刑事"],
 holdings:"何人もみだりに指紋の押捺を強制されない自由を有し、この自由の保障は在留外国人にも及ぶが、外国人登録法の指紋押捺制度は在留外国人の公正な管理という正当な目的のための合理的なものであり、憲法13条に違反しない。",
 summary:"外国人登録時の指紋押捺を拒否した者が外国人登録法違反に問われた事件。指紋押捺を強制されない自由を憲法13条に基づく権利として認めたうえで、制度の目的・手段の合理性から合憲とした。",
 laws:["憲法13条", "憲法14条", "外国人登録法14条"],tags:["プライバシー", "指紋押捺", "外国人の人権", "人格権"]},
{id:"c106",lid:51799,name:"岩手教組学テ事件",caseNo:"昭和44(あ)1275",date:"1976-05-21",wareki:"昭和51年5月21日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄自判",reporter:"刑集 第30巻5号1178頁",areas:["憲法", "労働", "刑事"],
 holdings:"地方公務員法が地方公務員の争議行為を一律に禁止し、そのあおり行為等を処罰することは憲法28条に違反しない。",
 summary:"全国一斉学力テストに反対する教職員組合の争議行為をめぐる事件。全農林警職法事件判決の論理を地方公務員に及ぼし、都教組事件判決の限定解釈（二重のしぼり論）を改めた。",
 laws:["憲法28条", "地方公務員法37条", "地方公務員法61条4号"],tags:["公務員の労働基本権", "争議行為", "判例変更", "教職員組合"]},
{id:"c107",lid:54141,name:"民法94条2項類推適用（登記名義の放置）",caseNo:"昭和43(オ)91",date:"1970-09-22",wareki:"昭和45年9月22日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"その他",reporter:"民集 第24巻10号1424頁",areas:["民事"],
 holdings:"不動産の所有者が他人名義の登記がされていることを知りながら長期間これを放置した場合、民法94条2項の類推適用により、登記名義を信頼して取引した善意の第三者に対し登記名義が真実でないことを対抗できない。",
 summary:"真の所有者が自ら虚偽の登記を作出したのではなく、他人が勝手に行った登記を知りながら放置した場合にも、虚偽の外観を承認したものとして94条2項を類推適用し、善意の第三者を保護した。権利外観法理の展開を示す判決。",
 laws:["民法94条2項", "民法177条"],tags:["虚偽表示", "権利外観法理", "類推適用", "善意の第三者"]},
{id:"c108",lid:54084,name:"背信的悪意者排除論（登記欠缺を主張できない第三者）",caseNo:"昭和42(オ)564",date:"1968-08-02",wareki:"昭和43年8月2日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"民集 第22巻8号1571頁",areas:["民事"],
 holdings:"実体上物権変動があった事実を知る者が、その登記の欠缺を主張することが信義に反すると認められる事情がある場合には、その者は民法177条の第三者に当たらない。",
 summary:"不動産の二重譲渡において、先行する譲渡を知りながら高値で売りつける目的で登記を備えた者に対し、登記の欠缺を主張する正当な利益を有する第三者に当たらないとした。単なる悪意者は保護されるが、背信的悪意者は保護されないという枠組みを確立した。",
 laws:["民法177条", "民法1条2項"],tags:["対抗要件", "背信的悪意者", "二重譲渡", "登記"]},
{id:"c109",lid:54160,name:"他人物売買の売主を権利者が相続した場合",caseNo:"昭和44(オ)23",date:"1974-09-04",wareki:"昭和49年9月4日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第28巻6号169頁",areas:["民事"],
 holdings:"他人の権利の売主をその権利者が相続した場合、権利者は売主としての履行義務を承継するが、信義則に反すると認められるような特別の事情がない限り、権利の移転を拒むことができる。",
 summary:"他人の土地を売却した者を、その土地の真の所有者が相続した事案。権利者は相続によって売主の履行義務を承継するものの、自らの意思で権利を失うことを強いられる理由はなく、特段の事情がない限り履行を拒絶できるとした。無権代理人を本人が相続した場合の処理と対比される判例。",
 laws:["民法560条", "民法896条", "民法1条2項"],tags:["他人物売買", "相続", "履行拒絶", "信義則"]},
{id:"c110",lid:52032,name:"本人が無権代理人を相続した場合",caseNo:"昭和46(オ)138",date:"1973-07-03",wareki:"昭和48年7月3日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第27巻7号751頁",areas:["民事"],
 holdings:"本人が無権代理人を相続した場合、本人が無権代理行為の追認を拒絶しても信義に反しないから、無権代理行為は本人の相続により当然に有効となるものではない。",
 summary:"無権代理人の死亡により本人がその地位を相続した事案。本人は無権代理行為について追認を拒絶できる立場にあり、相続によってその立場を失わないとした。ただし無権代理人の責任（117条）は相続により承継する。",
 laws:["民法113条", "民法117条", "民法896条"],tags:["無権代理", "相続", "追認拒絶", "無権代理人の責任"]},
{id:"c111",lid:51984,name:"表見代理と代理権踰越（110条の正当な理由）",caseNo:"昭和44(オ)843",date:"1969-12-19",wareki:"昭和44年12月19日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"民集 第23巻12号2539頁",areas:["民事"],
 holdings:"民法110条の表見代理は、代理人が本人の名で権限外の行為をした場合にも、相手方がその行為を本人自身の行為と信じたことについて正当な理由があるときに類推適用される。",
 summary:"代理人が本人の名を直接用いて権限外の取引をした事案について、相手方の信頼保護の観点から110条を類推適用した。表見代理の適用範囲を広げた判例の一つ。",
 laws:["民法110条", "民法109条"],tags:["表見代理", "権限踰越", "正当な理由", "類推適用"]},
{id:"c112",lid:53564,name:"即時取得と占有改定",caseNo:"昭和32(オ)1092",date:"1960-02-11",wareki:"昭和35年2月11日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第14巻2号168頁",areas:["民事"],
 holdings:"民法192条の即時取得は、占有改定の方法による占有取得では成立しない。",
 summary:"動産の譲渡担保において占有改定による引渡しを受けた者が即時取得を主張した事案。即時取得が成立するには外観上従来の占有状態に変更を生じる占有の取得を要するとし、占有改定ではこれに当たらないとした。",
 laws:["民法192条", "民法183条"],tags:["即時取得", "占有改定", "動産", "譲渡担保"]},
{id:"c113",lid:52585,name:"抵当権に基づく妨害排除請求",caseNo:"平成8(オ)1697",date:"1999-11-24",wareki:"平成11年11月24日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"民集 第53巻8号1899頁",areas:["民事"],
 holdings:"抵当不動産の所有者から占有権原の設定を受けた者が、その設定に抵当権実行としての競売手続を妨害する目的が認められ、占有により交換価値の実現が妨げられ優先弁済請求権の行使が困難となるような状態があるときは、抵当権者は所有者の妨害排除請求権を代位行使できる。",
 summary:"いわゆる占有屋による競売妨害に対し、抵当権者が所有者の妨害排除請求権を債権者代位権により行使することを認め、第三者が抵当不動産を占有しても抵当権は侵害されないとしていた従来の判例を変更した。",
 laws:["民法369条", "民法423条", "民法1条2項"],tags:["抵当権", "妨害排除", "債権者代位", "判例変更"]},
{id:"c114",lid:52322,name:"抵当権者による直接の妨害排除請求",caseNo:"平成13(オ)656",date:"2005-03-10",wareki:"平成17年3月10日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"その他",reporter:"民集 第59巻2号356頁",areas:["民事"],
 holdings:"抵当権設定登記後に抵当不動産の所有者から占有権原の設定を受けた者であっても、その設定に競売手続を妨害する目的が認められ、抵当権の行使が困難となるような状態があるときは、抵当権者は占有者に対し抵当権に基づく妨害排除請求として直接自己への明渡しを求めることができる。",
 summary:"平成11年大法廷判決を進めて、債権者代位によらず抵当権自体に基づく妨害排除請求を認め、一定の場合には抵当権者への直接の明渡しまで認めた判決。",
 laws:["民法369条", "民法1条2項"],tags:["抵当権", "妨害排除", "明渡し", "競売妨害"]},
{id:"c115",lid:52610,name:"将来債権の譲渡",caseNo:"平成9(オ)219",date:"1999-01-29",wareki:"平成11年1月29日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄自判",reporter:"民集 第53巻1号151頁",areas:["民事"],
 holdings:"将来発生すべき債権を目的とする債権譲渡契約は、譲渡の目的となる債権が特定されている限り原則として有効であり、契約締結時に債権発生の可能性が低かったことは契約の効力を当然には左右しない。",
 summary:"医師が将来の診療報酬債権を8年分一括して譲渡した事案。将来債権譲渡の有効性を広く認め、期間の長さ等により譲渡人の営業活動を著しく制約し他の債権者に不当な不利益を与える場合に限って公序良俗違反になりうるとした。",
 laws:["民法466条", "民法90条"],tags:["将来債権譲渡", "債権譲渡", "特定性", "公序良俗"]},
{id:"c116",lid:52073,name:"債権譲渡禁止特約と悪意の譲受人",caseNo:"昭和47(オ)111",date:"1973-07-19",wareki:"昭和48年7月19日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第27巻7号823頁",areas:["民事"],
 holdings:"譲渡禁止の特約がある債権の譲渡について、譲受人が特約の存在を知らなかったことにつき重大な過失があるときは、悪意の譲受人と同様に特約を対抗される。",
 summary:"譲渡禁止特約付き債権の譲受人が特約を知らなかった場合でも、重過失があれば保護されないとした判決。改正前民法466条2項の解釈を示したもので、現行法では債権譲渡制限特約の効力が改められている。",
 laws:["民法466条2項"],tags:["債権譲渡", "譲渡禁止特約", "重過失", "悪意"]},
{id:"c117",lid:52111,name:"安全配慮義務（陸上自衛隊八戸車両整備工場事件）",caseNo:"昭和48(オ)383",date:"1975-02-25",wareki:"昭和50年2月25日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第29巻2号143頁",areas:["民事", "労働"],
 holdings:"国は、公務員に対し、その生命・健康等を危険から保護するよう配慮すべき義務（安全配慮義務）を負い、その不履行による損害賠償請求権の消滅時効期間は民法167条1項により10年である。",
 summary:"自衛隊員が車両整備中の事故で死亡し、遺族が国に損害賠償を求めた事件。ある法律関係に基づいて特別な社会的接触の関係に入った当事者間において、信義則上、相手方の安全に配慮すべき義務が認められることを最高裁として初めて明示した。",
 laws:["民法415条", "民法167条1項", "民法1条2項"],tags:["安全配慮義務", "債務不履行", "消滅時効", "国家賠償"]},
{id:"c118",lid:52180,name:"川義事件（宿直勤務中の強盗殺人と安全配慮義務）",caseNo:"昭和58(オ)152",date:"1984-04-10",wareki:"昭和59年4月10日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第38巻6号557頁",areas:["民事", "労働"],
 holdings:"使用者は、労働者が労務提供のために設置する場所・設備・器具等を使用し又は使用者の指示の下に労務を提供する過程において、労働者の生命・身体等を危険から保護するよう配慮すべき義務を負う。",
 summary:"宿直中の従業員が侵入した強盗に殺害された事件。使用者の安全配慮義務の内容を具体化し、盗難等の危険を防止するための物的設備や人員配置を講じる義務があったとして、会社の損害賠償責任を認めた。",
 laws:["民法415条", "民法1条2項"],tags:["安全配慮義務", "宿直", "使用者責任", "労働災害"]},
{id:"c119",lid:54983,name:"交通事故と後遺症（損害賠償請求権の消滅時効の起算点）",caseNo:"昭和40(オ)1232",date:"1967-07-18",wareki:"昭和42年7月18日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第21巻6号1559頁",areas:["民事"],
 holdings:"不法行為による損害賠償請求権の消滅時効は、被害者が損害および加害者を知った時から進行するが、受傷時には予想できなかった後遺症による損害については、その後遺症が顕在化した時から進行する。",
 summary:"交通事故の負傷が治癒したと思われた後に後遺症が現れた事案。民法724条の「損害を知った時」の意義について、受傷当時には予見できなかった後遺症については、その発生を知った時から別個に時効が進行するとした。",
 laws:["民法724条", "民法709条"],tags:["消滅時効", "起算点", "後遺症", "交通事故"]},
{id:"c120",lid:53934,name:"共同不法行為と寄与度減責（山王川事件）",caseNo:"昭和39(オ)902",date:"1968-04-23",wareki:"昭和43年4月23日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第22巻4号964頁",areas:["民事"],
 holdings:"民法719条の共同不法行為が成立するには、各行為者の行為が客観的に関連共同していれば足り、共謀や共同の認識は必要でない。",
 summary:"工場の廃液により農業被害が生じた事案。共同不法行為の成立要件について客観的関連共同説を採用し、各行為者は損害の全部について連帯して責任を負うとした。公害事件における共同不法行為論の基礎となった判決。",
 laws:["民法719条", "民法709条"],tags:["共同不法行為", "客観的関連共同", "公害", "連帯責任"]},
{id:"c121",lid:54227,name:"大阪空港騒音公害訴訟",caseNo:"昭和51(オ)395",date:"1981-12-16",wareki:"昭和56年12月16日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"その他",reporter:"民集 第35巻10号1369頁",areas:["民事", "行政"],
 holdings:"空港の供用は運輸大臣の有する空港管理権と航空行政権の総合的判断に基づく不可分一体の行使の結果であり、民事上の請求として夜間の離着陸の差止めを求めることは不適法である。過去の損害については国家賠償法2条1項に基づく賠償を認める。",
 summary:"大阪国際空港の周辺住民が夜間飛行の差止めと損害賠償を求めた事件。差止請求については民事訴訟の対象とならないとして却下したが、空港の供用に伴う騒音被害について、営造物の設置管理の瑕疵として国の賠償責任を認めた。",
 laws:["国家賠償法2条1項", "民法709条", "航空法"],tags:["公害", "差止請求", "営造物責任", "騒音"]},
{id:"c122",lid:53106,name:"使用者責任と事業の執行（外形理論）",caseNo:"昭和37(オ)589",date:"1964-02-04",wareki:"昭和39年2月4日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第18巻2号252頁",areas:["民事"],
 holdings:"民法715条の「事業の執行について」とは、被用者の職務執行行為そのものには属しないが、その行為の外形から観察して、あたかも被用者の職務の範囲内の行為に属するものと見られる場合も含む。",
 summary:"会社の従業員が会社の自動車を私用運転中に起こした事故について、外形から見て職務の範囲内と認められる場合には使用者責任が及ぶとした。外形理論を交通事故に適用した代表例。",
 laws:["民法715条", "民法709条"],tags:["使用者責任", "外形理論", "事業の執行", "交通事故"]},
{id:"c123",lid:66858,name:"医療水準（未熟児網膜症・日赤高山病院事件）",caseNo:"昭和54(オ)1386",date:"1982-03-30",wareki:"昭和57年3月30日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"集民 第135号563頁",areas:["民事"],
 holdings:"医師の注意義務の基準となるべきものは診療当時のいわゆる臨床医学の実践における医療水準であり、学問としての医学水準ではない。",
 summary:"未熟児網膜症の治療をめぐり、診療当時の医療水準に照らして光凝固法の実施等が義務付けられていたかが争われた事件。医療水準は診療当時の臨床医学の実践における水準で判断すべきとした。",
 laws:["民法415条", "民法709条"],tags:["医療過誤", "医療水準", "注意義務", "未熟児網膜症"]},
{id:"c124",lid:57057,name:"医療水準の判断と医療機関の性格（姫路日赤事件）",caseNo:"平成4(オ)200",date:"1995-06-09",wareki:"平成7年6月9日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第49巻6号1499頁",areas:["民事"],
 holdings:"ある新規の治療法に関する知見が当該医療機関と類似の特性を備えた医療機関に相当程度普及しており、当該医療機関において知見を有することを期待することが相当と認められる場合には、その知見は当該医療機関にとっての医療水準となる。",
 summary:"未熟児網膜症について、医療水準は全国一律に決まるものではなく、医療機関の性格や所在地域の医療環境の特性等を考慮して判断すべきであり、自ら治療できなくても転医を勧める義務があるとした。",
 laws:["民法415条", "民法709条"],tags:["医療過誤", "医療水準", "転医義務", "医療機関の特性"]},
{id:"c125",lid:52218,name:"エホバの証人輸血拒否事件",caseNo:"平成10(オ)1081",date:"2000-02-29",wareki:"平成12年2月29日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第54巻2号582頁",areas:["民事", "憲法"],
 holdings:"患者が宗教上の信念から輸血を伴う医療行為を拒否するとの明確な意思を有している場合、このような意思決定をする権利は人格権の一内容として尊重されなければならない。",
 summary:"輸血拒否の意思を示していた患者に対し、医師が手術中に無断で輸血した事件。医師は輸血の可能性があることを説明して手術を受けるか否かを患者自身に決定させるべきであったとして、説明義務違反による人格権侵害の慰謝料を認めた。",
 laws:["民法709条", "民法710条", "憲法13条"],tags:["自己決定権", "説明義務", "輸血拒否", "人格権"]},
{id:"c126",lid:57760,name:"借地上建物の増改築禁止特約と信頼関係破壊",caseNo:"昭和39(オ)1450",date:"1966-04-21",wareki:"昭和41年4月21日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第20巻4号720頁",areas:["民事"],
 holdings:"土地の賃借人が賃貸人の承諾なく増改築をした場合でも、それが土地の通常の利用上相当で、賃貸人に著しい影響を及ぼさないため賃貸人に対する信頼関係を破壊するおそれがあると認めるに足りないときは、賃貸人は契約を解除できない。",
 summary:"増改築禁止特約に違反した賃借人に対する解除の可否が争われた事件。特約違反があっても信頼関係を破壊しない程度のものであれば解除権は生じないとし、継続的契約における信頼関係破壊の法理を確認した。",
 laws:["民法541条", "民法612条", "借地法"],tags:["信頼関係破壊", "賃貸借", "解除", "増改築"]},
{id:"c127",lid:62463,name:"サブリースと賃料減額請求",caseNo:"平成12(受)123",date:"2003-10-21",wareki:"平成15年10月21日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"その他",reporter:"集民 第211号55頁",areas:["民事"],
 holdings:"いわゆるサブリース契約も建物の賃貸借契約であり、借地借家法32条1項の賃料減額請求権の行使は妨げられないが、賃料自動増額特約の存在やその経緯は減額の当否・相当賃料額の判断において考慮すべきである。",
 summary:"不動産会社が一括借り上げしたビルの賃料について減額請求をした事件。サブリース契約にも借地借家法の賃料増減額請求の規定が適用されるとしつつ、契約締結の経緯や賃料保証の趣旨を相当賃料額の判断に反映させるべきとした。",
 laws:["借地借家法32条1項"],tags:["サブリース", "賃料減額", "借地借家法", "事情変更"]},
{id:"c128",lid:53000,name:"利息制限法超過利息の充当（元本充当）",caseNo:"昭和35(オ)1151",date:"1964-11-18",wareki:"昭和39年11月18日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第18巻9号1868頁",areas:["民事"],
 holdings:"債務者が利息制限法所定の制限を超える利息・損害金を任意に支払った場合、その超過部分は民法の規定により残存元本に充当される。",
 summary:"制限超過利息を任意に支払った場合の処理について、超過部分の返還請求を否定しつつ元本への充当を認めた判決。その後の昭和43年大法廷判決（過払金の返還請求肯定）につながる判例法理の第一歩となった。",
 laws:["利息制限法1条", "民法491条"],tags:["利息制限法", "元本充当", "過払金", "貸金"]},
{id:"c129",lid:55025,name:"過払金の返還請求",caseNo:"昭和41(オ)1281",date:"1968-11-13",wareki:"昭和43年11月13日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"民集 第22巻12号2526頁",areas:["民事"],
 holdings:"利息制限法の制限を超えて支払った利息・損害金を元本に充当し、計算上元本が完済となった後に支払われた金員は、債務が存在しないのに支払われたものとして不当利得返還請求の対象となる。",
 summary:"制限超過利息の任意支払による元本充当の結果、元本が消滅した後に支払われた金員は不当利得として返還を求めることができるとした。後の消費者金融をめぐる過払金返還訴訟の法的基礎。",
 laws:["利息制限法1条", "民法703条", "民法704条"],tags:["過払金", "不当利得", "利息制限法", "貸金"]},
{id:"c130",lid:52404,name:"期限の利益喪失特約とみなし弁済",caseNo:"平成16(受)1518",date:"2006-01-13",wareki:"平成18年1月13日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第60巻1号1頁",areas:["民事"],
 holdings:"制限超過利息の支払を怠ると期限の利益を失う旨の特約の下での支払は、特段の事情がない限り、貸金業法43条1項にいう債務者が「任意に」支払ったものとはいえない。",
 summary:"貸金業者が制限超過利息を有効な弁済とみなすみなし弁済規定の適用を主張した事件。期限の利益喪失特約の存在により債務者は事実上支払を強制されているとして、みなし弁済の適用を厳しく制限した。過払金返還請求の急増につながった。",
 laws:["貸金業法43条1項", "利息制限法1条", "民法703条"],tags:["みなし弁済", "期限の利益喪失特約", "過払金", "貸金業"]},
{id:"c131",lid:51871,name:"取締役の第三者に対する責任",caseNo:"昭和39(オ)1175",date:"1969-11-26",wareki:"昭和44年11月26日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"民集 第23巻11号2150頁",areas:["民事"],
 holdings:"商法266条の3（現会社法429条）の取締役の第三者に対する責任は、第三者保護のための特別の法定責任であり、取締役の任務懈怠と第三者の損害との間に相当因果関係があれば、直接損害・間接損害を問わず責任を負う。",
 summary:"会社の取引先が、取締役の放漫経営等により損害を受けたとして取締役個人の責任を追及した事件。取締役の第三者責任の法的性質を法定責任と解し、悪意・重過失は任務懈怠について存すれば足りるとした。",
 laws:["商法266条の3", "会社法429条"],tags:["取締役の責任", "第三者責任", "任務懈怠", "法定責任"]},
{id:"c132",lid:80447,name:"経営判断の原則（アパマンショップ事件）",caseNo:"平成21(受)183",date:"2010-07-15",wareki:"平成22年7月15日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄自判",reporter:"集民 第234号225頁",areas:["民事"],
 holdings:"事業再編計画の策定は完全子会社化の必要性や取得価格等を含め経営判断事項であり、その決定の過程・内容に著しく不合理な点がない限り、取締役としての善管注意義務に違反するものではない。",
 summary:"子会社の株式を市場価格より高い価格で買い取った取締役の責任を株主が追及した事件。経営判断の過程と内容の双方に著しく不合理な点がなければ善管注意義務違反とならないとし、いわゆる経営判断の原則を最高裁として示した。",
 laws:["会社法330条", "会社法423条", "民法644条"],tags:["経営判断の原則", "善管注意義務", "株主代表訴訟", "取締役"]},
{id:"c133",lid:35027,name:"ブルドックソース事件（買収防衛策）",caseNo:"平成19(許)30",date:"2007-08-07",wareki:"平成19年8月7日",court:"最高裁判所",bench:"第二小法廷",kind:"決定",result:"棄却",reporter:"民集 第61巻5号2215頁",areas:["民事"],
 holdings:"特定の株主による経営支配権の取得に伴い会社の企業価値が毀損され株主共同の利益が害されるかどうかは、株主自身により判断されるべきであり、株主総会の圧倒的多数の賛成を得て導入された新株予約権の無償割当ては、著しく不公正な方法によるものとはいえない。",
 summary:"米国系ファンドによる公開買付けに対抗して、株主総会決議に基づき買収者だけ行使できない新株予約権を無償割当てした買収防衛策の適法性が争われた事件。株主平等原則の趣旨は新株予約権の無償割当てにも及ぶが、必要性・相当性があれば許されるとした。",
 laws:["会社法109条1項", "会社法247条", "会社法278条"],tags:["買収防衛策", "株主平等原則", "新株予約権", "企業価値"]},
{id:"c134",lid:52616,name:"既判力と後訴（一部請求と残部請求）",caseNo:"平成9(オ)849",date:"1998-06-12",wareki:"平成10年6月12日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄自判",reporter:"民集 第52巻4号1147頁",areas:["民事"],
 holdings:"金銭債権の数量的一部請求訴訟で敗訴した原告が残部請求の訴えを提起することは、特段の事情がない限り、信義則に反して許されない。",
 summary:"一部請求であることを明示した訴えで請求棄却の判決が確定した後、残部を請求した事件。一部請求の訴訟でも債権全部について審理判断されているのが通常であり、敗訴後の残部請求は実質的に紛争の蒸し返しであるとした。",
 laws:["民事訴訟法114条", "民事訴訟法2条"],tags:["一部請求", "既判力", "信義則", "残部請求"]},
{id:"c135",lid:54213,name:"争点効と信義則（紛争の蒸し返し）",caseNo:"昭和49(オ)331",date:"1976-09-30",wareki:"昭和51年9月30日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第30巻8号799頁",areas:["民事"],
 holdings:"前訴と後訴が実質的に同一の紛争である場合に、前訴で敗訴した当事者が後訴で前訴と矛盾する主張をして紛争を蒸し返すことは、信義則に照らして許されない。",
 summary:"農地の買収処分をめぐる前訴で敗訴した者が、実質的に同じ紛争を別の請求として提起した事件。既判力が及ばない場合であっても、信義則により後訴が遮断されることを認めた。",
 laws:["民事訴訟法2条", "民法1条2項"],tags:["信義則", "紛争の蒸し返し", "既判力", "争点効"]},
{id:"c136",lid:52281,name:"文書提出命令と自己利用文書（銀行の貸出稟議書）",caseNo:"平成11(許)2",date:"1999-11-12",wareki:"平成11年11月12日",court:"最高裁判所",bench:"第二小法廷",kind:"決定",result:"破棄自判",reporter:"民集 第53巻8号1787頁",areas:["民事"],
 holdings:"銀行の貸出稟議書は、専ら内部の者の利用に供する目的で作成され外部に開示することが予定されていない文書であり、開示により看過し難い不利益が生ずるおそれがあるから、特段の事情がない限り民事訴訟法220条4号の「専ら文書の所持者の利用に供するための文書」に当たる。",
 summary:"証券取引の損害賠償請求事件で銀行の貸出稟議書の提出が求められた事案。自己利用文書の判断基準を示し、稟議書は原則として提出義務の対象外とした。文書提出命令の範囲に関する基本判例。",
 laws:["民事訴訟法220条4号"],tags:["文書提出命令", "自己利用文書", "稟議書", "証拠収集"]},
{id:"c137",lid:55213,name:"有責配偶者からの離婚請求",caseNo:"昭和61(オ)260",date:"1987-09-02",wareki:"昭和62年9月2日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第41巻6号1423頁",areas:["家事", "民事"],
 holdings:"有責配偶者からの離婚請求であっても、夫婦の別居が双方の年齢や同居期間との対比で相当の長期間に及び、未成熟の子がなく、相手方が離婚により精神的・社会的・経済的に極めて苛酷な状態に置かれるなど著しく社会正義に反する特段の事情がない限り、認容されうる。",
 summary:"別居期間が約36年に及ぶ夫婦について、不貞をした夫からの離婚請求を認めた判決。有責配偶者からの離婚請求を一切認めなかった従来の判例を変更し、一定の条件の下で認める方向へ転換した。",
 laws:["民法770条1項5号", "民法1条2項"],tags:["有責配偶者", "離婚", "破綻主義", "判例変更"]},
{id:"c138",lid:55877,name:"親権者の指定と子の引渡し（人身保護請求）",caseNo:"平成5(オ)609",date:"1993-10-19",wareki:"平成5年10月19日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第47巻8号5099頁",areas:["家事", "民事"],
 holdings:"共同親権者である夫婦の一方が他方に対し人身保護法に基づき幼児の引渡しを求める場合、拘束に顕著な違法性があるといえるのは、拘束者の監護が子の幸福に反することが明白である場合に限られる。",
 summary:"別居中の夫婦間で子の引渡しをめぐって人身保護請求がされた事件。人身保護手続は本来、家庭裁判所の手続で解決すべき親権者間の争いには適さないとして、顕著な違法性の要件を厳格化した。",
 laws:["人身保護法2条", "人身保護規則4条", "民法818条"],tags:["人身保護請求", "子の引渡し", "親権", "監護"]},
{id:"c139",lid:62797,name:"嫡出推定と親子関係不存在確認",caseNo:"平成8(オ)380",date:"2000-03-14",wareki:"平成12年3月14日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄自判",reporter:"集民 第197号375頁",areas:["家事", "民事"],
 holdings:"妻が夫の子を懐胎する可能性がないことが外観上明白な事情がある場合には、嫡出推定は及ばず、親子関係不存在確認の訴えによって父子関係を争うことができる。",
 summary:"夫婦が事実上の離婚状態にあり、夫の子を懐胎する可能性がない時期に生まれた子について、嫡出推定の及ばない子として親子関係不存在確認の訴えを認めた。外観説を採用した判例の一つ。",
 laws:["民法772条", "民法774条", "人事訴訟法"],tags:["嫡出推定", "親子関係不存在", "外観説", "父子関係"]},
{id:"c140",lid:84344,name:"DNA鑑定と嫡出推定",caseNo:"平成25(受)233",date:"2014-07-17",wareki:"平成26年7月17日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄自判",reporter:"集民 第247号79頁",areas:["家事", "民事"],
 holdings:"夫と子との間に生物学上の父子関係がないことが科学的証拠により明らかであり、夫と妻が既に離婚して別居し、子が妻および生物学上の父の下で養育されているという事情があっても、親子関係不存在確認の訴えをもって嫡出推定を争うことはできない。",
 summary:"DNA鑑定で夫の子でないことが明らかな子について、嫡出推定の及ばない子に当たるかが争われた事件。子の身分関係の法的安定を保持する必要が当然になくなるものではないとして、嫡出推定の例外を認めなかった。",
 laws:["民法772条", "民法774条", "民法777条"],tags:["嫡出推定", "DNA鑑定", "親子関係不存在", "身分の安定"]},
{id:"c141",lid:52147,name:"自筆証書遺言の日付（吉日）",caseNo:"昭和54(オ)83",date:"1979-05-31",wareki:"昭和54年5月31日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第33巻4号445頁",areas:["家事", "民事"],
 holdings:"自筆証書遺言において「昭和四拾壱年七月吉日」と記載された日付は、暦上の特定の日を表示するものとはいえず、日付の記載を欠くものとして無効である。",
 summary:"遺言の日付に「吉日」と書かれていたことの効力が争われた事件。自筆証書遺言の日付は遺言能力の有無や複数の遺言の先後を確定するために要求される厳格な方式要件であり、特定できない記載は無効とした。",
 laws:["民法968条1項"],tags:["自筆証書遺言", "日付", "方式", "遺言の無効"]},
{id:"c142",lid:52445,name:"相続させる旨の遺言（香川判決）",caseNo:"平成1(オ)174",date:"1991-04-19",wareki:"平成3年4月19日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"民集 第45巻4号477頁",areas:["家事", "民事"],
 holdings:"特定の遺産を特定の相続人に「相続させる」旨の遺言は、遺贈と解すべき特段の事情がない限り、遺産分割の方法を指定したものであり、当該遺産は被相続人の死亡時に直ちに相続により当該相続人に承継される。",
 summary:"「相続させる」旨の遺言の法的性質を明らかにした判決。遺贈ではなく遺産分割方法の指定とし、遺産分割の手続を経ずに特定の相続人に権利が移転するとした。実務に大きな影響を与えた。",
 laws:["民法908条", "民法964条", "民法985条"],tags:["相続させる旨の遺言", "遺産分割方法の指定", "遺贈", "遺言"]},
{id:"c143",lid:52401,name:"遺産である不動産の賃料債権の帰属",caseNo:"平成16(受)1222",date:"2005-09-08",wareki:"平成17年9月8日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第59巻7号1931頁",areas:["家事", "民事"],
 holdings:"相続開始から遺産分割までの間に遺産である賃貸不動産から生じた賃料債権は、各共同相続人がその相続分に応じて分割単独債権として確定的に取得し、後にされた遺産分割の影響を受けない。",
 summary:"遺産分割の遡及効が、分割前に生じた賃料債権に及ぶかが争われた事件。賃料債権は遺産とは別個の財産として各相続人に相続分に応じて帰属するとした。",
 laws:["民法898条", "民法909条", "民法427条"],tags:["遺産分割", "賃料債権", "遡及効", "共同相続"]},
{id:"c144",lid:50269,name:"福岡県青少年保護育成条例事件",caseNo:"昭和57(あ)621",date:"1985-10-23",wareki:"昭和60年10月23日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"刑集 第39巻6号413頁",areas:["憲法", "刑事"],
 holdings:"条例が禁止する青少年との「淫行」とは、青少年を誘惑し威迫し欺罔し困惑させるなど不当な手段による性交等、または青少年を単に自己の性的欲望を満足させるための対象として扱っているとしか認められない性交等をいう。",
 summary:"「淫行」という文言の漠然性が罪刑法定主義（憲法31条）に反しないかが争われた事件。最高裁は淫行を限定的に解釈することで、通常の判断能力を有する一般人であれば処罰範囲を理解できるとして合憲とした。限定解釈による明確性確保の代表例。",
 laws:["憲法31条", "福岡県青少年保護育成条例10条1項"],tags:["明確性の原則", "限定解釈", "淫行", "青少年保護"]},
{id:"c145",lid:50870,name:"米兵ひき逃げ事件（因果関係）",caseNo:"昭和42(あ)710",date:"1967-10-24",wareki:"昭和42年10月24日",court:"最高裁判所",bench:"第三小法廷",kind:"決定",result:"棄却",reporter:"刑集 第21巻8号1116頁",areas:["刑事"],
 holdings:"自動車で被害者をはね飛ばした後、同乗者が被害者を車の屋根から引きずり降ろして路上に転落させた場合、同乗者の行為が介在したため被害者の死亡が運転者の過失行為から通常生じるものとはいえず、運転者に業務上過失致死の責任を負わせることはできない。",
 summary:"ひき逃げ後に同乗者が被害者を路上に投げ落とし、死亡原因がいずれの行為によるか不明となった事案。第三者の異常な介在行為があった場合に因果関係を否定した数少ない最高裁判例で、相当因果関係説的な判断を示したものと理解されている。",
 laws:["刑法211条"],tags:["因果関係", "第三者の介在", "業務上過失致死", "相当因果関係"]},
{id:"c146",lid:50373,name:"大阪南港事件（因果関係）",caseNo:"昭和63(あ)1124",date:"1990-11-20",wareki:"平成2年11月20日",court:"最高裁判所",bench:"第三小法廷",kind:"決定",result:"棄却",reporter:"刑集 第44巻8号837頁",areas:["刑事"],
 holdings:"犯人の暴行により被害者の死因となった傷害が形成された場合には、その後第三者により加えられた暴行によって死期が早められたとしても、犯人の暴行と被害者の死亡との間の因果関係は肯定できる。",
 summary:"被告人の暴行で瀕死の状態となった被害者が、放置された南港の資材置場で何者かに角材で殴打され死亡した事案。第三者の行為が介在しても、死因となる傷害を被告人が形成していれば因果関係は失われないとした。行為の危険性の現実化を重視する判断の出発点。",
 laws:["刑法205条"],tags:["因果関係", "第三者の介在", "傷害致死", "危険の現実化"]},
{id:"c147",lid:50130,name:"夜間潜水事件（因果関係）",caseNo:"平成4(あ)383",date:"1992-12-17",wareki:"平成4年12月17日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"棄却",reporter:"刑集 第46巻9号683頁",areas:["刑事"],
 holdings:"スキューバダイビングの指導者が受講生を見失い、受講生が不適切な行動をとって溺死した場合でも、指導者の過失行為と死亡との間に因果関係がある。",
 summary:"夜間の潜水講習中に指導者が受講生から離れ、取り残された受講生が指導補助者の不適切な指示に従って溺死した事案。被害者や補助者の行動が介在しても、指導者の過失が死亡の結果を引き起こす危険性を有していたとして因果関係を認めた。",
 laws:["刑法211条"],tags:["因果関係", "被害者の行為の介在", "業務上過失致死", "危険の現実化"]},
{id:"c148",lid:50064,name:"高速道路進入事件（因果関係）",caseNo:"平成15(あ)35",date:"2003-07-16",wareki:"平成15年7月16日",court:"最高裁判所",bench:"第二小法廷",kind:"決定",result:"棄却",reporter:"刑集 第57巻7号950頁",areas:["刑事"],
 holdings:"激しい暴行を受けて逃走した被害者が、高速道路に進入して自動車に衝突され死亡した場合、被害者の行動が暴行から逃れる方法として著しく不自然・不相当とはいえないときは、暴行と死亡との間に因果関係がある。",
 summary:"長時間の激しい暴行から逃れるため被害者が高速道路に進入し轢死した事案。被害者自身の危険な行動が介在しても、それが暴行に起因し著しく不自然・不相当でなければ因果関係は否定されないとした。被害者の介在行為に関する基準を示した判例。",
 laws:["刑法205条"],tags:["因果関係", "被害者の行為の介在", "傷害致死", "逃走"]},
{id:"c149",lid:32814,name:"トランク監禁事件（因果関係）",caseNo:"平成17(あ)2091",date:"2006-03-27",wareki:"平成18年3月27日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"棄却",reporter:"刑集 第60巻3号382頁",areas:["刑事"],
 holdings:"被害者を自動車のトランクに監禁し路上に停車していたところ、後続車が追突して被害者が死亡した場合、監禁行為と死亡との間に因果関係がある。",
 summary:"監禁中の車に第三者の過失による追突事故が起こり被害者が死亡した事案。第三者の重大な過失が介在しても、トランク内に監禁すること自体が死亡の危険を含んでいたとして監禁致死罪の成立を認めた。",
 laws:["刑法221条"],tags:["因果関係", "第三者の過失の介在", "監禁致死", "危険の現実化"]},
{id:"c150",lid:50057,name:"シャクティパット事件（不作為による殺人）",caseNo:"平成15(あ)1468",date:"2005-07-04",wareki:"平成17年7月4日",court:"最高裁判所",bench:"第二小法廷",kind:"決定",result:"棄却",reporter:"刑集 第59巻6号403頁",areas:["刑事"],
 holdings:"自己の責めに帰すべき事由により患者の生命に具体的な危険を生じさせた者が、患者が必要とする医療措置を受けさせないまま放置して死亡させた場合、不作為による殺人罪が成立する。",
 summary:"宗教的治療を行う者が、信者の家族に依頼して重篤な患者を病院から連れ出させ、治療を施さず放置して死亡させた事案。患者の生命に対する危険を自ら生じさせ、その生命を自己の支配下に置いた者には作為義務があるとして、不作為の殺人罪を認めた。",
 laws:["刑法199条", "刑法60条"],tags:["不作為犯", "作為義務", "殺人", "保護責任者遺棄致死との区別"]},
{id:"c151",lid:50315,name:"勘違い騎士道事件（誤想過剰防衛）",caseNo:"昭和59(あ)1699",date:"1987-03-26",wareki:"昭和62年3月26日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"棄却",reporter:"刑集 第41巻2号182頁",areas:["刑事"],
 holdings:"急迫不正の侵害がないのにあると誤信して防衛行為を行い、その行為が誤信した侵害に対する防衛手段として相当性を欠く場合、刑法36条2項により刑を減軽または免除することができる。",
 summary:"英国人の被告人が、女性に暴行していると誤信して男性に空手技で反撃し死亡させた事案。侵害の誤信（誤想防衛）と相当性の欠如（過剰防衛）が重なる誤想過剰防衛について、故意犯の成立を認めたうえで36条2項の準用を肯定した。",
 laws:["刑法36条1項", "刑法36条2項", "刑法205条"],tags:["誤想過剰防衛", "正当防衛", "錯誤", "刑の減免"]},
{id:"c152",lid:51829,name:"積極的加害意思と急迫性",caseNo:"昭和51(あ)671",date:"1977-07-21",wareki:"昭和52年7月21日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"棄却",reporter:"刑集 第31巻4号747頁",areas:["刑事"],
 holdings:"侵害を予期していたことから直ちに急迫性が失われるわけではないが、その機会を利用して積極的に相手に加害行為をする意思で侵害に臨んだときは、侵害の急迫性の要件を満たさない。",
 summary:"学生運動の対立セクトの襲撃を予期して待ち構え、鉄パイプで応戦した事案。侵害の予期だけでは急迫性は失われないものの、積極的加害意思をもって臨んだ場合は正当防衛の前提を欠くとした。急迫性の判断枠組みを示した基本判例。",
 laws:["刑法36条1項"],tags:["正当防衛", "急迫性", "積極的加害意思", "侵害の予期"]},
{id:"c153",lid:36365,name:"自招侵害と正当防衛",caseNo:"平成18(あ)2618",date:"2008-05-20",wareki:"平成20年5月20日",court:"最高裁判所",bench:"第二小法廷",kind:"決定",result:"棄却",reporter:"刑集 第62巻6号1786頁",areas:["刑事"],
 holdings:"被告人が相手方に暴行を加えて不正の行為を自ら招き、相手方がそれに触発されて直後に攻撃に及んだ場合、その攻撃が自招行為の程度を大きく超えるものでない限り、被告人の反撃は正当防衛における侵害に対する行為とはいえない。",
 summary:"被告人が相手の顔を殴打して立ち去った直後、追いかけてきた相手に殴られたため特殊警棒で反撃した事案。自ら招いた侵害に対しては、反撃行為は何らかの行為が許される状況とはいえないとして正当防衛の成立を否定した。",
 laws:["刑法36条1項", "刑法204条"],tags:["自招侵害", "正当防衛", "急迫性", "挑発"]},
{id:"c154",lid:86723,name:"侵害の予期と急迫性（平成29年決定）",caseNo:"平成28(あ)307",date:"2017-04-26",wareki:"平成29年4月26日",court:"最高裁判所",bench:"第二小法廷",kind:"決定",result:"棄却",reporter:"刑集 第71巻4号275頁",areas:["刑事"],
 holdings:"侵害を予期した上で対抗行為に及んだ場合の急迫性は、行為者と相手方との関係、予期された侵害の内容と程度、侵害回避の容易性、対抗行為の準備状況など行為全般の状況に照らし、刑法36条の趣旨から許容されないかどうかで判断する。",
 summary:"被告人が相手からの呼び出しに応じ、包丁を準備して出向き、相手を刺殺した事案。積極的加害意思の有無だけでなく、侵害を回避できたか、凶器の準備など諸事情を総合して急迫性を判断する枠組みを明示した。",
 laws:["刑法36条1項", "刑法199条"],tags:["正当防衛", "急迫性", "侵害の予期", "総合判断"]},
{id:"c155",lid:51311,name:"練馬事件（共謀共同正犯）",caseNo:"昭和29(あ)1056",date:"1958-05-28",wareki:"昭和33年5月28日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"刑集 第12巻8号1718頁",areas:["刑事"],
 holdings:"共謀共同正犯が成立するには、二人以上の者が特定の犯罪を行うため共同意思の下に一体となって互いに他人の行為を利用し、各自の意思を実行に移すことを内容とする謀議をなし、よって犯罪を実行した事実が認められなければならない。",
 summary:"警察官殺害事件において、実行行為を分担していない首謀者らに共同正犯が成立するかが争われた。最高裁は共謀に参加した者は直接実行行為に関与しなくても共同正犯の責任を負うとし、共謀共同正犯の理論を確立した。",
 laws:["刑法60条", "刑法199条"],tags:["共謀共同正犯", "共同正犯", "共謀", "実行行為"]},
{id:"c156",lid:50048,name:"スワット事件（黙示の共謀）",caseNo:"平成14(あ)164",date:"2003-05-01",wareki:"平成15年5月1日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"棄却",reporter:"刑集 第57巻5号507頁",areas:["刑事"],
 holdings:"暴力団組長が、配下のボディガードらがけん銃を所持して警護していることを認識し、それを当然のこととして受け入れて認容していた場合、明示的な指示がなくても共謀共同正犯が成立する。",
 summary:"暴力団組長が護衛役の組員らのけん銃所持につき、明示的な指示をしていなかったものの、警護を当然のこととして受け入れていた事案。黙示的な意思の連絡による共謀と、組長の地位に基づく実質的な支配を根拠に共謀共同正犯を認めた。",
 laws:["刑法60条", "銃砲刀剣類所持等取締法31条の3"],tags:["共謀共同正犯", "黙示の共謀", "暴力団", "けん銃所持"]},
{id:"c157",lid:50381,name:"共犯関係からの離脱（おれ帰る事件）",caseNo:"昭和63(あ)948",date:"1989-06-26",wareki:"平成元年6月26日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"棄却",reporter:"刑集 第43巻6号567頁",areas:["刑事"],
 holdings:"共犯者と共に被害者に暴行を加えた後に「おれ帰る」と言って現場を立ち去ったが、共犯者の暴行を阻止する措置をとらなかった場合、共犯関係からの離脱は認められず、その後の暴行による結果についても責任を負う。",
 summary:"共同で暴行を加えた後、一方が現場を離れ、残った者がさらに暴行して被害者を死亡させた事案。離脱には、それまでの共謀による心理的・物理的影響を除去する措置が必要であるとし、単に立ち去っただけでは責任を免れないとした。",
 laws:["刑法60条", "刑法205条"],tags:["共犯からの離脱", "共犯関係の解消", "傷害致死", "共同正犯"]},
{id:"c158",lid:82708,name:"承継的共犯（傷害罪）",caseNo:"平成24(あ)23",date:"2012-11-06",wareki:"平成24年11月6日",court:"最高裁判所",bench:"第二小法廷",kind:"決定",result:"棄却",reporter:"刑集 第66巻11号1281頁",areas:["刑事"],
 holdings:"他人が暴行を加えた後に共謀加担した者は、加担後の暴行によって傷害の発生に寄与したことについてのみ傷害罪の共同正犯としての責任を負い、加担前に生じていた傷害結果については責任を負わない。",
 summary:"先行者が被害者に暴行を加えていた途中から共謀加担した被告人の責任範囲が争われた。被告人は加担前の傷害を認識・利用していたとしても、それを生じさせたわけではないとして、承継的共同正犯の成立範囲を限定した。",
 laws:["刑法60条", "刑法204条"],tags:["承継的共同正犯", "共犯", "傷害", "責任の範囲"]},
{id:"c159",lid:50059,name:"クロロホルム事件（実行の着手と早すぎた構成要件の実現）",caseNo:"平成15(あ)1625",date:"2004-03-22",wareki:"平成16年3月22日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"棄却",reporter:"刑集 第58巻3号187頁",areas:["刑事"],
 holdings:"被害者にクロロホルムを吸引させて失神させた上で自動車ごと海中に転落させて溺死させる計画において、クロロホルムを吸引させる行為は殺人罪の実行の着手に当たり、実際にはクロロホルムの吸引で死亡していたとしても殺人の故意に欠けるところはない。",
 summary:"第一行為（クロロホルム吸引）で被害者が死亡していた可能性がある事案。第一行為が第二行為に密接で客観的危険性が認められるため実行の着手があり、計画と異なる経過で結果が生じても因果関係の錯誤は故意を阻却しないとして殺人既遂を認めた。",
 laws:["刑法199条", "刑法43条", "刑法38条"],tags:["実行の着手", "早すぎた構成要件の実現", "因果関係の錯誤", "殺人"]},
{id:"c160",lid:87586,name:"特殊詐欺における実行の着手（警察官を装う電話）",caseNo:"平成29(あ)322",date:"2018-03-22",wareki:"平成30年3月22日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄自判",reporter:"刑集 第72巻1号82頁",areas:["刑事"],
 holdings:"詐欺の被害者に対し、預金を下ろして自宅に置くよう指示し、警察官を装って訪問する旨の電話をかけた段階で、現金の交付を求める文言がなくても詐欺罪の実行の着手が認められる。",
