 summary:"受け子が現金を受け取る前に逮捕され、電話の段階で着手があるかが争われた特殊詐欺の事案。一連の嘘が被害者の財産交付に向けられた欺罔の一部であり、交付を求める行為に密接で危険性があるとして未遂罪の成立を認めた。",
 laws:["刑法246条1項", "刑法250条", "刑法43条"],tags:["実行の着手", "詐欺未遂", "特殊詐欺", "欺罔行為"]},
{id:"c161",lid:50757,name:"死者の占有（窃盗罪）",caseNo:"昭和40(あ)1573",date:"1966-04-08",wareki:"昭和41年4月8日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"刑集 第20巻4号207頁",areas:["刑事"],
 holdings:"被害者を殺害した犯人が、その直後に殺害現場で被害者の財物を奪取した場合、被害者が生前有していた財物の占有は、被害者の死亡直後においてもなお保護されるべきであり、窃盗罪が成立する。",
 summary:"殺害後に初めて財物奪取の意思を生じて被害者の腕時計を奪った事案。死亡した被害者には占有がないとして占有離脱物横領罪にとどまるかが争われたが、殺害直後の奪取については一連の行為として窃盗罪が成立するとした。",
 laws:["刑法235条", "刑法254条"],tags:["死者の占有", "窃盗", "占有離脱物横領", "殺害後の財物奪取"]},
{id:"c162",lid:50004,name:"誤振込みと詐欺罪",caseNo:"平成10(あ)488",date:"2003-03-12",wareki:"平成15年3月12日",court:"最高裁判所",bench:"第二小法廷",kind:"決定",result:"棄却",reporter:"刑集 第57巻3号322頁",areas:["刑事"],
 holdings:"誤った振込みがあったことを知った受取人が、その情を秘して銀行の窓口で預金の払戻しを請求し現金を受け取った場合、詐欺罪が成立する。",
 summary:"誤って自己の口座に振り込まれた金員を払い戻した事案。受取人は銀行に誤振込みがあったことを告知すべき信義則上の義務があり、これを秘して払戻しを受けることは欺罔行為に当たるとした。民事上は預金債権が成立するとしても刑事上の詐欺が成立する点が注目される。",
 laws:["刑法246条1項"],tags:["詐欺", "誤振込み", "告知義務", "預金"]},
{id:"c163",lid:80530,name:"搭乗券詐欺事件（他人名義の搭乗券）",caseNo:"平成20(あ)720",date:"2010-07-29",wareki:"平成22年7月29日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"棄却",reporter:"刑集 第64巻5号829頁",areas:["刑事"],
 holdings:"他人名義の搭乗券を自ら搭乗する意図のない者に手渡す目的を秘して航空会社の係員に搭乗券の交付を受ける行為は、詐欺罪における欺罔行為に当たる。",
 summary:"不法に入国しようとする者を搭乗させるため、別人が本人であるかのように装って搭乗券の交付を受けた事案。係員が搭乗者本人であることを確認して交付する運用がされており、交付の判断の基礎となる重要な事項を偽ったとして詐欺罪を認めた。",
 laws:["刑法246条1項"],tags:["詐欺", "欺罔行為", "重要事項", "搭乗券"]},
{id:"c164",lid:84098,name:"暴力団員のゴルフ場利用と詐欺罪（長野事件）",caseNo:"平成25(あ)725",date:"2014-03-28",wareki:"平成26年3月28日",court:"最高裁判所",bench:"第二小法廷",kind:"決定",result:"棄却",reporter:"刑集 第68巻3号646頁",areas:["刑事"],
 holdings:"暴力団関係者の利用を拒絶しているゴルフ場において、暴力団員であることを秘して施設利用を申し込みプレーした行為は、利用の可否の判断の基礎となる重要な事項を偽るものとして詐欺罪に当たる。",
 summary:"ゴルフ場が暴力団員の利用を厳格に排除していたことを前提に、暴力団員であることを秘した申込みが欺罔行為に当たるとした事案。同日の宮崎の事案では、申込者が同伴者で確認手続も厳格でなかったとして詐欺罪の成立を否定しており、両者の対比が重要である。",
 laws:["刑法246条2項"],tags:["詐欺", "挙動による欺罔", "暴力団排除", "重要事項"]},
{id:"c165",lid:50036,name:"横領後の横領",caseNo:"平成13(あ)746",date:"2003-04-23",wareki:"平成15年4月23日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"刑集 第57巻4号467頁",areas:["刑事"],
 holdings:"委託を受けて占有する他人の不動産に無断で抵当権を設定した後、さらにこれを売却した場合、先行する抵当権設定行為が横領罪に当たるとしても、後の売却行為について横領罪の成立を認めることができる。",
 summary:"先行する横領（抵当権設定）があれば後の処分（売却）は不可罰的事後行為であるとしていた従来の判例を変更し、後行の処分行為についても独立して横領罪が成立するとした。訴追の対象の選択を検察官に委ねる趣旨も含む。",
 laws:["刑法252条1項"],tags:["横領", "不可罰的事後行為", "判例変更", "抵当権設定"]},
{id:"c166",lid:58498,name:"難燃性建造物と現住建造物放火",caseNo:"昭和63(あ)1257",date:"1989-07-07",wareki:"平成元年7月7日",court:"最高裁判所",bench:"第二小法廷",kind:"決定",result:"棄却",reporter:"集刑 第252号203頁",areas:["刑事"],
 holdings:"マンション内部のエレベーターのかごは建造物の一部であり、これに火を放って側壁を燃焼させた場合、現住建造物等放火罪の既遂が成立する。",
 summary:"難燃性の建材が用いられたマンションのエレベーター内で火を放った事案。エレベーターのかごが建造物の一部に当たることを認めたうえで、かごの側壁が燃焼した時点で「焼損」に当たるとし、現住建造物等放火罪の既遂を認めた。",
 laws:["刑法108条"],tags:["放火", "現住建造物", "焼損", "既遂時期"]},
{id:"c167",lid:50291,name:"通称名の使用と私文書偽造",caseNo:"昭和58(あ)257",date:"1984-02-17",wareki:"昭和59年2月17日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"刑集 第38巻3号336頁",areas:["刑事"],
 holdings:"日本に密入国し他人の名義を長年使用していた者が、その名義で再入国許可申請書を作成した場合、文書の名義人は他人であって被告人と同一人ではないから、私文書偽造罪が成立する。",
 summary:"長年にわたり通称名として他人名義を使用していた外国人が、その名義で公的な申請書を作成した事案。文書の性質上、名義人と作成者の人格の同一性が重要な意味を持つ文書については、通称名であっても偽造に当たるとした。",
 laws:["刑法159条1項"],tags:["私文書偽造", "名義人", "通称名", "人格の同一性"]},
{id:"c168",lid:38704,name:"インターネット上の名誉毀損と真実性の誤信",caseNo:"平成21(あ)360",date:"2010-03-15",wareki:"平成22年3月15日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"棄却",reporter:"刑集 第64巻2号1頁",areas:["刑事"],
 holdings:"インターネットの個人利用者による表現行為であっても、名誉毀損罪における真実性の誤信は、確実な資料・根拠に照らして相当の理由があるときに限って故意を阻却するのであり、他の表現手段より緩やかな基準を適用すべきではない。",
 summary:"飲食店フランチャイズに関する批判をウェブサイトに掲載した事案。第一審は利用者相互の反論可能性を理由に緩やかな基準を採用したが、最高裁はインターネット上の情報の信頼性が低いとはいえず、被害も深刻になりうるとして従来の基準を維持した。",
 laws:["刑法230条1項", "刑法230条の2"],tags:["名誉毀損", "真実性の誤信", "インターネット", "表現の自由"]},
{id:"c169",lid:36282,name:"立川反戦ビラ配布事件",caseNo:"平成17(あ)2652",date:"2008-04-11",wareki:"平成20年4月11日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"刑集 第62巻5号1217頁",areas:["憲法", "刑事"],
 holdings:"防衛庁職員の宿舎の敷地・建物に管理者の意思に反して立ち入りビラを配布した行為を住居侵入罪で処罰することは、憲法21条1項に違反しない。",
 summary:"自衛隊のイラク派遣に反対するビラを配布するため集合住宅の共用部分に立ち入った事案。表現の自由の重要性を認めつつ、処罰は表現そのものではなく表現の手段である立入りを対象とするもので、管理権者の意思に反する立入りを処罰することは合理的制限として許されるとした。",
 laws:["憲法21条1項", "刑法130条"],tags:["住居侵入", "ビラ配布", "表現の自由", "管理権"]},
{id:"c170",lid:38200,name:"葛飾ビラ配布事件",caseNo:"平成20(あ)13",date:"2009-11-30",wareki:"平成21年11月30日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"刑集 第63巻9号1765頁",areas:["憲法", "刑事"],
 holdings:"分譲マンションの共用部分に政党のビラを配布する目的で立ち入った行為について住居侵入罪を適用することは、憲法21条1項に違反しない。",
 summary:"立川事件と同様に、政党ビラの投函目的でマンションの共用部分に立ち入った事案。管理組合の決議や掲示により立入りが禁止されており、住人の私的生活の平穏を侵害するものとして、住居侵入罪の適用は合憲とした。",
 laws:["憲法21条1項", "刑法130条"],tags:["住居侵入", "ビラ配布", "表現の自由", "管理権"]},
{id:"c171",lid:50201,name:"米子銀行強盗事件（所持品検査）",caseNo:"昭和52(あ)1435",date:"1978-06-20",wareki:"昭和53年6月20日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"刑集 第32巻4号670頁",areas:["刑事"],
 holdings:"職務質問に付随する所持品検査は、所持人の承諾がなくても、捜索に至らない程度の行為は、強制にわたらない限り、必要性・緊急性と侵害される法益との権衡を考慮して具体的状況のもとで相当と認められる限度において許容される。",
 summary:"銀行強盗の容疑者が持っていたバッグの施錠されていないチャックを警察官が開けて中を確認した事案。警職法に明文はないが、職務質問の実効性を確保するため、承諾のない所持品検査も一定の限度で許容されるとした。任意処分の限界を示す基本判例。",
 laws:["警察官職務執行法2条1項", "刑事訴訟法218条"],tags:["所持品検査", "職務質問", "任意処分", "相当性"]},
{id:"c172",lid:51125,name:"大阪覚せい剤事件（違法収集証拠排除法則）",caseNo:"昭和51(あ)865",date:"1978-09-07",wareki:"昭和53年9月7日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄差戻",reporter:"刑集 第32巻6号1672頁",areas:["刑事"],
 holdings:"証拠物の押収手続に憲法35条および刑事訴訟法218条1項の所期する令状主義の精神を没却するような重大な違法があり、これを証拠として許容することが将来における違法な捜査の抑制の見地から相当でないと認められる場合には、その証拠能力は否定される。",
 summary:"警察官が職務質問の際に承諾なくポケットに手を入れて覚せい剤を取り出した事案。手続の違法を認めながら、重大な違法とまではいえないとして証拠能力は肯定したが、違法収集証拠排除法則を初めて最高裁として採用した判例である。",
 laws:["憲法35条", "刑事訴訟法218条1項"],tags:["違法収集証拠", "証拠能力", "令状主義", "違法捜査の抑制"]},
{id:"c173",lid:50028,name:"違法な逮捕に続く採尿と証拠能力（毒樹の果実）",caseNo:"平成13(あ)1678",date:"2003-02-14",wareki:"平成15年2月14日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"その他",reporter:"刑集 第57巻2号121頁",areas:["刑事"],
 holdings:"逮捕状の呈示もなく逮捕状の緊急執行の手続も踏まずに逮捕し、虚偽の捜査報告書を作成するなど令状主義の精神を潜脱し没却するような重大な違法がある場合、その逮捕と密接な関連を有する採尿により得られた尿の鑑定書の証拠能力は否定される。",
 summary:"違法な逮捕中の採尿で得た尿鑑定書と、それに基づく捜索差押えで発見した覚せい剤の証拠能力が争われた事案。尿鑑定書の証拠能力を否定した一方、覚せい剤については司法審査を経た令状によるものであり関連性が密接でないとして証拠能力を認めた。排除法則を実際に適用した最初の最高裁判例。",
 laws:["憲法35条", "刑事訴訟法199条", "刑事訴訟法201条"],tags:["違法収集証拠", "排除法則", "毒樹の果実", "違法逮捕"]},
{id:"c174",lid:56792,name:"緊急逮捕の合憲性",caseNo:"昭和26(あ)3953",date:"1955-12-14",wareki:"昭和30年12月14日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"刑集 第9巻13号2760頁",areas:["憲法", "刑事"],
 holdings:"厳格な制約の下に、罪状の重い一定の犯罪のみについて、緊急やむを得ない場合に限り、逮捕後直ちに裁判官の審査を受けて逮捕状の発付を求めることを条件とする緊急逮捕は、憲法33条の規定の趣旨に反しない。",
 summary:"裁判官の令状なしに行われる緊急逮捕が憲法33条の令状主義に反しないかが争われた事件。事後的に令状審査を受ける仕組みであることなどから合憲とした。",
 laws:["憲法33条", "刑事訴訟法210条"],tags:["緊急逮捕", "令状主義", "合憲", "逮捕"]},
{id:"c175",lid:50499,name:"逮捕に伴う捜索・差押え",caseNo:"昭和31(あ)2863",date:"1961-06-07",wareki:"昭和36年6月7日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"刑集 第15巻6号915頁",areas:["憲法", "刑事"],
 holdings:"逮捕する場合に令状なく行う捜索・差押えは、逮捕の現場で行われる限り、必ずしも逮捕の着手より先に行われてはならないものではなく、逮捕との時間的接着がある場合には適法である。",
 summary:"被疑者不在の間に捜索を開始し、帰宅した被疑者を逮捕した事案。令状のない捜索は逮捕と時間的に接着し逮捕の現場で行われる限り、着手の先後を問わず許されるとした。「逮捕する場合」の解釈をめぐる基本判例。",
 laws:["憲法35条", "刑事訴訟法220条1項"],tags:["逮捕に伴う捜索", "令状主義", "時間的接着", "捜索差押え"]},
{id:"c176",lid:38022,name:"宅配便エックス線検査事件（強制処分の意義）",caseNo:"平成19(あ)798",date:"2009-09-28",wareki:"平成21年9月28日",court:"最高裁判所",bench:"第三小法廷",kind:"決定",result:"棄却",reporter:"刑集 第63巻7号868頁",areas:["刑事"],
 holdings:"荷送人や荷受人の承諾を得ずに宅配便の荷物にエックス線を照射して内容物の射影を観察することは、その内容物によってはその品目等を相当程度推測できるものであり、プライバシー等を大きく侵害する強制処分に当たり、令状がなければ許されない。",
 summary:"覚せい剤取引の捜査で、宅配業者の協力を得て荷物のエックス線検査を令状なく行った事案。検査を強制処分と位置付けて違法としたが、その後の捜索差押えは令状に基づき、違法の程度も重大とはいえないとして証拠能力は認めた。",
 laws:["刑事訴訟法197条1項", "刑事訴訟法218条1項"],tags:["強制処分", "任意処分との区別", "エックス線検査", "プライバシー"]},
{id:"c177",lid:36292,name:"公道上の容ぼう等のビデオ撮影",caseNo:"平成19(あ)839",date:"2008-04-15",wareki:"平成20年4月15日",court:"最高裁判所",bench:"第二小法廷",kind:"決定",result:"棄却",reporter:"刑集 第62巻5号1398頁",areas:["刑事"],
 holdings:"捜査機関が、犯人の同一性を確認するため、公道上やパチンコ店内にいる被告人の容ぼう等を本人の同意なくビデオ撮影することは、捜査目的を達成するため必要な範囲において相当な方法で行われたものとして適法である。",
 summary:"強盗殺人事件の捜査で、防犯カメラの映像と比較するため被疑者を公道等で撮影した事案。通常人が他人から観察されうる場所での撮影は、必要性・相当性があれば令状なく行えるとした。京都府学連事件の基準を発展させた判例。",
 laws:["刑事訴訟法197条1項", "憲法13条"],tags:["ビデオ撮影", "任意捜査", "肖像権", "必要性と相当性"]},
{id:"c178",lid:50063,name:"おとり捜査の適法性",caseNo:"平成15(あ)1815",date:"2004-07-12",wareki:"平成16年7月12日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"棄却",reporter:"刑集 第58巻5号333頁",areas:["刑事"],
 holdings:"直接の被害者がいない薬物犯罪等の捜査において、通常の捜査方法のみでは摘発が困難な場合に、機会があれば犯罪を行う意思があると疑われる者を対象におとり捜査を行うことは、刑事訴訟法197条1項に基づく任意捜査として許容される。",
 summary:"大麻の密輸入事件で、捜査機関が協力者を通じて被告人に薬物の持込みを働きかけた事案。おとり捜査の適法性を正面から認め、その要件を示した判例。",
 laws:["刑事訴訟法197条1項"],tags:["おとり捜査", "任意捜査", "薬物犯罪", "捜査の適法性"]},
{id:"c179",lid:52506,name:"接見交通権と接見指定（浅井事件）",caseNo:"平成5(オ)1189",date:"1999-03-24",wareki:"平成11年3月24日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"その他",reporter:"民集 第53巻3号514頁",areas:["憲法", "刑事"],
 holdings:"刑事訴訟法39条3項の接見指定は、接見を認めると取調べの中断等により捜査に顕著な支障が生ずる場合に限って許され、その場合も捜査機関はできる限り速やかな接見のための日時等を指定し、被疑者が防御の準備をする権利を不当に制限してはならない。",
 summary:"弁護士が逮捕直後の被疑者との接見を求めたが検察官に拒否されたことについて国家賠償を求めた事件。接見指定制度自体は合憲としつつ、接見交通権が憲法34条の弁護人依頼権に由来する重要な権利であることを確認し、指定の要件を厳格に解した。",
 laws:["憲法34条", "刑事訴訟法39条3項", "国家賠償法1条1項"],tags:["接見交通権", "接見指定", "弁護人依頼権", "捜査の必要"]},
{id:"c180",lid:50012,name:"訴因変更の要否（共謀の日時・場所）",caseNo:"平成11(あ)423",date:"2001-04-11",wareki:"平成13年4月11日",court:"最高裁判所",bench:"第三小法廷",kind:"決定",result:"棄却",reporter:"刑集 第55巻3号127頁",areas:["刑事"],
 holdings:"殺人罪の共同正犯の訴因において実行行為者が誰であるかは審判対象の画定に必要な事項ではないが、訴因に明示された実行行為者と異なる認定をするには、被告人の防御の観点から争点を明確にする手続を経る必要があり、不意打ちとなる場合は訴因変更を要する。",
 summary:"訴因変更の要否について、審判対象の画定に不可欠な事項は訴因の記載が必要であり、それ以外の事項でも被告人の防御上重要な事項については、原則として訴因変更手続を要するが、審理経過に照らして不意打ちでなく不利益でなければ訴因変更なしに認定できるとする基準を示した。",
 laws:["刑事訴訟法256条3項", "刑事訴訟法312条1項"],tags:["訴因変更", "審判対象", "防御権", "不意打ち"]},
{id:"c181",lid:50835,name:"切り違え尋問と自白の任意性",caseNo:"昭和42(あ)1546",date:"1970-11-25",wareki:"昭和45年11月25日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"刑集 第24巻12号1670頁",areas:["憲法", "刑事"],
 holdings:"共犯者が自白していないにもかかわらず自白したと偽って被疑者を取り調べて得た自白は、虚偽の自白を誘発するおそれのある状況下でされた疑いがあり、任意性に疑いがあるものとして証拠能力を否定すべきである。",
 summary:"取調官が共犯者の自白があるかのように偽計を用いて被疑者から自白を得た事案。偽計による自白について、虚偽自白を誘発するおそれがある場合には任意性を欠くとして証拠能力を否定した。偽計自白排除の基本判例。",
 laws:["憲法38条2項", "刑事訴訟法319条1項"],tags:["自白の任意性", "偽計", "切り違え尋問", "証拠能力"]},
{id:"c182",lid:51097,name:"財田川事件再審決定（白鳥決定の適用）",caseNo:"昭和49(し)118",date:"1976-10-12",wareki:"昭和51年10月12日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"その他",reporter:"刑集 第30巻9号1673頁",areas:["刑事"],
 holdings:"再審開始の要件である「無罪を言い渡すべき明らかな証拠」の判断においても「疑わしいときは被告人の利益に」の原則が適用され、確定判決の認定に合理的な疑いを生じさせるかどうかは、新証拠と旧証拠を総合的に評価して判断すべきである。",
 summary:"死刑確定者からの再審請求について、原審が再審請求を棄却したことに対する特別抗告事件。白鳥決定の示した基準を再確認し、新証拠の評価にあたり旧証拠との総合評価を求めて原決定を取り消し差し戻した。その後、再審で無罪となった。",
 laws:["刑事訴訟法435条6号"],tags:["再審", "明らかな証拠", "疑わしきは被告人の利益に", "死刑"]},
{id:"c183",lid:81769,name:"裁判員制度合憲判決",caseNo:"平成22(あ)1196",date:"2011-11-16",wareki:"平成23年11月16日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"刑集 第65巻8号1285頁",areas:["憲法", "刑事"],
 holdings:"裁判員制度は、裁判官と国民とにより構成される裁判体が刑事裁判を行う制度であり、憲法31条、32条、37条1項、76条1項、80条1項、76条3項、18条のいずれにも違反しない。",
 summary:"覚せい剤密輸事件の被告人が、裁判員制度は憲法に違反すると主張した事件。憲法は国民の司法参加を禁じておらず、裁判員制度には公平な裁判所による裁判を確保する仕組みが整えられているとして、全員一致で合憲とした。",
 laws:["憲法31条", "憲法32条", "憲法37条1項", "憲法76条", "憲法80条1項", "裁判員の参加する刑事裁判に関する法律"],tags:["裁判員制度", "国民の司法参加", "公平な裁判所", "合憲"]},
{id:"c184",lid:50355,name:"ロッキード事件丸紅ルート（刑事免責による証言）",caseNo:"昭和62(あ)1351",date:"1995-02-22",wareki:"平成7年2月22日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"刑集 第49巻2号1頁",areas:["刑事"],
 holdings:"刑事免責を付与して得られた嘱託証人尋問調書は、我が国の刑事訴訟法が刑事免責制度を採用していない以上、これを事実認定の証拠とすることは許容されない。",
 summary:"元内閣総理大臣に対する受託収賄事件で、米国で刑事免責を付与して得た証言の証拠能力が争われた。最高裁は、刑事免責による証言の取得は刑事訴訟法に規定がなく許されないとして証拠能力を否定したが、その他の証拠により有罪判決を維持した。",
 laws:["刑事訴訟法197条1項", "刑事訴訟法321条1項", "刑法197条1項"],tags:["刑事免責", "証拠能力", "嘱託証人尋問", "受託収賄"]},
{id:"c185",lid:50235,name:"永山事件（死刑選択の基準）",caseNo:"昭和56(あ)1505",date:"1983-07-08",wareki:"昭和58年7月8日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"刑集 第37巻6号609頁",areas:["刑事"],
 holdings:"死刑の選択は、犯行の罪質、動機、態様ことに殺害の手段方法の執拗性・残虐性、結果の重大性ことに殺害された被害者の数、遺族の被害感情、社会的影響、犯人の年齢、前科、犯行後の情状等各般の情状を併せ考察したとき、その罪責が誠に重大であって、罪刑の均衡の見地からも一般予防の見地からも極刑がやむを得ないと認められる場合に許される。",
 summary:"連続射殺事件の被告人について、第二審が死刑を破棄して無期懲役としたことに対する検察官上告事件。死刑選択の際に考慮すべき事情を列挙し（いわゆる永山基準）、原判決を破棄して差し戻した。以後の死刑判断の基準となっている。",
 laws:["刑法199条", "刑法9条"],tags:["死刑", "量刑基準", "永山基準", "罪刑の均衡"]},
{id:"c186",lid:33235,name:"光市母子殺害事件（死刑回避の破棄差戻し）",caseNo:"平成14(あ)730",date:"2006-06-20",wareki:"平成18年6月20日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄差戻",reporter:"集刑 第289号383頁",areas:["刑事"],
 holdings:"犯行時18歳の少年による強姦目的の母子殺害について、無期懲役とした原判決は、犯行の罪質・動機・態様等に照らして量刑が甚だしく不当であり、死刑を選択しないことを是認する特に酌量すべき事情があるとはいえない。",
 summary:"犯行時18歳1か月の被告人による母子殺害事件について、第一審・第二審の無期懲役判決を破棄し差し戻した。少年であることは死刑を回避すべき決定的な事情とはいえないとし、差戻審で死刑が言い渡され、平成24年に確定した。",
 laws:["刑法199条", "刑法9条", "少年法51条"],tags:["死刑", "少年", "量刑", "破棄差戻し"]},
{id:"c187",lid:50076,name:"証人の遮へい措置・ビデオリンク方式の合憲性",caseNo:"平成16(あ)1618",date:"2005-04-14",wareki:"平成17年4月14日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"刑集 第59巻3号259頁",areas:["憲法", "刑事"],
 holdings:"証人尋問の際に証人と被告人との間に遮へい措置を採り、またはビデオリンク方式によることは、被告人が証人の供述を聞き自ら尋問することができ、弁護人が証人の状態を観察できることから、憲法37条2項前段・82条1項に違反しない。",
 summary:"性犯罪の被害者の証人尋問における遮へい措置やビデオリンク方式が、被告人の証人審問権や公開裁判の原則に反しないかが争われた。証人保護の必要性と被告人の権利の調整として合憲とした。",
 laws:["憲法37条2項", "憲法82条1項", "刑事訴訟法157条の5", "刑事訴訟法157条の6"],tags:["証人審問権", "遮へい措置", "ビデオリンク", "被害者保護"]},
{id:"c188",lid:50400,name:"電話傍受の適法性",caseNo:"平成9(あ)636",date:"1999-12-16",wareki:"平成11年12月16日",court:"最高裁判所",bench:"第三小法廷",kind:"決定",result:"棄却",reporter:"刑集 第53巻9号1327頁",areas:["刑事"],
 holdings:"電話傍受は通信の秘密を侵害し個人のプライバシーを侵害する強制処分であるが、重大な犯罪に係る被疑事件について、犯罪の嫌疑と電話による関連通話の蓋然性が高く、他の方法では著しく困難であるなど、真にやむを得ない場合には、法律の定める手続に従って行うことが許される。",
 summary:"通信傍受法制定前に検証許可状によって行われた電話傍受の適法性が争われた事案。電話傍受を強制処分と位置付け、厳格な要件のもとで検証令状による実施を認めた。通信傍受法制定の契機となった判例。",
 laws:["憲法21条2項", "憲法35条", "刑事訴訟法218条1項"],tags:["電話傍受", "通信の秘密", "強制処分", "検証令状"]},
{id:"c189",lid:50210,name:"強制採尿の適法性",caseNo:"昭和54(あ)429",date:"1980-10-23",wareki:"昭和55年10月23日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"棄却",reporter:"刑集 第34巻5号300頁",areas:["刑事"],
 holdings:"被疑者の身体から尿を強制的に採取することは、被疑事件の重大性、嫌疑の存在、証拠としての重要性と必要性、適当な代替手段の不存在等の事情に照らし、犯罪捜査上真にやむを得ない場合には、最終的手段として捜索差押令状によって許される。",
 summary:"覚せい剤使用の疑いのある被疑者が任意の採尿に応じないため、医師による導尿で強制的に採尿した事案。強制採尿を身体に対する捜索差押えとみて、医師による医学的に相当な方法で行うことを条件とした「強制採尿令状」の手続を示した。",
 laws:["刑事訴訟法218条1項", "刑事訴訟法222条1項"],tags:["強制採尿", "捜索差押令状", "身体検査", "覚せい剤"]},
{id:"c190",lid:50262,name:"高輪グリーンマンション事件（宿泊を伴う取調べ）",caseNo:"昭和57(あ)301",date:"1984-02-29",wareki:"昭和59年2月29日",court:"最高裁判所",bench:"第二小法廷",kind:"決定",result:"棄却",reporter:"刑集 第38巻3号479頁",areas:["刑事"],
 holdings:"任意同行した被疑者を4夜にわたり警察の手配した宿泊施設に泊めて連日取り調べた捜査は、任意捜査の方法として必ずしも妥当とはいえないが、被疑者が応じていたこと等の事情から、社会通念上相当と認められる範囲を逸脱しているとまではいえない。",
 summary:"殺人事件の被疑者を任意同行し、捜査官が付き添って宿泊させ連日取り調べた事案。任意捜査の限界に関する判断基準として、被疑者の承諾の有無と社会通念上の相当性を挙げ、本件では適法としたが、取調べの在り方に強い疑問を示した。",
 laws:["刑事訴訟法197条1項", "刑事訴訟法198条1項"],tags:["任意取調べ", "任意同行", "宿泊", "任意捜査の限界"]},
{id:"c191",lid:57029,name:"方法の錯誤（併発事件）",caseNo:"昭和52(あ)623",date:"1978-07-28",wareki:"昭和53年7月28日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"刑集 第32巻5号1068頁",areas:["刑事"],
 holdings:"犯人が特定の人を殺害する意思で発砲したところ、目的の人物のほか意図しなかった別の人にも弾が当たって傷害を負わせた場合、人を殺す意思があった以上、別の人に対しても殺人未遂罪の故意が認められる。",
 summary:"巡査からけん銃を奪う目的で殺意をもって発砲したところ、通行人にも命中した事案。故意の内容は「人」を殺す意思で足りるとして、意図しなかった被害者についても殺人未遂罪の成立を認めた。法定的符合説の数故意犯説に立つことを明らかにした判例。",
 laws:["刑法38条1項", "刑法199条", "刑法203条"],tags:["方法の錯誤", "法定的符合説", "故意", "数故意犯"]},
{id:"c192",lid:51141,name:"抽象的事実の錯誤（覚せい剤と麻薬）",caseNo:"昭和52(あ)836",date:"1979-03-27",wareki:"昭和54年3月27日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"棄却",reporter:"刑集 第33巻2号140頁",areas:["刑事"],
 holdings:"麻薬を覚せい剤と誤認して輸入した場合、麻薬輸入罪と覚せい剤輸入罪の構成要件は実質的に重なり合うため、麻薬輸入罪の故意に欠けるところはなく、麻薬輸入罪が成立する。",
 summary:"覚せい剤だと思って輸入した物が実際には麻薬（ジアセチルモルヒネ）だった事案。両罪は目的物の点で異なるが、取締の目的や法定刑が同一であり構成要件が実質的に重なり合うとして、認識した事実と発生した事実の符合する範囲で麻薬輸入罪の成立を認めた。抽象的事実の錯誤に関する基本判例。",
 laws:["刑法38条2項", "麻薬取締法", "覚せい剤取締法"],tags:["抽象的事実の錯誤", "構成要件の重なり合い", "故意", "薬物"]},
{id:"c193",lid:50294,name:"12歳の養女を利用した窃盗（間接正犯）",caseNo:"昭和58(あ)537",date:"1983-09-21",wareki:"昭和58年9月21日",court:"最高裁判所",bench:"第一小法廷",kind:"決定",result:"棄却",reporter:"刑集 第37巻7号1070頁",areas:["刑事"],
 holdings:"日ごろ被告人の言動に逆らう素振りを見せると顔面に暴行を加えるなどして自己の意のままに従わせていた12歳の養女に窃盗を命じて行わせた場合、養女が是非善悪の判断能力を有していても、被告人には窃盗罪の間接正犯が成立する。",
 summary:"養女を暴行により支配し窃盗を命じた事案。被利用者が刑事未成年で判断能力があっても、意思を抑圧されて道具として利用された場合には利用者に間接正犯が成立するとした。",
 laws:["刑法235条", "刑法41条", "刑法60条"],tags:["間接正犯", "刑事未成年", "意思の抑圧", "窃盗"]},
{id:"c194",lid:50066,name:"ストーカー規制法合憲判決",caseNo:"平成15(あ)520",date:"2003-12-11",wareki:"平成15年12月11日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"刑集 第57巻11号1147頁",areas:["憲法", "刑事"],
 holdings:"ストーカー規制法は、個人の身体・自由・名誉に対する危害の発生を防止し国民の生活の安全と平穏に資するという正当な目的のため、規制対象を明確に限定し、必要かつ合理的な規制をするものであり、憲法13条・21条1項に違反しない。",
 summary:"ストーカー行為規制法の処罰規定の合憲性が初めて最高裁で争われた事件。つきまとい等の規制は、恋愛感情等を充足する目的という主観的要件と反復という客観的要件により対象が限定されており、過度に広範とはいえないとして合憲とした。",
 laws:["憲法13条", "憲法21条1項", "ストーカー行為等の規制等に関する法律2条", "ストーカー行為等の規制等に関する法律13条"],tags:["ストーカー規制法", "明確性", "表現の自由", "合憲"]},
{id:"c195",lid:51848,name:"戸別訪問禁止合憲判決",caseNo:"昭和55(あ)874",date:"1981-06-15",wareki:"昭和56年6月15日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"刑集 第35巻4号205頁",areas:["憲法", "刑事"],
 holdings:"公職選挙法による戸別訪問の一律禁止は、意見表明そのものの制約ではなく、戸別訪問という手段方法に伴う弊害を防止し選挙の自由と公正を確保するための合理的で必要やむを得ない限度の制約であり、憲法21条に違反しない。",
 summary:"選挙運動として戸別訪問をした者が起訴された事件。戸別訪問の禁止は、買収の温床となりやすく、候補者や選挙人の生活の平穏を害するなどの弊害防止を目的とする間接的・付随的な制約にすぎないとして合憲とした。",
 laws:["憲法21条", "公職選挙法138条1項", "公職選挙法239条"],tags:["戸別訪問", "選挙運動", "表現の自由", "間接的付随的制約"]},
{id:"c196",lid:52502,name:"第四銀行事件（就業規則の不利益変更）",caseNo:"平成4(オ)2122",date:"1997-02-28",wareki:"平成9年2月28日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"民集 第51巻2号705頁",areas:["労働", "民事"],
 holdings:"就業規則の変更によって労働者に不利益を及ぼす場合、その変更が合理的なものである限り、個々の労働者が同意しないことを理由にその適用を拒むことはできない。合理性の有無は、不利益の程度、変更の必要性、変更後の内容の相当性、代償措置、労働組合等との交渉の経緯、他の労働組合や従業員の対応、同種事項に関する社会の一般的状況等を総合考慮して判断する。",
 summary:"定年を55歳から60歳に延長する代わりに55歳以降の賃金を引き下げた就業規則の変更が争われた事件。秋北バス事件以来の合理性判断の考慮要素を整理し、本件変更は合理的であるとした。労働契約法10条の基礎となった判例。",
 laws:["労働契約法10条", "労働基準法89条", "労働基準法93条"],tags:["就業規則", "不利益変更", "合理性", "定年延長"]},
{id:"c197",lid:54794,name:"みちのく銀行事件",caseNo:"平成8(オ)1677",date:"2000-09-07",wareki:"平成12年9月7日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"その他",reporter:"民集 第54巻7号2075頁",areas:["労働", "民事"],
 holdings:"就業規則の変更が特定の層の労働者にのみ大きな不利益を与えるものである場合、多数組合の同意があっても、不利益を受ける労働者について相応の代償措置等を講じていないときは、変更の合理性は認められない。",
 summary:"55歳以上の行員の賃金を大幅に減額する就業規則の変更について、多数組合が同意していたにもかかわらず、高年齢層にのみ不利益を集中させ、経過措置も不十分であるとして合理性を否定した。第四銀行事件との対比で理解される判例。",
 laws:["労働契約法10条", "労働基準法89条"],tags:["就業規則", "不利益変更", "合理性", "高年齢者"]},
{id:"c198",lid:52195,name:"大曲市農協事件",caseNo:"昭和60(オ)104",date:"1988-02-16",wareki:"昭和63年2月16日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄自判",reporter:"民集 第42巻2号60頁",areas:["労働", "民事"],
 holdings:"賃金、退職金など労働者にとって重要な権利・労働条件に関し実質的な不利益を及ぼす就業規則の変更については、そのような不利益を労働者に法的に受忍させることを許容できるだけの高度の必要性に基づいた合理的な内容のものであることを要する。",
 summary:"農協の合併に伴い退職金の支給率が引き下げられた事案。賃金・退職金という重要な労働条件の不利益変更には高度の必要性が必要であるとしたうえで、合併に伴う労働条件の統一の必要性等を考慮して変更の合理性を認めた。",
 laws:["労働契約法10条", "労働基準法89条"],tags:["就業規則", "不利益変更", "退職金", "高度の必要性"]},
{id:"c199",lid:62496,name:"フジ興産事件（就業規則の周知）",caseNo:"平成13(受)1709",date:"2003-10-10",wareki:"平成15年10月10日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"集民 第211号1頁",areas:["労働", "民事"],
 holdings:"使用者が労働者を懲戒するには、あらかじめ就業規則において懲戒の種別および事由を定めておくことを要し、就業規則が法的規範としての性質を有するものとして拘束力を生ずるためには、その内容を適用を受ける事業場の労働者に周知させる手続が採られていることを要する。",
 summary:"就業規則に基づく懲戒解雇の効力が争われた事案で、就業規則が事業場の労働者に周知されていなければ拘束力を持たないことを明示した。労働契約法7条の周知要件の基礎となった判例。",
 laws:["労働契約法7条", "労働基準法106条", "労働基準法89条"],tags:["就業規則", "周知", "懲戒解雇", "拘束力"]},
{id:"c200",lid:52526,name:"朝日放送事件（労組法上の使用者）",caseNo:"平成5(行ツ)17",date:"1995-02-28",wareki:"平成7年2月28日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"その他",reporter:"民集 第49巻2号559頁",areas:["労働", "行政"],
 holdings:"雇用主以外の事業主であっても、雇用主から労働者の派遣を受けて自己の業務に従事させ、その労働者の基本的な労働条件等について、雇用主と部分的とはいえ同視できる程度に現実的かつ具体的に支配、決定することができる地位にある場合には、その限りにおいて労組法7条の使用者に当たる。",
 summary:"下請会社の従業員を自社のテレビ番組制作に従事させていた放送会社が、下請従業員の組合からの団体交渉を拒否した事案。労働条件を現実的・具体的に支配していた範囲で、直接の雇用主でなくても団交応諾義務を負う使用者に当たるとした。",
 laws:["労働組合法7条2号"],tags:["使用者性", "団体交渉", "不当労働行為", "派遣"]},
{id:"c201",lid:62788,name:"横浜南労基署長事件（労働者性・持込みトラック運転手）",caseNo:"平成7(行ツ)65",date:"1996-11-28",wareki:"平成8年11月28日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"集民 第180号857頁",areas:["労働", "行政"],
 holdings:"自己の所有するトラックを持ち込んで製鋼所の運送業務に従事していた運転手は、業務遂行について指揮監督が及んでいたとはいえず、報酬も出来高払いであるなどの事情から、労働基準法・労災保険法上の労働者に当たらない。",
 summary:"自己所有のトラックで運送業務を専属的に行っていた運転手が、作業中の事故について労災保険給付を請求した事案。運送の依頼を拒否できたこと、時間的場所的拘束が緩やかであったこと、車両や経費を自己負担していたことなどから使用従属性を否定した。",
 laws:["労働基準法9条", "労働者災害補償保険法"],tags:["労働者性", "使用従属性", "労災保険", "個人事業主"]},
{id:"c202",lid:81241,name:"新国立劇場運営財団事件（労組法上の労働者）",caseNo:"平成21(行ヒ)226",date:"2011-04-12",wareki:"平成23年4月12日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第65巻3号943頁",areas:["労働", "行政"],
 holdings:"劇場との間で期間1年の出演基本契約を締結し、個別公演に出演していた合唱団員は、事業組織に組み入れられ、契約内容を一方的に決定され、報酬が労務の対価としての性格を有することなどから、労働組合法上の労働者に当たる。",
 summary:"合唱団員の出演基本契約の更新拒否をめぐり、団員が所属する組合の団体交渉申入れを劇場が拒否した事案。労組法上の労働者性について、事業組織への組入れ、契約内容の一方的決定、報酬の労務対価性などを考慮要素として判断する枠組みを示した。",
 laws:["労働組合法3条", "労働組合法7条2号"],tags:["労働者性", "労働組合法", "団体交渉", "業務委託"]},
{id:"c203",lid:52572,name:"三菱重工長崎造船所事件（労働時間の概念）",caseNo:"平成7(オ)2029",date:"2000-03-09",wareki:"平成12年3月9日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第54巻3号801頁",areas:["労働", "民事"],
 holdings:"労働基準法上の労働時間とは、労働者が使用者の指揮命令下に置かれている時間をいい、その該当性は労働契約や就業規則の定めにかかわらず客観的に定まる。作業服・保護具の装着や準備作業が使用者から義務付けられている場合、それに要する時間は労働時間に当たる。",
 summary:"造船所の労働者が、始業前の作業服・保護具の装着や終業後の洗身などに要した時間について割増賃金を請求した事案。労働時間を客観的に定まる概念とし、義務付けられた準備行為等の時間は労働時間に当たるとした。",
 laws:["労働基準法32条", "労働基準法37条"],tags:["労働時間", "指揮命令下", "準備時間", "割増賃金"]},
{id:"c204",lid:52614,name:"大星ビル管理事件（仮眠時間と労働時間）",caseNo:"平成9(オ)608",date:"2002-02-28",wareki:"平成14年2月28日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第56巻2号361頁",areas:["労働", "民事"],
 holdings:"不活動仮眠時間であっても、労働者が労働契約上の役務の提供を義務付けられていると評価され、労働からの解放が保障されていない場合には、労働基準法上の労働時間に当たる。",
 summary:"ビル管理の泊まり勤務において、仮眠時間中も警報等への対応が義務付けられていた労働者が、仮眠時間についての賃金・割増賃金を請求した事案。仮眠時間中も指揮命令下にあるとして労働時間性を認めた。",
 laws:["労働基準法32条", "労働基準法37条"],tags:["労働時間", "仮眠時間", "手待時間", "宿直"]},
{id:"c205",lid:89433,name:"国際自動車事件（歩合給からの残業代控除）",caseNo:"平成30(受)908",date:"2020-03-30",wareki:"令和2年3月30日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第74巻3号549頁",areas:["労働", "民事"],
 holdings:"歩合給の計算において、時間外労働等に対する割増賃金に相当する額を控除する仕組みの下では、割増賃金として支払われた金額が通常の労働時間の賃金に当たる部分を含んでいるため、割増賃金の支払があったとはいえない。",
 summary:"タクシー会社の賃金規則が、歩合給から残業手当等の額を控除する仕組みになっていたため、残業しても賃金総額が変わらなかった事案。割増賃金の部分と通常の賃金の部分を判別できないとして、労基法37条の割増賃金が支払われたとはいえないとした。",
 laws:["労働基準法37条"],tags:["割増賃金", "歩合給", "判別可能性", "タクシー"]},
{id:"c206",lid:62698,name:"高知県観光事件（歩合給と割増賃金）",caseNo:"平成3(オ)63",date:"1994-06-13",wareki:"平成6年6月13日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄自判",reporter:"集民 第172号673頁",areas:["労働", "民事"],
 holdings:"タクシー運転手の歩合給について、時間外・深夜労働を行った場合にも歩合給の額が増額されず、通常の労働時間の賃金に当たる部分と割増賃金に当たる部分とを判別することもできない場合、歩合給の支給によって割増賃金が支払われたとはいえない。",
 summary:"完全歩合制の賃金体系で割増賃金が支払われていないと争われた事案。歩合給に割増賃金が含まれているというためには、通常の賃金部分と割増部分が判別できる必要があるとした。固定残業代の判別可能性要件の原点。",
 laws:["労働基準法37条"],tags:["割増賃金", "歩合給", "判別可能性", "固定残業代"]},
{id:"c207",lid:87883,name:"日本ケミカル事件（固定残業代）",caseNo:"平成29(受)842",date:"2018-07-19",wareki:"平成30年7月19日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄差戻",reporter:"集民 第259号77頁",areas:["労働", "民事"],
 holdings:"雇用契約において定額の手当が時間外労働等の対価として支払われるものとされているか否かは、契約書等の記載内容のほか、使用者の労働者に対する説明の内容、実際の労働時間等の勤務状況などの事情を考慮して判断すべきである。",
 summary:"薬剤師に支払われていた「業務手当」が固定残業代として有効かが争われた事案。原審は手当が何時間分の残業代かが明らかでないとして無効としたが、最高裁は雇用契約書等で残業手当であることが明示されていれば足りるとして有効と判断した。",
 laws:["労働基準法37条"],tags:["固定残業代", "割増賃金", "対価性", "業務手当"]},
{id:"c208",lid:86897,name:"医療法人康心会事件（年俸制と割増賃金）",caseNo:"平成28(受)222",date:"2017-07-07",wareki:"平成29年7月7日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"その他",reporter:"集民 第256号31頁",areas:["労働", "民事"],
 holdings:"年俸に時間外労働等に対する割増賃金を含める旨の合意がされていても、年俸のうち割増賃金に当たる部分とそれ以外の部分とを判別することができない場合には、割増賃金が支払われたということはできない。",
 summary:"年俸1700万円の医師について、時間外割増賃金が年俸に含まれるとの合意があったと主張された事案。高額の年俸であっても判別可能性がなければ割増賃金の支払とは認められないとし、労基法37条の趣旨を貫いた。",
 laws:["労働基準法37条"],tags:["割増賃金", "年俸制", "判別可能性", "医師"]},
{id:"c209",lid:52772,name:"時事通信社事件（長期休暇と時季変更権）",caseNo:"平成1(オ)399",date:"1992-06-23",wareki:"平成4年6月23日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第46巻4号306頁",areas:["労働", "民事"],
 holdings:"労働者が長期かつ連続の年次有給休暇の時季指定をした場合、使用者には調整の機会が与えられるべきであり、調整を経ない時季指定に対しては、使用者の時季変更権の行使について、ある程度の裁量的判断が許される。",
 summary:"記者が1か月の連続休暇を申請したところ、会社が後半2週間について時季変更権を行使した事案。長期連続休暇については、事前の調整を経ていない限り、使用者側の裁量的判断を広く認めた。",
 laws:["労働基準法39条5項"],tags:["年次有給休暇", "時季変更権", "長期休暇", "事業の正常な運営"]},
{id:"c210",lid:51891,name:"白石営林署事件（年休の法的性質）",caseNo:"昭和41(オ)848",date:"1973-03-02",wareki:"昭和48年3月2日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"民集 第27巻2号191頁",areas:["労働", "民事"],
 holdings:"年次有給休暇の権利は、労働基準法の要件を充足することにより法律上当然に労働者に生ずる権利であって、労働者の請求を待って初めて生ずるものではなく、年休の利用目的は労働基準法の関知しないところである。",
 summary:"争議行為に参加するため年休を取得した労働者について、使用者が年休を認めず賃金カットした事案。年休権は要件充足により当然に発生し、労働者の時季指定に対して使用者が時季変更権を行使しない限り年休が成立するとした。年休の利用目的自由の原則を確立した判例。",
 laws:["労働基準法39条"],tags:["年次有給休暇", "時季指定権", "利用目的の自由", "争議行為"]},
{id:"c211",lid:52785,name:"沼津交通事件（年休取得と皆勤手当）",caseNo:"平成4(オ)1078",date:"1993-06-25",wareki:"平成5年6月25日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"民集 第47巻6号4585頁",areas:["労働", "民事"],
 holdings:"年次有給休暇を取得した日を欠勤として扱い皆勤手当を減額する措置は、その趣旨・目的、労働者が失う経済的利益の程度、年休取得に対する事実上の抑止力の強弱等諸般の事情を総合して、年休権の行使を抑制し法が労働者に年休権を保障した趣旨を実質的に失わせるものと認められない限り、公序に反して無効とはならない。",
 summary:"タクシー会社が年休取得日を皆勤手当の算定において欠勤扱いとした措置の効力が争われた。皆勤手当の額が比較的小さく、年休取得を抑止する効果が強いとはいえないとして、有効とした。",
 laws:["労働基準法39条", "労働基準法附則136条"],tags:["年次有給休暇", "皆勤手当", "不利益取扱い", "公序"]},
{id:"c212",lid:52696,name:"日本シェーリング事件（出勤率と不就労日）",caseNo:"昭和58(オ)1542",date:"1989-12-14",wareki:"平成元年12月14日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第43巻12号1895頁",areas:["労働", "民事"],
 holdings:"賃上げの対象者を前年の出勤率80パーセント以上の者に限定する条項において、争議行為による不就労日や年次有給休暇、産前産後休業などの日を欠勤日として扱う部分は、労働者の権利の行使を抑制し法の趣旨を実質的に失わせるものとして公序に反し無効である。",
 summary:"争議行為不参加日や年休・産休などを欠勤扱いとして賃上げ対象から除外する労働協約の条項が争われた事案。法が保障する権利の行使を抑制する効果を持つ条項は公序良俗に反すると判断した。",
 laws:["労働基準法39条", "労働基準法65条", "民法90条"],tags:["出勤率要件", "不利益取扱い", "年次有給休暇", "公序"]},
{id:"c213",lid:73145,name:"関西電力事件（職場内の監視と人格権）",caseNo:"平成4(オ)10",date:"1995-09-05",wareki:"平成7年9月5日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"集民 第176号563頁",areas:["労働", "民事"],
 holdings:"特定の労働者を共産党員またはその同調者であるとして、職場の内外で継続的に監視し、他の従業員との接触を妨げ、ロッカーを無断で開けるなどした使用者の行為は、労働者の職場における自由な人間関係を形成する自由を侵害し、名誉・プライバシーを侵害する不法行為に当たる。",
 summary:"電力会社が特定の思想を持つとみた従業員を監視・孤立化させた事案。企業内における労働者の人格的利益を正面から認め、使用者の行為を不法行為とした。職場におけるプライバシー保護の基本判例。",
 laws:["民法709条", "民法715条", "憲法19条"],tags:["人格権", "プライバシー", "職場の監視", "思想差別"]},
{id:"c214",lid:54158,name:"横浜ゴム事件（私生活上の非行と懲戒解雇）",caseNo:"昭和44(オ)204",date:"1970-07-28",wareki:"昭和45年7月28日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第24巻7号頁",areas:["労働", "民事"],
 holdings:"従業員が職場外で行った住居侵入の非行について、会社の体面を著しく汚したとして懲戒解雇することは、行為の態様や会社の事業活動に与える影響等に照らし、懲戒解雇事由に当たらない。",
 summary:"深夜に他人の住居に侵入し罰金刑を受けた従業員を会社が懲戒解雇した事案。犯罪行為が私生活上のものであり、会社名や地位が報道されず、職務上の地位も重要でないことから、会社の体面を著しく汚したとはいえないとして懲戒解雇を無効とした。",
 laws:["労働契約法15条", "民法90条"],tags:["懲戒解雇", "私生活上の非行", "企業秩序", "会社の体面"]},
{id:"c215",lid:51996,name:"国鉄中国支社事件（懲戒権の根拠）",caseNo:"昭和45(オ)1196",date:"1974-02-28",wareki:"昭和49年2月28日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄自判",reporter:"民集 第28巻1号66頁",areas:["労働", "民事"],
 holdings:"使用者は企業秩序を維持するため、就業規則において企業秩序違反行為に対する懲戒処分を定めることができ、労働者が企業の社会的評価を毀損する行為を職場外で行った場合でも、企業秩序に関係を有するものについては懲戒の対象とすることができる。",
 summary:"勤務時間外に職場外で国鉄批判のビラを配布した職員に対する懲戒処分が争われた事案。企業秩序定立権を根拠に懲戒権を認め、企業外の行為も企業秩序に関係する限り懲戒対象になりうるとした。",
 laws:["労働契約法15条"],tags:["懲戒権", "企業秩序", "職場外の行為", "ビラ配布"]},
{id:"c216",lid:62805,name:"山口観光事件（懲戒事由の追加）",caseNo:"平成8(オ)752",date:"1996-09-26",wareki:"平成8年9月26日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"集民 第180号473頁",areas:["労働", "民事"],
 holdings:"使用者が労働者に対して懲戒処分をした当時に認識していなかった非違行為は、特段の事情のない限り、当該懲戒処分の理由とされたものでないことが明らかであるから、その存在をもって当該懲戒処分の有効性を根拠付けることはできない。",
 summary:"経歴詐称を理由とする懲戒解雇の訴訟で、使用者が処分時に認識していなかった別の非違行為を解雇理由として追加主張した事案。懲戒処分は行為に対する制裁であることから、処分後に判明した事由の追加を原則として認めなかった。",
 laws:["労働契約法15条"],tags:["懲戒解雇", "懲戒事由の追加", "経歴詐称", "事後的追加"]},
{id:"c217",lid:33623,name:"ネスレ日本事件（懲戒権行使の時機）",caseNo:"平成16(受)918",date:"2006-10-06",wareki:"平成18年10月6日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄自判",reporter:"集民 第221号429頁",areas:["労働", "民事"],
 holdings:"従業員の非違行為から7年以上経過した後に行われた諭旨退職処分は、処分時点において企業秩序維持の観点からそのような重い処分を必要とする客観的に合理的な理由を欠き、社会通念上相当なものとして是認することはできない。",
 summary:"上司に対する暴行事件から7年以上経過した後に会社が諭旨退職処分を行った事案。長期間の経過により企業秩序の回復は果たされており、処分は権利濫用として無効とした。懲戒権の行使時期の制約を示した判例。",
 laws:["労働契約法15条", "民法1条3項"],tags:["懲戒処分", "権利濫用", "時機", "諭旨退職"]},
{id:"c218",lid:84883,name:"L館事件（セクハラ行為に対する懲戒）",caseNo:"平成26(受)1310",date:"2015-02-26",wareki:"平成27年2月26日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄自判",reporter:"集民 第249号109頁",areas:["労働", "民事"],
 holdings:"派遣労働者に対し1年以上にわたり性的な発言等のセクシュアル・ハラスメントを繰り返した管理職の従業員に対する出勤停止処分および降格は、被害者から明白な拒否の姿勢を示されていなかったことや事前の警告がなかったことを考慮しても、懲戒権の濫用に当たらない。",
 summary:"水族館の管理職従業員2名が女性従業員に対して繰り返し性的な発言をしたことを理由とする懲戒処分が争われた事案。原審は処分が重すぎるとしたが、最高裁はセクハラ防止方針が周知されていたことなどを重視し、処分を有効とした。",
 laws:["労働契約法15条", "男女雇用機会均等法11条"],tags:["セクシュアル・ハラスメント", "懲戒処分", "出勤停止", "降格"]},
{id:"c219",lid:52450,name:"神戸弘陵学園事件（試用期間と有期契約）",caseNo:"平成1(オ)854",date:"1990-06-05",wareki:"平成2年6月5日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第44巻4号668頁",areas:["労働", "民事"],
 holdings:"使用者が労働者を新規に採用するに当たり、雇用契約に期間を設けた場合において、その設けた趣旨・目的が労働者の適性を評価・判断するためのものであるときは、特段の事情がない限り、その期間は契約の存続期間ではなく試用期間であると解すべきである。",
 summary:"私立高校の教諭が1年の契約期間満了を理由に契約を終了された事案。契約期間が適性判断のための試用期間と解される場合には、期間満了による当然終了とはならず、解約権留保付きの労働契約として本採用拒否の相当性が問われるとした。",
 laws:["労働契約法16条", "労働契約法17条"],tags:["試用期間", "有期労働契約", "本採用拒否", "解約権留保"]},
{id:"c220",lid:19558,name:"東洋酸素事件（整理解雇の要件）",caseNo:"昭和51(ネ)1028",date:"1979-10-29",wareki:"昭和54年10月29日",court:"東京高等裁判所",bench:"",kind:"判決",result:"",reporter:"",areas:["労働", "民事"],
 holdings:"就業規則にいう「やむを得ない事業の都合」による解雇は、人員削減の必要性、解雇回避努力、被解雇者選定の合理性、手続の妥当性が認められる場合に限り有効である。",
 summary:"アセチレン部門の閉鎖に伴う整理解雇の効力が争われた事案。整理解雇の有効性判断における四つの要件（いわゆる整理解雇四要件）を体系的に示した裁判例として、以後の裁判実務に大きな影響を与えた。",
 laws:["労働契約法16条"],tags:["整理解雇", "四要件", "解雇回避努力", "人員削減"]},
{id:"c221",lid:62791,name:"ケンウッド事件（配転命令と家庭の事情）",caseNo:"平成8(オ)128",date:"2000-01-28",wareki:"平成12年1月28日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"集民 第196号285頁",areas:["労働", "民事"],
 holdings:"幼児を養育する女性労働者に対する転勤命令について、通勤時間が長くなり保育に支障が生ずるとしても、それが通常甘受すべき程度を著しく超える不利益とはいえない場合、転勤命令は権利の濫用に当たらない。",
 summary:"3歳の子を保育園に預けて勤務していた女性従業員に対する転勤命令を拒否したことによる懲戒解雇の効力が争われた事案。東亜ペイント事件の基準を適用し、転勤命令を有効とした。",
 laws:["労働契約法3条5項", "民法1条3項"],tags:["配転命令", "転勤", "権利濫用", "育児"]},
{id:"c222",lid:62441,name:"新日本製鐵（日鐵運輸第2）事件（出向命令）",caseNo:"平成11(受)805",date:"2003-04-18",wareki:"平成15年4月18日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"集民 第209号495頁",areas:["労働", "民事"],
 holdings:"就業規則に業務上の必要により出向を命ずることができる旨の規定があり、労働協約に出向期間や出向中の地位、賃金、退職金、復帰条件等の詳細な規定がある場合、使用者は労働者の個別的同意なしに出向を命ずることができる。",
 summary:"製鉄所の業務の一部を関連会社に委託したことに伴い、従業員に出向を命じた事案。就業規則・労働協約により出向労働者の利益に配慮した規定が整備されていることを理由に、個別同意なしの出向命令を有効とし、権利濫用にも当たらないとした。",
 laws:["労働契約法14条", "民法625条1項"],tags:["出向命令", "個別同意", "労働協約", "権利濫用"]},
{id:"c223",lid:53225,name:"国鉄札幌運転区事件（企業施設と組合活動）",caseNo:"昭和49(オ)1188",date:"1979-10-30",wareki:"昭和54年10月30日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄自判",reporter:"民集 第33巻6号647頁",areas:["労働", "民事"],
 holdings:"労働組合またはその組合員が使用者の許諾を得ないで企業の物的施設を利用して組合活動を行うことは、利用を許さないことが使用者の施設管理権の濫用であると認められる特段の事情がある場合を除き、正当な組合活動とはいえない。",
 summary:"組合員が許可なく職場のロッカーにビラを貼付したことを理由とする懲戒処分が争われた事案。企業の施設管理権を重視し、組合活動のための施設利用には原則として使用者の許諾が必要であるとした（許諾説）。",
 laws:["労働組合法7条", "労働組合法1条2項"],tags:["組合活動", "施設管理権", "ビラ貼り", "許諾"]},
{id:"c224",lid:65296,name:"御國ハイヤー事件（ピケッティングの限界）",caseNo:"平成1(オ)676",date:"1992-10-02",wareki:"平成4年10月2日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"集民 第166号1頁",areas:["労働", "民事"],
 holdings:"ストライキに際し、組合員が車両の前に座り込んだり立ちふさがったりして使用者による車両の搬出を阻止する行為は、使用者の操業の自由を侵害するものとして、争議行為の正当性の範囲を超える。",
 summary:"タクシー会社のストライキにおいて、非組合員による操業を阻止するためのピケッティングが行われた事案。争議行為は労務の不提供を本質とし、使用者の操業を実力で阻止することは正当性を欠くとした。",
 laws:["労働組合法1条2項", "労働組合法8条"],tags:["争議行為", "ピケッティング", "操業の自由", "正当性"]},
{id:"c225",lid:63052,name:"朝日火災海上保険（石堂）事件（労働協約による不利益変更）",caseNo:"平成7(オ)1299",date:"1997-03-27",wareki:"平成9年3月27日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"集民 第182号673頁",areas:["労働", "民事"],
 holdings:"労働協約に定める基準が労働者の労働条件を不利益に変更するものであることのみで、その規範的効力を否定することはできず、協約が特定または一部の組合員を殊更不利益に取り扱うことを目的として締結されたなど、労働組合の目的を逸脱して締結されたものでない限り、不利益変更も有効である。",
 summary:"定年年齢の引下げと退職金支給率の引下げを内容とする労働協約が、既に不利益を受ける組合員に対しても効力を及ぼすかが争われた事案。労働協約による労働条件の不利益変更を原則として認めた。",
 laws:["労働組合法16条"],tags:["労働協約", "不利益変更", "規範的効力", "組合の目的逸脱"]},
{id:"c226",lid:73140,name:"エッソ石油事件（チェック・オフ）",caseNo:"平成3(オ)928",date:"1993-03-25",wareki:"平成5年3月25日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"集民 第168号127頁",areas:["労働", "民事"],
 holdings:"使用者が組合費のチェック・オフを行うには、労使協定に加えて、個々の組合員から賃金から控除した組合費相当分を組合に支払うことの委任を受ける必要があり、組合員がその中止を申し入れたときは、使用者はチェック・オフを中止しなければならない。",
 summary:"組合から脱退した従業員が、使用者に対しチェック・オフの中止を求めた事案。チェック・オフは労働者の委任に基づくものであり、組合員の中止申入れがあれば使用者は中止すべきとした。",
 laws:["労働基準法24条1項", "民法643条"],tags:["チェック・オフ", "組合費", "賃金全額払い", "委任"]},
{id:"c227",lid:85681,name:"山梨県民信用組合事件（賃金減額への同意）",caseNo:"平成25(受)2595",date:"2016-02-19",wareki:"平成28年2月19日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第70巻2号123頁",areas:["労働", "民事"],
 holdings:"就業規則に定められた退職金の支給基準の変更に対する労働者の同意の有無は、変更を受け入れる旨の労働者の行為の有無だけでなく、変更により労働者にもたらされる不利益の内容・程度、労働者が同意するに至った経緯・態様、同意に先立つ情報提供・説明の内容等に照らして、労働者の自由な意思に基づいてされたものと認めるに足りる合理的な理由が客観的に存在するか否かという観点からも判断されるべきである。",
 summary:"信用組合の合併に際し、退職金規程の変更について従業員が同意書に署名押印していた事案。署名があっても、不利益の内容について十分な情報提供がなければ自由な意思に基づく同意とは認められないとし、原判決を破棄差戻した。労働契約法9条の同意に関する基本判例。",
 laws:["労働契約法8条", "労働契約法9条", "労働契約法10条"],tags:["労働条件の変更", "同意", "自由な意思", "退職金"]},
{id:"c228",lid:89767,name:"大阪医科薬科大学事件（賞与の不支給と不合理性）",caseNo:"令和1(受)1055",date:"2020-10-13",wareki:"令和2年10月13日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"その他",reporter:"集民 第264号63頁",areas:["労働", "民事"],
 holdings:"有期雇用のアルバイト職員に賞与を支給しないことは、正職員との職務の内容・配置の変更の範囲等の相違やアルバイト職員から契約職員・正職員への登用制度があることなどに照らし、労働契約法20条にいう不合理と認められるものに当たらない。",
 summary:"フルタイムのアルバイト職員が、正職員との賞与の支給の有無・私傷病による欠勤中の賃金の相違を争った事案。賞与は正職員の職務遂行能力や責任に応じた人材確保の趣旨があるとして、不支給は不合理とまではいえないとした。",
 laws:["労働契約法20条", "パートタイム・有期雇用労働法8条"],tags:["同一労働同一賃金", "賞与", "有期雇用", "不合理な相違"]},
{id:"c229",lid:89768,name:"メトロコマース事件（退職金の不支給と不合理性）",caseNo:"令和1(受)1190",date:"2020-10-13",wareki:"令和2年10月13日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"その他",reporter:"民集 第74巻7号1901頁",areas:["労働", "民事"],
 holdings:"売店業務に従事する契約社員に退職金を支給しないことは、正社員との職務の内容・配置の変更の範囲の相違や正社員への登用制度の存在などを考慮すると、労働契約法20条にいう不合理と認められるものに当たらない。",
 summary:"地下鉄駅売店の契約社員が正社員との退職金の有無の相違を争った事案。退職金は正社員としての職務を遂行しうる人材の確保・定着を図る目的を持つとして、不支給は不合理とまではいえないとした。大阪医科薬科大学事件と同日の判決。",
 laws:["労働契約法20条", "パートタイム・有期雇用労働法8条"],tags:["同一労働同一賃金", "退職金", "有期雇用", "不合理な相違"]},
{id:"c230",lid:89771,name:"日本郵便（東京）事件（契約社員の手当・休暇）",caseNo:"平成30(受)1519",date:"2020-10-15",wareki:"令和2年10月15日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"集民 第264号95頁",areas:["労働", "民事"],
 holdings:"郵便業務を担当する正社員と時給制契約社員との間で、年末年始勤務手当、夏期冬期休暇、病気休暇の有無に相違を設けることは、労働契約法20条にいう不合理と認められるものに当たる。",
 summary:"日本郵便の契約社員が各種手当・休暇について正社員との相違を争った事案。各手当・休暇の趣旨を個別に検討し、年末年始勤務手当等は契約社員にも妥当するとして相違を不合理と判断した。同日に大阪・佐賀の事件でも扶養手当・年末年始手当等について同様の判断がされた。",
 laws:["労働契約法20条", "パートタイム・有期雇用労働法8条"],tags:["同一労働同一賃金", "手当", "休暇", "有期雇用"]},
{id:"c231",lid:84051,name:"東芝（うつ病・解雇）事件（過失相殺と申告義務）",caseNo:"平成23(受)1259",date:"2014-03-24",wareki:"平成26年3月24日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"その他",reporter:"集民 第246号89頁",areas:["労働", "民事"],
 holdings:"過重な業務によって労働者が精神疾患を発症した場合、労働者が使用者に対して自らの精神的健康に関する情報を申告しなかったことをもって、損害賠償額の算定において過失相殺することはできない。",
 summary:"過重労働によりうつ病を発症した労働者が解雇され、損害賠償を請求した事案。原審は労働者が神経科への通院等を申告しなかったことを理由に過失相殺したが、最高裁はメンタルヘルス情報は申告しにくい性質のものであり、使用者は申告がなくても配慮すべきとして過失相殺を否定した。",
 laws:["民法418条", "民法722条2項", "労働契約法5条"],tags:["安全配慮義務", "過失相殺", "メンタルヘルス", "過重労働"]},
{id:"c232",lid:85148,name:"学校法人専修大学事件（打切補償と解雇制限）",caseNo:"平成25(受)2430",date:"2015-06-08",wareki:"平成27年6月8日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第69巻4号1047頁",areas:["労働", "民事"],
 holdings:"労災保険法に基づく療養補償給付を受ける労働者が療養開始後3年を経過しても治らない場合、使用者が労働基準法81条の打切補償を支払えば、同法19条1項ただし書により解雇制限が解除される。",
 summary:"業務上の疾病で休職中の労働者に対し、使用者が打切補償を支払って解雇した事案。使用者自らが療養補償を行っていない場合でも、労災保険給付を受けている労働者について打切補償による解雇制限の解除を認めた。",
 laws:["労働基準法19条1項", "労働基準法81条", "労働者災害補償保険法12条の8"],tags:["解雇制限", "打切補償", "労災", "療養補償"]},
{id:"c233",lid:86307,name:"福原学園事件（有期契約の更新上限）",caseNo:"平成27(受)589",date:"2016-12-01",wareki:"平成28年12月1日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"その他",reporter:"集民 第254号21頁",areas:["労働", "民事"],
 holdings:"契約期間を1年とし更新限度を3年とする有期労働契約において、3年を経過した時点で無期労働契約に移行するか否かは大学の裁量判断に委ねられている場合、更新上限到達後に無期契約への移行を期待する合理的理由があるとはいえない。",
 summary:"大学の契約職員が、3年の更新上限到達時に無期雇用への移行を求めた事案。原審は無期契約への移行を認めたが、最高裁は移行が大学の裁量に委ねられており、期待に合理的理由がないとして請求を退けた。",
 laws:["労働契約法19条"],tags:["有期労働契約", "雇止め", "更新上限", "無期転換"]},
{id:"c234",lid:52731,name:"日立製作所武蔵工場事件（残業命令の拘束力）",caseNo:"昭和61(オ)840",date:"1991-11-28",wareki:"平成3年11月28日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第45巻8号1270頁",areas:["労働", "民事"],
 holdings:"三六協定が締結され届け出られている場合において、就業規則に業務上の必要があるときは時間外労働を命ずることができる旨の定めがあり、その内容が合理的なものである限り、労働者はその定めに従い時間外労働をする義務を負う。",
 summary:"残業命令を拒否した従業員を懲戒解雇した事案。三六協定と合理的な就業規則の規定があれば、個別の同意なしに時間外労働義務が生ずるとして、解雇を有効とした。",
 laws:["労働基準法36条", "労働基準法32条"],tags:["時間外労働", "残業命令", "三六協定", "就業規則"]},
{id:"c235",lid:54209,name:"茨城石炭商事事件（労働者の損害賠償責任の制限）",caseNo:"昭和49(オ)1073",date:"1976-07-08",wareki:"昭和51年7月8日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第30巻7号689頁",areas:["労働", "民事"],
 holdings:"使用者が被用者の業務遂行中の不法行為により損害を被った場合、使用者は、事業の性格、規模、業務の内容、労働条件、加害行為の態様、予防や損失の分散についての使用者の配慮の程度等諸般の事情に照らし、損害の公平な分担という見地から信義則上相当と認められる限度においてのみ、被用者に対し損害の賠償または求償を請求できる。",
 summary:"従業員が業務中に起こした交通事故について会社が従業員に求償した事案。損害の公平な分担の観点から、使用者の求償権の行使を損害額の4分の1に制限した。労働者の責任制限の基本判例。",
 laws:["民法715条3項", "民法709条", "民法1条2項"],tags:["損害賠償", "求償", "責任制限", "報償責任"]},
{id:"c236",lid:86000,name:"行橋労基署長事件（歓送迎会と業務遂行性）",caseNo:"平成26(行ヒ)494",date:"2016-07-08",wareki:"平成28年7月8日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄自判",reporter:"集民 第253号47頁",areas:["労働", "行政"],
 holdings:"会社の歓送迎会に上司の意向で参加した労働者が、会終了後に研修生を送るため自動車を運転して事故死した場合、歓送迎会への参加と送迎は会社の業務の一環であり、労働者は事業主の支配下にあったとして、業務遂行性が認められる。",
 summary:"残業を中断して歓送迎会に参加し、その後研修生を送る途中で事故死した労働者の遺族が労災保険給付の不支給処分を争った事案。歓送迎会への参加が会社の意向によるものであったことなどから、業務起因性を認めた。",
 laws:["労働者災害補償保険法7条1項1号", "労働基準法79条"],tags:["労災", "業務遂行性", "業務起因性", "歓送迎会"]},
{id:"c237",lid:53283,name:"パロディ・モンタージュ写真事件",caseNo:"昭和51(オ)923",date:"1980-03-28",wareki:"昭和55年3月28日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第34巻3号244頁",areas:["知的財産", "民事"],
 holdings:"他人の著作物を自己の著作物の中に引用して利用することが許されるためには、引用を含む著作物の表現形式上、引用して利用する側の著作物と引用されて利用される側の著作物とを明瞭に区別して認識することができ、かつ両者の間に前者が主、後者が従の関係があることを要する。",
 summary:"雪山を滑るスキーヤーの写真を無断で利用し、巨大なタイヤを合成したモンタージュ写真を作成した事案。旧著作権法下の「節録引用」の要件として明瞭区別性と主従関係を示し、著作者人格権（同一性保持権）の侵害を認めた。引用の要件に関する基本判例。",
 laws:["著作権法32条1項", "著作権法20条"],tags:["引用", "明瞭区別性", "主従関係", "同一性保持権", "パロディ"]},
{id:"c238",lid:52267,name:"江差追分事件（翻案の意義）",caseNo:"平成11(受)922",date:"2001-06-28",wareki:"平成13年6月28日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄自判",reporter:"民集 第55巻4号837頁",areas:["知的財産", "民事"],
 holdings:"言語の著作物の翻案とは、既存の著作物に依拠し、かつその表現上の本質的な特徴の同一性を維持しつつ、具体的表現に修正・増減・変更等を加えて、新たに思想または感情を創作的に表現することにより、これに接する者が既存の著作物の表現上の本質的な特徴を直接感得することのできる別の著作物を創作する行為をいう。",
 summary:"江差追分に関するノンフィクション作品のプロローグとテレビ番組のナレーションの類似性が争われた事案。翻案の定義を示したうえで、アイデアや事実など表現それ自体でない部分、または表現上の創作性のない部分において同一性があるにすぎない場合は翻案に当たらないとした。",
 laws:["著作権法27条", "著作権法2条1項1号"],tags:["翻案", "本質的特徴", "アイデアと表現", "ノンフィクション"]},
{id:"c239",lid:52335,name:"中古ゲームソフト事件（頒布権の消尽）",caseNo:"平成13(受)952等",date:"2002-04-25",wareki:"平成14年4月25日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第56巻4号808頁",areas:["知的財産", "民事"],
 holdings:"映画の著作物に該当する家庭用ゲームソフトの頒布権のうち、公衆に提示することを目的としない複製物の譲渡については、いったん適法に譲渡されたことにより消尽し、その後の再譲渡には頒布権の効力は及ばない。",
 summary:"ゲームソフトの中古販売に対して、ゲームメーカーが映画の著作物の頒布権を根拠に差止めを求めた事案。配給制度を前提とした劇場用映画フィルムとは異なり、大量に複製されて公衆に譲渡されるゲームソフトについては、譲渡権と同様に消尽するとした。",
 laws:["著作権法26条", "著作権法2条3項", "著作権法26条の2"],tags:["頒布権", "消尽", "中古ソフト", "映画の著作物"]},
{id:"c240",lid:54792,name:"BBS並行輸入事件（特許権の国際的消尽）",caseNo:"平成7(オ)1988",date:"1997-07-01",wareki:"平成9年7月1日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第51巻6号2299頁",areas:["知的財産", "民事"],
 holdings:"日本の特許権者が国外で特許製品を譲渡した場合、譲受人との間で日本における販売・使用を制限する合意をし、かつ製品にその旨を明確に表示した場合を除き、特許権者は日本においてその製品についての特許権を行使することができない。",
 summary:"ドイツで適法に販売された自動車用アルミホイールを日本に並行輸入した行為が特許権侵害に当たるかが争われた事案。国際的な取引の自由を重視し、特許権者が販売地域制限の合意と製品への表示をしていない限り、輸入・販売を差し止められないとした。",
 laws:["特許法68条", "特許法2条3項"],tags:["並行輸入", "消尽", "国際消尽", "黙示の許諾"]},
{id:"c241",lid:35371,name:"インクカートリッジ事件（特許製品の再生と消尽）",caseNo:"平成18(受)826",date:"2007-11-08",wareki:"平成19年11月8日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第61巻8号2989頁",areas:["知的財産", "民事"],
 holdings:"特許権者が日本で譲渡した特許製品につき加工や部材の交換がされ、それにより当該特許製品と同一性を欠く特許製品が新たに製造されたものと認められるときは、特許権者はその製品について特許権を行使することができる。",
 summary:"使用済みのインクカートリッジにインクを再充填して販売した業者に対し、特許権者が差止めを求めた事案。再生品について消尽が及ぶかは、特許製品の属性、特許発明の内容、加工・交換の態様等を総合考慮して「新たな製造」に当たるかで判断するとし、本件では侵害を認めた。",
 laws:["特許法68条", "特許法2条3項1号"],tags:["消尽", "再生品", "新たな製造", "リサイクル"]},
{id:"c242",lid:52791,name:"小僧寿し事件（商標権侵害と損害不発生の抗弁）",caseNo:"平成6(オ)1102",date:"1997-03-11",wareki:"平成9年3月11日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第51巻3号1055頁",areas:["知的財産", "民事"],
 holdings:"商標法38条2項（現3項）による使用料相当額の損害賠償請求においても、侵害者は、登録商標の顧客吸引力が全く認められず、登録商標に類似する標章の使用が売上げに全く寄与していないことを主張立証して、損害の発生を争うことができる。",
 summary:"「小僧」の登録商標の権利者が、「小僧寿し」チェーンに対して商標権侵害を理由に損害賠償を請求した事案。類似性を認めつつ、登録商標の顧客吸引力が皆無で侵害者の売上げに寄与していないとして、使用料相当額の損害も発生していないとした。",
 laws:["商標法38条3項", "商標法37条"],tags:["商標権侵害", "損害不発生", "顧客吸引力", "使用料相当額"]},
{id:"c243",lid:52352,name:"フレッドペリー事件（真正商品の並行輸入）",caseNo:"平成14(受)1100",date:"2003-02-27",wareki:"平成15年2月27日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第57巻2号125頁",areas:["知的財産", "民事"],
 holdings:"商標権者以外の者が登録商標と同一の商標を付した商品を輸入する行為は、当該商標が外国の商標権者等により適法に付されたものであり、外国の商標権者と日本の商標権者が同一人または法律的・経済的に同一視できる関係にあり、日本の商標権者が品質管理を行いうる立場にあることから商品の品質に実質的な差異がないと評価される場合には、実質的違法性を欠き商標権侵害に当たらない。",
 summary:"英国の商標権者から許諾を受けたシンガポールの業者が、許諾契約に違反して中国で製造した商品を日本に輸入した事案。並行輸入が適法となる3要件を示したうえで、本件は製造地・製造者の制限に違反しており品質管理が及ばないとして、侵害を認めた。",
 laws:["商標法25条", "商標法2条3項2号", "商標法36条"],tags:["並行輸入", "真正商品", "品質管理", "商標の機能"]},
{id:"c244",lid:62612,name:"国際自由学園事件（商標法4条1項8号の「他人の名称の略称」）",caseNo:"平成16(行ヒ)343",date:"2005-07-22",wareki:"平成17年7月22日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄差戻",reporter:"集民 第217号595頁",areas:["知的財産", "行政"],
 holdings:"商標法4条1項8号にいう他人の名称の著名な略称に当たるか否かは、その商標の指定商品・役務の需要者のみを基準とするのではなく、その略称が本人を指し示すものとして一般に受け入れられているか否かを基準として判断すべきである。",
 summary:"「国際自由学園」の商標登録について、学校法人「自由学園」がその略称と類似するとして無効審判を請求した事案。4条1項8号の趣旨が人格的利益の保護にあることから、著名性の判断基準を需要者に限定しないとした。",
 laws:["商標法4条1項8号"],tags:["商標登録", "他人の名称", "著名な略称", "人格的利益"]},
{id:"c245",lid:52324,name:"オリンパス光学工業事件（職務発明の相当の対価）",caseNo:"平成13(受)1256",date:"2003-04-22",wareki:"平成15年4月22日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第57巻4号477頁",areas:["知的財産", "労働", "民事"],
 holdings:"勤務規則等に職務発明の対価の支払に関する定めがある場合でも、その定めによる対価の額が特許法35条の相当の対価の額に満たないときは、従業者はその不足額を請求することができ、その消滅時効は勤務規則等に定める支払時期から進行する。",
 summary:"元従業員がビデオディスク関連の職務発明について、会社の規程による報償金では不足するとして相当の対価を請求した事案。会社が一方的に定めた規程の額は相当の対価の上限とならないとし、不足額の請求を認めた。職務発明対価請求訴訟の増加をもたらした判例。",
 laws:["特許法35条3項", "特許法35条4項"],tags:["職務発明", "相当の対価", "勤務規則", "消滅時効"]},
{id:"c246",lid:33671,name:"日立製作所職務発明事件（外国特許と相当の対価）",caseNo:"平成16(受)781",date:"2006-10-17",wareki:"平成18年10月17日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第60巻8号2853頁",areas:["知的財産", "労働", "民事"],
 holdings:"従業者が職務発明について使用者に外国の特許を受ける権利を譲渡した場合、その対価の請求についても、特許法35条3項・4項が類推適用される。",
 summary:"元従業員が光ディスク関連の職務発明に関する国内および外国特許の対価を請求した事案。特許を受ける権利の譲渡の準拠法を日本法とし、外国の特許を受ける権利についても特許法35条を類推適用して対価の算定を認めた。",
 laws:["特許法35条3項", "特許法35条4項", "法の適用に関する通則法7条"],tags:["職務発明", "外国特許", "相当の対価", "準拠法"]},
{id:"c247",lid:81813,name:"北朝鮮映画事件（非ベルヌ条約国の著作物）",caseNo:"平成21(受)602",date:"2011-12-08",wareki:"平成23年12月8日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"その他",reporter:"民集 第65巻9号3275頁",areas:["知的財産", "民事"],
 holdings:"日本が国家として承認していない北朝鮮の国民の著作物は、ベルヌ条約により日本が保護義務を負う著作物に当たらず、著作権法6条3号の著作物に該当しないため、その無断利用は著作権法上の権利侵害に当たらず、著作権法が規律の対象としない利益であるから原則として不法行為も成立しない。",
 summary:"北朝鮮の映画をテレビ放送に利用したことについて損害賠償が求められた事案。著作権法の保護を受けない著作物の利用は、著作権法の規律対象外の利益についてのものであり、特段の事情がない限り不法行為を構成しないとした。",
 laws:["著作権法6条3号", "民法709条", "ベルヌ条約"],tags:["著作権の保護範囲", "未承認国", "不法行為", "国際著作権"]},
{id:"c248",lid:52268,name:"ときめきメモリアル事件（同一性保持権とメモリーカード）",caseNo:"平成11(受)955",date:"2001-02-13",wareki:"平成13年2月13日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第55巻1号87頁",areas:["知的財産", "民事"],
 holdings:"ゲームソフトのパラメータを改変するメモリーカードを輸入・販売した者は、そのメモリーカードの使用によってゲームのストーリーが本来予定された範囲を超えて展開され、著作者の同一性保持権が侵害されることについて、不法行為責任を負う。",
 summary:"恋愛シミュレーションゲームの主人公の能力値を書き換えるメモリーカードの販売が争われた事案。メモリーカードの使用者による改変を予定して販売した業者について、同一性保持権侵害を惹起したものとして損害賠償責任を認めた。",
 laws:["著作権法20条", "民法709条"],tags:["同一性保持権", "ゲームソフト", "改変", "不法行為"]},
{id:"c249",lid:52181,name:"顔真卿自書建中告身帖事件（所有権と著作権）",caseNo:"昭和58(オ)171",date:"1984-01-20",wareki:"昭和59年1月20日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"民集 第38巻1号1頁",areas:["知的財産", "民事"],
 holdings:"美術の著作物の原作品の所有権は、その有体物の面に対する排他的支配権能であるにとどまり、無体物である美術の著作物自体を直接排他的に支配する権能ではないから、著作権の保護期間が満了した後に第三者が著作物を複製しても、所有権の侵害にはならない。",
 summary:"唐代の書家の書の所有者が、過去に撮影された写真乾板を用いた出版物の複製に対して差止めを求めた事案。所有権と著作権の区別を明確にし、著作権が消滅した著作物の複製は所有者の権利を侵害しないとした。",
 laws:["民法206条", "著作権法2条1項1号", "著作権法51条"],tags:["所有権", "著作権の消滅", "有体物と無体物", "美術品"]},
{id:"c250",lid:54776,name:"ポパイネクタイ事件（連載漫画のキャラクターと著作権）",caseNo:"平成4(オ)1443",date:"1997-07-17",wareki:"平成9年7月17日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"その他",reporter:"民集 第51巻6号2714頁",areas:["知的財産", "民事"],
 holdings:"連載漫画のキャラクターは、具体的な漫画を離れた抽象的概念であって著作物とはいえず、後続の漫画は先行する漫画を翻案したものであるから、キャラクターの著作権の保護期間は最初に掲載された漫画を基準に判断すべきである。",
 summary:"漫画のキャラクターをネクタイに付して販売した行為の著作権侵害が争われた事案。キャラクター自体は著作物でないこと、保護期間は第1回作品の公表時から起算することを示し、第1回作品の保護期間満了により侵害が否定されたが、商標権侵害については判断を分けた。",
 laws:["著作権法2条1項1号", "著作権法51条2項", "著作権法53条"],tags:["キャラクター", "連載漫画", "保護期間", "翻案"]},
{id:"c251",lid:52227,name:"生理活性物質測定法事件（方法の発明と物の製造）",caseNo:"平成10(オ)604",date:"1999-07-16",wareki:"平成11年7月16日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄自判",reporter:"民集 第53巻6号957頁",areas:["知的財産", "民事"],
 holdings:"物質の測定方法の特許発明について、その方法を使用して得られた測定結果を利用して医薬品を製造する行為は、特許法100条2項の侵害行為を組成した物の廃棄請求の対象とはならず、測定方法の使用に対する差止めの範囲は限定される。",
 summary:"測定方法の特許が、その方法を品質検査に用いて製造・販売された医薬品の製造販売の差止めや廃棄を基礎付けるかが争われた事案。測定方法の特許権の効力は、方法の使用の差止めにとどまり、製品の製造販売の差止め・廃棄には及ばないとした。",
 laws:["特許法100条1項", "特許法100条2項", "特許法2条3項2号"],tags:["方法の発明", "差止請求", "廃棄請求", "医薬品"]},
{id:"c252",lid:53170,name:"メリヤス編機事件（審決取消訴訟の審理範囲）",caseNo:"昭和42(行ツ)28",date:"1976-03-10",wareki:"昭和51年3月10日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"その他",reporter:"民集 第30巻2号79頁",areas:["知的財産", "行政"],
 holdings:"特許無効審判の審決に対する取消訴訟においては、審判の手続において審理判断されなかった公知事実との対比における無効原因は、審決を違法とし、または適法とする理由として主張することができない。",
 summary:"特許無効審決の取消訴訟で、審判手続では主張されていなかった公知技術を新たに主張できるかが争われた。審判前置主義の構造から、審決取消訴訟の審理範囲は審判で審理判断された事由に限られるとした。",
 laws:["特許法178条", "特許法123条", "行政事件訴訟法"],tags:["審決取消訴訟", "審理範囲", "審判前置", "無効審判"]},
{id:"c253",lid:81957,name:"ピンク・レディー事件（パブリシティ権）",caseNo:"平成21(受)2056",date:"2012-02-02",wareki:"平成24年2月2日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第66巻2号89頁",areas:["知的財産", "民事"],
 holdings:"人の氏名・肖像等は、商品の販売等を促進する顧客吸引力を有する場合があり、顧客吸引力を排他的に利用する権利（パブリシティ権）は人格権に由来する権利として保護されるが、肖像等を無断で使用する行為は、専ら肖像等の有する顧客吸引力の利用を目的とするといえる場合に限り、パブリシティ権を侵害する不法行為となる。",
 summary:"歌手の写真を週刊誌のダイエット記事に無断で使用した事案。最高裁として初めてパブリシティ権を正面から認め、侵害となる類型を示したが、本件は記事の内容を補足する目的での使用であり、専ら顧客吸引力の利用を目的とするものではないとして侵害を否定した。",
 laws:["民法709条", "憲法13条"],tags:["パブリシティ権", "肖像権", "顧客吸引力", "人格権"]},
{id:"c254",lid:52186,name:"クラブキャッツアイ事件（カラオケ法理）",caseNo:"昭和59(オ)1204",date:"1988-03-15",wareki:"昭和63年3月15日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"その他",reporter:"民集 第42巻3号199頁",areas:["知的財産", "民事"],
 holdings:"カラオケ装置を設置したスナック等の経営者が、客に歌唱を勧め、従業員による歌唱や客の歌唱を店の営業の一環として管理している場合、客の歌唱も経営者による演奏に当たり、経営者は音楽著作物の演奏権を侵害する。",
 summary:"カラオケスナックの経営者が、著作権管理団体の許諾を得ずに客に歌唱させていた事案。客の歌唱について、経営者による管理・支配と営業上の利益の帰属を根拠に経営者自身が演奏の主体であるとした。いわゆるカラオケ法理の出発点。",
 laws:["著作権法22条", "著作権法112条", "民法709条"],tags:["カラオケ法理", "演奏権", "利用主体", "規範的主体"]},
{id:"c255",lid:91473,name:"音楽教室事件（生徒の演奏と演奏権）",caseNo:"令和3(受)1112",date:"2022-10-24",wareki:"令和4年10月24日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第76巻6号1348頁",areas:["知的財産", "民事"],
 holdings:"音楽教室のレッスンにおける生徒の演奏は、生徒自身の技術向上のためのものであり、教師の指示に従って行われるとしても、音楽教室の事業者が演奏の主体であるとはいえず、事業者は生徒の演奏について演奏権侵害の責任を負わない。",
 summary:"音楽教室での教師と生徒の演奏について、著作権管理団体が使用料を徴収できるかが争われた事案。教師の演奏については事業者が主体となることは争われなくなっていたが、生徒の演奏については、演奏の目的や態様に照らして事業者が主体とはいえないとした。",
 laws:["著作権法22条"],tags:["演奏権", "利用主体", "音楽教室", "カラオケ法理"]},
{id:"c256",lid:89597,name:"リツイート事件（氏名表示権）",caseNo:"平成30(受)1412",date:"2020-07-21",wareki:"令和2年7月21日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第74巻4号1407頁",areas:["知的財産", "民事"],
 holdings:"ツイッターで他人が無断投稿した写真をリツイートした結果、仕様によって画像がトリミングされ著作者名の表示が消えた場合、リツイートをした者は著作者の氏名表示権を侵害したものといえ、発信者情報開示の対象となる。",
 summary:"写真家が自己の写真を無断投稿したツイートをリツイートした者の発信者情報開示を求めた事案。リツイートによる表示のトリミングで氏名表示が見られなくなったことについて、リツイート者の氏名表示権侵害を認めた。",
 laws:["著作権法19条1項", "プロバイダ責任制限法4条1項"],tags:["氏名表示権", "リツイート", "発信者情報開示", "SNS"]},
{id:"c257",lid:86634,name:"マキサカルシトール事件（均等論第1要件・第5要件）",caseNo:"平成28(受)1242",date:"2017-03-24",wareki:"平成29年3月24日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"民集 第71巻3号359頁",areas:["知的財産", "民事"],
 holdings:"出願時に特許請求の範囲に記載された構成と異なる構成を容易に想到できたとしても、そのことだけでは均等の成立を妨げる特段の事情には当たらず、出願人が異なる構成を認識しながら特許請求の範囲に記載しなかったことが客観的に認められる場合に限り特段の事情がある。",
 summary:"医薬品の製造方法の特許について、出発物質の幾何異性体を用いる被疑侵害製法が均等侵害に当たるかが争われた事案。ボールスプライン事件の第5要件（特段の事情）の内容を明確にし、均等侵害の成立を認めた。",
 laws:["特許法70条", "特許法68条"],tags:["均等論", "第5要件", "特段の事情", "医薬品"]},
{id:"c258",lid:36405,name:"除くクレーム事件（ソルダーレジスト事件）",caseNo:"平成18(行ケ)10563",date:"2008-05-30",wareki:"平成20年5月30日",court:"知的財産高等裁判所",bench:"",kind:"判決",result:"",reporter:"",areas:["知的財産", "行政"],
 holdings:"特許請求の範囲の補正が「願書に最初に添付した明細書等に記載した事項の範囲内」でされたといえるかは、明細書等のすべての記載を総合して導かれる技術的事項との関係で、新たな技術的事項を導入しないものであるかにより判断すべきである。",
 summary:"先願発明との重複を回避するためクレームから一部を除外する補正（除くクレーム）が新規事項の追加に当たるかが争われた知財高裁大合議判決。新規事項追加の判断基準を示し、明細書に明示的記載がなくても新たな技術的事項を導入しない補正は許されるとした。",
 laws:["特許法17条の2第3項", "特許法134条の2"],tags:["新規事項", "補正", "除くクレーム", "大合議"]},
{id:"c259",lid:84209,name:"アップル対サムスン事件（FRAND宣言と差止め）",caseNo:"平成25(ネ)10043",date:"2014-05-16",wareki:"平成26年5月16日",court:"知的財産高等裁判所",bench:"",kind:"判決",result:"",reporter:"",areas:["知的財産", "民事"],
 holdings:"標準規格に必須の特許についてFRAND条件での許諾を宣言した特許権者が、FRAND条件でのライセンスを受ける意思を有する者に対して差止請求権を行使することは、特段の事情のない限り権利の濫用に当たり許されない。損害賠償請求についても、FRAND条件によるライセンス料相当額を超える部分は権利濫用に当たる。",
 summary:"通信規格の必須特許をめぐる知財高裁大合議判決。FRAND宣言をした特許権者の差止請求を原則として否定し、損害賠償についてもFRAND料率相当額に制限した。標準必須特許の権利行使に関する日本の指導的裁判例。",
 laws:["特許法100条", "特許法102条", "民法1条3項"],tags:["標準必須特許", "FRAND", "差止請求", "権利濫用", "大合議"]},
{id:"c260",lid:56325,name:"宜野座村工場誘致事件（信義則と政策変更）",caseNo:"昭和51(オ)1338",date:"1981-01-27",wareki:"昭和56年1月27日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"その他",reporter:"民集 第35巻1号35頁",areas:["行政", "民事"],
 holdings:"地方公共団体が特定の施策を決定し、特定の者がその施策を信頼して活動に入った後に、施策を変更して積極的な損害を与える場合、代償的措置を講ずることなく施策を変更することは、やむを得ない客観的事情がない限り信義衡平の原則に反し、不法行為責任を生ずる。",
 summary:"村長が企業誘致を決定し企業が工場建設を進めたところ、村長交代により協力が拒否された事案。施策変更自体は許されるが、信頼した者への損害を填補せずに変更することは信義則違反となりうるとし、国家賠償責任を認めた。",
 laws:["国家賠償法1条1項", "民法1条2項"],tags:["信義則", "政策変更", "信頼保護", "国家賠償"]},
{id:"c261",lid:52373,name:"病院開設中止勧告の処分性",caseNo:"平成14(行ヒ)207",date:"2005-07-15",wareki:"平成17年7月15日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"その他",reporter:"民集 第59巻6号1661頁",areas:["行政"],
 holdings:"医療法に基づく病院開設中止の勧告は行政指導として定められているが、これに従わない場合には相当程度の確実さをもって保険医療機関の指定を受けられないという結果をもたらすことから、取消訴訟の対象となる行政処分に当たる。",
 summary:"病床過剰地域における病院開設に対する中止勧告の処分性が争われた事案。勧告自体は法的拘束力を持たない行政指導であっても、それに続く保険医療機関指定拒否との結びつきを重視し、実効的な権利救済の観点から処分性を認めた。",
 laws:["行政事件訴訟法3条2項", "医療法30条の7", "健康保険法"],tags:["処分性", "行政指導", "勧告", "実効的救済"]},
{id:"c262",lid:38189,name:"横浜市保育所廃止条例事件（条例の処分性）",caseNo:"平成21(行ヒ)75",date:"2009-11-26",wareki:"平成21年11月26日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第63巻9号2124頁",areas:["行政"],
 holdings:"特定の市立保育所を廃止する条例の制定行為は、他に行政庁の処分を待つことなく、その施行により各保育所廃止の効果を発生させ、当該保育所に現に入所中の児童とその保護者という限られた特定の者に対して直接法的効果を生じさせるものであり、行政処分に当たる。",
 summary:"市立保育所の民営化のため保育所を廃止する条例の制定が取消訴訟の対象となるかが争われた事案。条例という一般的規範の形式でも、特定の者に直接具体的な法的効果を及ぼすものは処分に当たるとした。訴えの利益は期間経過により否定された。",
 laws:["行政事件訴訟法3条2項", "児童福祉法24条"],tags:["処分性", "条例", "保育所", "民営化"]},
{id:"c263",lid:52343,name:"登録免許税還付通知拒否の処分性",caseNo:"平成13(行ヒ)25",date:"2005-04-14",wareki:"平成17年4月14日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第59巻3号491頁",areas:["行政"],
 holdings:"登録免許税法31条2項に基づく還付通知の請求に対して登記機関がした拒否通知は、登記等を受けた者の還付請求権の行使に関し簡易迅速な手続を設けた同条項の趣旨に照らし、法律上の地位に直接影響を及ぼす行政処分に当たる。",
 summary:"過大に納付した登録免許税の還付請求を登記官が拒否したことについて、その拒否通知の処分性が争われた事案。過誤納金の還付を求める他の手続があっても、簡易な手続による救済の実効性の観点から処分性を認めた。",
 laws:["行政事件訴訟法3条2項", "登録免許税法31条2項"],tags:["処分性", "還付", "登録免許税", "通知"]},
{id:"c264",lid:53801,name:"ごみ焼却場設置事件（事実行為の処分性）",caseNo:"昭和37(オ)296",date:"1964-10-29",wareki:"昭和39年10月29日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第18巻8号1809頁",areas:["行政"],
 holdings:"行政事件訴訟特例法にいう行政庁の処分とは、公権力の主体たる国または公共団体が行う行為のうち、その行為によって直接国民の権利義務を形成しまたはその範囲を確定することが法律上認められているものをいい、ごみ焼却場の設置行為はこれに当たらない。",
 summary:"東京都がごみ焼却場を設置する行為の取消しを求めた事案。処分の定義を示した判例として、以後の処分性判断の基本的枠組みとなった。焼却場の設置は私法上の契約と事実行為の組合せであり処分性がないとした。",
 laws:["行政事件訴訟法3条2項"],tags:["処分性", "定義", "事実行為", "公権力の行使"]},
{id:"c265",lid:52251,name:"二項道路一括指定の処分性",caseNo:"平成10(行ヒ)49",date:"2002-01-17",wareki:"平成14年1月17日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第56巻1号1頁",areas:["行政"],
 holdings:"特定行政庁が告示により建築基準法42条2項の道路の指定を一括して行った場合でも、個別の土地についてその敷地としての効果や建築制限が生じる以上、その指定は特定の土地の権利関係に直接影響を与える行政処分に当たる。",
 summary:"建築基準法上のいわゆる二項道路について、告示による一括指定の処分性が争われた事案。指定が一般的・抽象的な形式でされていても、個々の土地について具体的な私権制限を生じさせる効果があるとして処分性を認めた。",
 laws:["行政事件訴訟法3条2項", "建築基準法42条2項"],tags:["処分性", "一括指定", "二項道路", "告示"]},
{id:"c266",lid:52172,name:"新潟空港事件（原告適格と周辺住民）",caseNo:"昭和57(行ツ)46",date:"1989-02-17",wareki:"平成元年2月17日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"民集 第43巻2号56頁",areas:["行政"],
 holdings:"定期航空運送事業免許の取消訴訟において、飛行場周辺住民のうち航空機騒音により社会通念上著しい障害を受けることとなる者は、法律上の利益を有する者として原告適格を有する。",
 summary:"新潟空港の定期便免許について周辺住民が取消しを求めた事案。航空法の免許基準の趣旨・目的や、関連する騒音防止法の規定を考慮して、騒音被害を受ける住民の個別的利益が法律上保護されていると解し原告適格を認めた。",
 laws:["行政事件訴訟法9条", "航空法101条1項"],tags:["原告適格", "法律上の利益", "騒音", "周辺住民"]},
{id:"c267",lid:52773,name:"もんじゅ訴訟（原子炉設置許可と原告適格）",caseNo:"平成1(行ツ)130",date:"1992-09-22",wareki:"平成4年9月22日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄自判",reporter:"民集 第46巻6号571頁",areas:["行政"],
 holdings:"原子炉設置許可の無効確認訴訟において、原子炉の周辺に居住し事故等により直接的かつ重大な被害を受けることが想定される範囲の住民は、法律上の利益を有する者として原告適格を有する。",
 summary:"高速増殖炉もんじゅの設置許可の無効確認を周辺住民が求めた事案。原子炉等規制法の許可基準が周辺住民の生命・身体の安全を個々人の個別的利益としても保護する趣旨を含むとし、約58キロメートルの範囲の住民の原告適格を認めた。",
 laws:["行政事件訴訟法9条", "行政事件訴訟法36条", "核原料物質、核燃料物質及び原子炉の規制に関する法律24条"],tags:["原告適格", "原子炉", "無効確認訴訟", "周辺住民"]},
{id:"c268",lid:53238,name:"主婦連ジュース事件（不服申立適格）",caseNo:"昭和49(行ツ)99",date:"1978-03-14",wareki:"昭和53年3月14日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第32巻2号211頁",areas:["行政"],
 holdings:"景品表示法に基づく公正競争規約の認定に対して、一般消費者が不服申立てをすることは、消費者の利益が公益の保護を通じて反射的に受ける利益にすぎず、法律上の利益がないため許されない。",
 summary:"果汁含有率の表示に関する公正競争規約の認定に対し、消費者団体が不服申立てを行った事案。不当景品類及び不当表示防止法が一般消費者に与える利益は反射的利益にすぎないとして不服申立適格を否定した。",
 laws:["不当景品類及び不当表示防止法10条", "行政不服審査法"],tags:["不服申立適格", "反射的利益", "消費者", "公正競争規約"]},
{id:"c269",lid:52704,name:"建築確認と工事完了（訴えの利益）",caseNo:"昭和58(行ツ)35",date:"1984-10-26",wareki:"昭和59年10月26日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"民集 第38巻10号1169頁",areas:["行政"],
 holdings:"建築確認は、それを受けなければ工事をすることができないという法的効果を付与されているにすぎないから、工事が完了した場合には、建築確認の取消しを求める訴えの利益は失われる。",
 summary:"建築確認処分の取消訴訟係属中に建築工事が完了した事案。工事完了後は検査済証の交付や違反建築物に対する是正命令の判断が確認の存否に左右されないため、取消しを求める利益はなくなるとした。",
 laws:["行政事件訴訟法9条", "建築基準法6条"],tags:["訴えの利益", "建築確認", "工事完了", "狭義の訴えの利益"]},
{id:"c270",lid:53104,name:"免職処分と公職立候補（訴えの利益）",caseNo:"昭和37(オ)515",date:"1965-04-28",wareki:"昭和40年4月28日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第19巻3号721頁",areas:["行政"],
 holdings:"免職処分を受けた公務員が公職の候補者として立候補したことにより公務員の地位を回復することができなくなっても、免職処分の取消しによって処分時から立候補時までの給料請求権等を回復しうる以上、取消しを求める訴えの利益は失われない。",
 summary:"免職された公務員が訴訟係属中に市議会議員選挙に立候補して公務員の職を失った事案。復職の可能性がなくなっても、処分の取消しにより回復される給与等の法律上の利益がある限り訴えの利益を認めるとした。",
 laws:["行政事件訴訟法9条", "公職選挙法90条"],tags:["訴えの利益", "免職処分", "立候補", "給与請求権"]},
{id:"c271",lid:53213,name:"神戸税関事件（懲戒処分と裁量統制）",caseNo:"昭和47(行ツ)52",date:"1977-12-20",wareki:"昭和52年12月20日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄自判",reporter:"民集 第31巻7号1101頁",areas:["行政", "労働"],
 holdings:"公務員に対する懲戒処分は、懲戒権者の裁量に任されており、裁判所は懲戒権者と同一の立場に立って処分の当否を判断するのではなく、処分が社会観念上著しく妥当を欠き裁量権の範囲を逸脱・濫用したと認められる場合に限り違法と判断すべきである。",
 summary:"税関職員が争議行為等を理由に懲戒免職とされ、原審が処分を重すぎるとして取り消した事案。最高裁は懲戒処分の裁量を広く認め、社会観念審査の基準により原判決を破棄した。公務員の懲戒処分に関する司法審査の基本判例。",
 laws:["国家公務員法82条", "行政事件訴訟法30条"],tags:["裁量権の逸脱濫用", "懲戒処分", "社会観念審査", "公務員"]},
{id:"c272",lid:18123,name:"日光太郎杉事件（判断過程の統制）",caseNo:"昭和44(行コ)12",date:"1973-07-13",wareki:"昭和48年7月13日",court:"東京高等裁判所",bench:"",kind:"判決",result:"",reporter:"",areas:["行政"],
 holdings:"土地収用法の事業認定における「土地の適正且つ合理的な利用に寄与する」かどうかの判断において、本来最も重視すべき諸要素を不当に軽視し、考慮すべきでない事項を考慮し、過大に評価するなどして判断がされた場合、その判断は裁量権の範囲を逸脱したものとして違法となる。",
 summary:"道路拡幅のため日光東照宮の杉並木の一部を収用する事業認定が争われた事案。文化的価値等の考慮すべき事項を軽視し、オリンピック開催に伴う交通量の増加など考慮すべきでない事項を重視したとして認定を違法とした。判断過程審査の代表的裁判例。",
 laws:["土地収用法20条3号", "行政事件訴訟法30条"],tags:["裁量統制", "判断過程審査", "事業認定", "考慮事項"]},
{id:"c273",lid:52387,name:"呉市学校施設使用不許可事件",caseNo:"平成15(受)2001",date:"2006-02-07",wareki:"平成18年2月7日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第60巻2号401頁",areas:["行政", "憲法"],
 holdings:"学校施設の目的外使用を許可するか否かは管理者の裁量に委ねられているが、教職員団体の教育研究集会の会場としての使用を不許可とした処分は、考慮すべき事項を十分考慮せず、妨害行為のおそれを過大に評価したものとして裁量権の逸脱・濫用に当たる。",
 summary:"教職員組合が教育研究集会の会場として市立中学校の使用を申請したところ、右翼団体の妨害のおそれなどを理由に不許可とされた事案。過去の集会では実害がなかったことなどから、裁量権の逸脱・濫用を認め国家賠償責任を肯定した。",
 laws:["地方自治法238条の4", "学校教育法85条", "国家賠償法1条1項"],tags:["裁量権の逸脱濫用", "目的外使用", "集会", "学校施設"]},
{id:"c274",lid:52692,name:"旅券発給拒否処分の理由付記",caseNo:"昭和57(行ツ)70",date:"1985-01-22",wareki:"昭和60年1月22日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄自判",reporter:"民集 第39巻1号1頁",areas:["行政"],
 holdings:"旅券法が一般旅券発給拒否通知書に理由を付記すべきものとしているのは、処分庁の判断の慎重・合理性を担保して恣意を抑制し、不服申立てに便宜を与える趣旨であるから、いかなる事実関係に基づきいかなる法規を適用して拒否されたかを申請者が記載自体から了知しうるものでなければならない。",
 summary:"旅券発給拒否通知書に「旅券法13条1項5号に該当する」とだけ記載されていた事案。理由付記の趣旨から、法条の摘示のみでは不十分であり、事実関係の記載が必要であるとして処分を違法とした。理由付記の程度に関する基本判例。",
 laws:["旅券法14条", "旅券法13条1項5号", "行政手続法8条"],tags:["理由付記", "手続的瑕疵", "旅券", "恣意の抑制"]},
{id:"c275",lid:81379,name:"一級建築士免許取消処分の理由提示",caseNo:"平成21(行ヒ)91",date:"2011-06-07",wareki:"平成23年6月7日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"破棄自判",reporter:"民集 第65巻4号2081頁",areas:["行政"],
 holdings:"行政手続法14条1項本文が不利益処分に理由を示すべきものとしているのは、処分庁の判断の慎重と合理性を担保して恣意を抑制し、不服申立てに便宜を与える趣旨であり、処分基準が公にされている場合には、いかなる理由に基づきどのような処分基準の適用によって処分が選択されたかを知りうる程度の理由の提示が必要である。",
 summary:"構造計算書の偽装を理由とする一級建築士免許取消処分について、処分理由の提示に処分基準の適用関係が示されていなかった事案。行政手続法上の理由提示の程度を初めて明らかにし、処分を取り消した。",
 laws:["行政手続法14条1項", "建築士法10条1項"],tags:["理由提示", "行政手続法", "処分基準", "手続的瑕疵"]},
{id:"c276",lid:51876,name:"個人タクシー事件（聴聞手続と公正な手続）",caseNo:"昭和40(行ツ)101",date:"1971-10-28",wareki:"昭和46年10月28日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第25巻7号1037頁",areas:["行政"],
 holdings:"道路運送法の免許申請について、多数の申請者のうちから少数の者を選択する場合、行政庁は法の趣旨に沿って具体的な審査基準を設定し、これを公正かつ合理的に適用すべきであり、申請者に対し基準の内容を知らせて主張と証拠の提出の機会を与えなければならない。",
 summary:"個人タクシーの免許申請が却下された事案。聴聞において申請者に基準を知らせず主張立証の機会を与えなかった手続の瑕疵を理由に処分を取り消した。法律に明文のない場合でも公正な手続を要求した判例。",
 laws:["道路運送法6条", "行政手続法5条"],tags:["公正な手続", "審査基準", "聴聞", "手続的瑕疵"]},
{id:"c277",lid:51907,name:"群馬中央バス事件（諮問手続の瑕疵）",caseNo:"昭和42(行ツ)84",date:"1975-05-29",wareki:"昭和50年5月29日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第29巻5号662頁",areas:["行政"],
 holdings:"運輸審議会の諮問手続が、その趣旨とする公正かつ慎重な判断を担保するものとして不十分であったとしても、審議の結果に影響を及ぼす可能性がなかった場合には、処分の取消事由とはならない。",
 summary:"バス路線の免許申請却下について、運輸審議会の聴聞手続が不十分であったことが争われた事案。諮問手続の瑕疵が処分の取消事由となるかについて、手続の瑕疵が結論に影響を及ぼす可能性の有無で判断した。",
 laws:["道路運送法", "行政手続法"],tags:["諮問手続", "手続的瑕疵", "運輸審議会", "聴聞"]},
{id:"c278",lid:52658,name:"品川マンション事件（行政指導と建築確認の留保）",caseNo:"昭和55(オ)309",date:"1985-07-16",wareki:"昭和60年7月16日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第39巻5号989頁",areas:["行政"],
 holdings:"建築主が行政指導に協力しない意思を明確に表明し、確認処分を留保されたままでの行政指導には応じられないとの意思を真摯かつ明確に表明した場合には、特段の事情がない限り、行政指導を理由に確認処分を留保することは違法となる。",
 summary:"近隣住民との紛争調整のための行政指導を理由に建築確認が留保された事案。相手方の任意の協力を前提とする行政指導の限界を示し、不協力の意思の真摯かつ明確な表明後の留保を違法として国家賠償責任を認めた。",
 laws:["建築基準法6条", "国家賠償法1条1項", "行政手続法33条"],tags:["行政指導", "建築確認", "留保", "任意性"]},
{id:"c279",lid:56370,name:"武蔵野市教育施設負担金事件",caseNo:"昭和63(オ)890",date:"1993-02-18",wareki:"平成5年2月18日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"その他",reporter:"民集 第47巻2号574頁",areas:["行政"],
 holdings:"市の宅地開発指導要綱に基づく教育施設負担金の納付を求める行政指導は、相手方が任意に応じない意思を表明しているにもかかわらず、水道の給水や下水道の使用を拒否するなどの制裁措置を背景として納付を事実上強制するものであり、違法な公権力の行使に当たる。",
 summary:"マンション建設業者が市の指導要綱に基づき多額の負担金を納付させられた事案。負担金の納付を拒んだ場合の給水拒否等の制裁を背景とする行政指導は、任意性の限度を超え違法であるとして国家賠償責任を認めた。",
 laws:["国家賠償法1条1項", "行政手続法32条"],tags:["行政指導", "指導要綱", "負担金", "任意性"]},
{id:"c280",lid:52722,name:"宅建業法監督権限不行使と国家賠償",caseNo:"昭和61(オ)1152",date:"1989-11-24",wareki:"平成元年11月24日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"民集 第43巻10号1169頁",areas:["行政", "民事"],
 holdings:"宅地建物取引業法に基づく知事の免許や監督処分の権限は、業者の不正行為により損害を受けた個々の取引関係者の利益を直接保護するものではなく、権限の不行使が著しく不合理と認められない限り、取引関係者に対する国家賠償法上の違法はない。",
 summary:"宅建業者の不正行為で被害を受けた購入者が、知事の免許更新や監督処分の不作為を理由に県に国家賠償を求めた事案。規制権限不行使の違法判断において、権限不行使が著しく不合理といえるかという基準を示した。",
 laws:["国家賠償法1条1項", "宅地建物取引業法"],tags:["規制権限の不行使", "国家賠償", "監督処分", "著しく不合理"]},
{id:"c281",lid:52326,name:"筑豊じん肺訴訟（規制権限不行使の違法）",caseNo:"平成13(受)1760",date:"2004-04-27",wareki:"平成16年4月27日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第58巻4号1032頁",areas:["行政", "民事"],
 holdings:"鉱山保安法に基づく通商産業大臣の保安規制権限は、炭鉱労働者の生命・健康を保護することを主要な目的とするものであり、粉じん対策の規制権限を適時かつ適切に行使しなかったことは、その趣旨・目的に照らし著しく合理性を欠き、国家賠償法1条1項の適用上違法である。",
 summary:"炭鉱労働者がじん肺に罹患したことについて国の規制権限不行使の責任を問うた事案。じん肺法制定時には粉じん対策の技術的知見が確立していたにもかかわらず、省令の改正等をしなかったことを違法と判断した。規制権限不行使の違法が最高裁で初めて認められた判例。",
 laws:["国家賠償法1条1項", "鉱山保安法"],tags:["規制権限の不行使", "国家賠償", "じん肺", "著しく合理性を欠く"]},
{id:"c282",lid:52320,name:"水俣病関西訴訟（規制権限不行使）",caseNo:"平成13(オ)1194",date:"2004-10-15",wareki:"平成16年10月15日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"その他",reporter:"民集 第58巻7号1802頁",areas:["行政", "民事"],
 holdings:"水俣病の原因が工場排水中のメチル水銀化合物であることが判明し、排水規制の必要性が明らかになっていた昭和35年1月以降、国が水質二法に基づく規制権限を行使しなかったことは、著しく合理性を欠き国家賠償法上違法であり、県が県漁業調整規則に基づく規制権限を行使しなかったことも同様である。",
 summary:"熊本県から関西地方に移住した水俣病患者らが国と県の責任を追及した事案。工場排水の規制権限の不行使について、国と県の双方に国家賠償責任を認めた。併せて水俣病の病像についても行政の認定基準より広い判断を示した。",
 laws:["国家賠償法1条1項", "公共用水域の水質の保全に関する法律", "熊本県漁業調整規則"],tags:["規制権限の不行使", "国家賠償", "水俣病", "公害"]},
{id:"c283",lid:57048,name:"クロロキン薬害訴訟",caseNo:"平成1(オ)1260",date:"1995-06-23",wareki:"平成7年6月23日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"民集 第49巻6号1600頁",areas:["行政", "民事"],
 holdings:"厚生大臣が医薬品の副作用による被害の発生を防止するために薬事法上の権限を行使しなかったことが違法となるのは、権限の不行使がその許容される限度を逸脱して著しく合理性を欠くと認められる場合に限られ、クロロキン製剤についてはそのような場合には当たらない。",
 summary:"クロロキン製剤の副作用による網膜症の被害者らが国の責任を問うた事案。医薬品の副作用に関する規制権限の不行使について、権限不行使が著しく合理性を欠く場合に限り違法となるとしたうえで、本件では違法性を否定した。",
 laws:["国家賠償法1条1項", "薬事法"],tags:["規制権限の不行使", "国家賠償", "薬害", "医薬品"]},
{id:"c284",lid:52654,name:"在宅投票制度廃止事件（立法行為と国家賠償）",caseNo:"昭和53(オ)1240",date:"1985-11-21",wareki:"昭和60年11月21日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第39巻7号1512頁",areas:["憲法", "行政"],
 holdings:"国会議員の立法行為は、立法の内容が憲法の一義的な文言に違反しているにもかかわらず国会があえて当該立法を行うというような容易に想定し難い例外的な場合でない限り、国家賠償法1条1項の適用上違法の評価を受けない。",
 summary:"在宅投票制度が廃止され復活されなかったことにより投票できなかった身体障害者が国家賠償を求めた事案。立法行為の国家賠償法上の違法性を極めて限定的に解した。在外日本人選挙権訴訟において基準が修正された。",
 laws:["国家賠償法1条1項", "憲法15条", "憲法47条"],tags:["立法不作為", "国家賠償", "立法行為の違法", "選挙権"]},
{id:"c285",lid:54239,name:"裁判官の職務行為と国家賠償",caseNo:"昭和53(オ)69",date:"1982-03-12",wareki:"昭和57年3月12日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"民集 第36巻3号329頁",areas:["行政", "民事"],
 holdings:"裁判官がした争訟の裁判について国家賠償法1条1項の責任が肯定されるためには、裁判官が違法または不当な目的をもって裁判をしたなど、裁判官がその付与された権限の趣旨に明らかに背いてこれを行使したものと認めうるような特別の事情があることを必要とする。",
 summary:"確定判決に誤りがあったとして国家賠償を求めた事案。上訴等の是正手続が用意されていることから、裁判官の裁判行為については特別の事情がない限り国家賠償法上の違法は認められないとした。",
 laws:["国家賠償法1条1項"],tags:["裁判官の職務行為", "国家賠償", "特別の事情", "司法"]},
{id:"c286",lid:54103,name:"高知落石事件（営造物の設置管理の瑕疵）",caseNo:"昭和42(オ)921",date:"1970-08-20",wareki:"昭和45年8月20日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第24巻9号1268頁",areas:["行政", "民事"],
 holdings:"国家賠償法2条1項の営造物の設置または管理の瑕疵とは、営造物が通常有すべき安全性を欠いていることをいい、これに基づく責任には過失の存在を必要としない。道路管理者が防護柵の設置等の措置をとらなかった場合、予算上の制約は責任を免れる理由とはならない。",
 summary:"国道の落石事故で死亡した者の遺族が国と県に損害賠償を求めた事案。営造物責任が無過失責任であることを明らかにし、財政的制約を理由とする免責を否定した。営造物責任の基本判例。",
 laws:["国家賠償法2条1項"],tags:["営造物責任", "設置管理の瑕疵", "無過失責任", "予算上の制約"]},
{id:"c287",lid:52064,name:"奈良赤色灯事件（第三者の行為と営造物の瑕疵）",caseNo:"昭和46(オ)887",date:"1975-06-26",wareki:"昭和50年6月26日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第29巻6号851頁",areas:["行政", "民事"],
 holdings:"道路工事中の標識として設置された赤色灯等が、事故の直前に他の車両によって倒されていた場合、道路管理者が原状に復し道路を安全に保つことが時間的に不可能であったときは、道路管理に瑕疵があったとはいえない。",
 summary:"工事現場の赤色灯が先行車両に倒された直後に後続車両が事故を起こした事案。第三者の行為による危険の発生について、管理者に回復の時間的余裕がなかったことを理由に瑕疵を否定した。",
 laws:["国家賠償法2条1項"],tags:["営造物責任", "第三者の行為", "時間的余裕", "道路管理"]},
{id:"c288",lid:52141,name:"大東水害訴訟（河川管理の瑕疵）",caseNo:"昭和53(オ)492",date:"1984-01-26",wareki:"昭和59年1月26日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第38巻2号53頁",areas:["行政", "民事"],
 holdings:"未改修河川または改修の不十分な河川の安全性としては、過渡的な安全性で足り、河川管理の瑕疵の有無は、諸制約のもとで一般に施行されてきた治水事業による河川の改修・整備の過程に対応するいわば過渡的な安全性をもって足りるものとして判断すべきである。",
 summary:"都市化の進んだ地域の未改修河川の溢水による浸水被害について国家賠償が求められた事案。河川管理は道路管理と異なり財政的・技術的・社会的制約が大きいとして、改修途上の河川については緩やかな基準で瑕疵を判断するとした。",
 laws:["国家賠償法2条1項", "河川法"],tags:["営造物責任", "河川管理", "過渡的安全性", "水害"]},
{id:"c289",lid:52762,name:"多摩川水害訴訟（改修済み河川の瑕疵）",caseNo:"昭和63(オ)791",date:"1990-12-13",wareki:"平成2年12月13日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第44巻9号1186頁",areas:["行政", "民事"],
 holdings:"工事実施基本計画に準拠して改修・整備がされた河川については、その計画に定める規模の洪水における流水の通常の作用から予測される災害の発生を防止するに足りる安全性を備えているかどうかによって瑕疵の有無を判断すべきである。",
 summary:"改修済みの多摩川の堤防が決壊して家屋が流失した事案。大東水害訴訟の基準は未改修河川に関するものであり、改修済み河川については計画規模の洪水に対する安全性を備えていたかで判断すべきとして、原判決を破棄差し戻した。",
 laws:["国家賠償法2条1項", "河川法"],tags:["営造物責任", "河川管理", "改修済み河川", "水害"]},
{id:"c290",lid:50697,name:"河川附近地制限令事件（損失補償の直接請求）",caseNo:"昭和37(あ)2922",date:"1968-11-27",wareki:"昭和43年11月27日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"刑集 第22巻12号1402頁",areas:["憲法", "行政"],
 holdings:"河川附近地の砂利採取を知事の許可にかからしめる制限は一般的に当然受忍すべき制限であるが、特定の者に特別の犠牲を課したと認められる場合には、法令に損失補償の規定がなくても、憲法29条3項を直接の根拠として補償を請求する余地がある。",
 summary:"砂利採取の制限により損失を受けた者が、補償規定のないことを理由に制限令の違憲を主張した刑事事件。補償規定を欠いても直接憲法29条3項に基づく補償請求が可能であるとして法令を合憲とした。損失補償の直接請求権を認めた判例。",
 laws:["憲法29条3項", "河川附近地制限令4条"],tags:["損失補償", "特別の犠牲", "憲法29条3項", "直接請求"]},
{id:"c291",lid:51735,name:"奈良県ため池条例事件",caseNo:"昭和36(あ)2623",date:"1963-06-26",wareki:"昭和38年6月26日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"破棄差戻",reporter:"刑集 第17巻5号521頁",areas:["憲法", "行政"],
 holdings:"ため池の堤とうを使用する財産上の権利を条例で制限することは、災害を防止し公共の福祉を保持するためのやむを得ない制限であり、憲法29条に違反せず、また条例によって財産権を制限することも許される。",
 summary:"ため池の堤とうでの耕作を禁止する県条例に違反した者が起訴された事件。災害防止のための制限は財産権の内在的制約であり補償を要しないとし、条例による財産権規制も認めた。",
 laws:["憲法29条2項", "憲法29条3項", "憲法94条"],tags:["財産権", "条例による制限", "内在的制約", "損失補償不要"]},
{id:"c292",lid:83087,name:"神奈川県臨時特例企業税事件",caseNo:"平成22(行ヒ)242",date:"2013-03-21",wareki:"平成25年3月21日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄自判",reporter:"民集 第67巻3号438頁",areas:["行政"],
 holdings:"法人事業税の課税標準である所得の計算において欠損金の繰越控除を定める地方税法の規定は強行規定であり、繰越控除された欠損金額に相当する額を課税標準として課税する臨時特例企業税条例は、繰越控除を一部排除する効果を持ち、地方税法に違反し無効である。",
 summary:"県が独自に創設した法定外普通税の条例が地方税法に抵触するかが争われた事案。地方公共団体の課税権を認めつつ、法律の強行規定の趣旨を実質的に潜脱する条例は違法無効とした。",
 laws:["地方自治法14条1項", "地方税法72条の23", "憲法94条"],tags:["条例制定権", "法定外税", "地方税法", "欠損金の繰越控除"]},
{id:"c293",lid:52662,name:"大嶋訴訟（サラリーマン税金訴訟）",caseNo:"昭和55(行ツ)15",date:"1985-03-27",wareki:"昭和60年3月27日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"民集 第39巻2号247頁",areas:["憲法", "行政"],
 holdings:"租税法の分野における取扱いの区別は、その立法目的が正当であり、かつ区別の態様が目的との関連で著しく不合理であることが明らかでない限り、憲法14条1項に違反しない。給与所得者について必要経費の実額控除を認めず給与所得控除を適用することは合憲である。",
 summary:"給与所得者が事業所得者等との課税上の不公平を理由に所得税法の規定の違憲を主張した事案。租税立法については立法府の広い裁量を認める基準を示して合憲とした。租税法律主義と平等原則に関する基本判例。",
 laws:["憲法14条1項", "憲法84条", "所得税法28条"],tags:["租税法律主義", "平等原則", "給与所得控除", "立法裁量"]},
{id:"c294",lid:24926,name:"旭川市国民健康保険条例事件",caseNo:"平成12(行ツ)62",date:"2006-03-01",wareki:"平成18年3月1日",court:"最高裁判所",bench:"大法廷",kind:"判決",result:"棄却",reporter:"民集 第60巻2号587頁",areas:["憲法", "行政"],
 holdings:"国民健康保険の保険料は租税ではないため憲法84条が直接適用されることはないが、租税以外の公課であっても賦課徴収の強制の度合い等に応じて同条の趣旨が及び、保険料率の決定を市長に委任した条例は、算定基準を明確に定めているため同条の趣旨に反しない。",
 summary:"国民健康保険料の賦課について、条例で保険料率を定めず市長の告示に委任していたことが憲法84条の租税法律主義に反するかが争われた。保険料に租税法律主義の趣旨が及ぶことを認めつつ、本件条例を合憲とした。",
 laws:["憲法84条", "国民健康保険法76条", "国民健康保険法81条"],tags:["租税法律主義", "保険料", "条例", "委任"]},
{id:"c295",lid:53527,name:"パチンコ球遊器事件（通達課税）",caseNo:"昭和30(オ)862",date:"1958-03-28",wareki:"昭和33年3月28日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"棄却",reporter:"民集 第12巻4号624頁",areas:["行政"],
 holdings:"通達を機縁として課税が行われたとしても、通達の内容が法の正しい解釈に合致するものである以上、課税処分は法の根拠に基づくものであり、租税法律主義に反しない。",
 summary:"従来課税されていなかったパチンコ球遊器について、通達により物品税の課税対象とされたことが争われた事案。通達自体に課税の根拠はないが、通達の内容が法律の正しい解釈であれば課税は適法であるとした。",
 laws:["憲法84条", "物品税法"],tags:["租税法律主義", "通達", "課税処分", "法解釈"]},
{id:"c296",lid:52394,name:"外国税額控除余裕枠利用事件（りそな銀行事件）",caseNo:"平成15(行ヒ)215",date:"2005-12-19",wareki:"平成17年12月19日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄自判",reporter:"民集 第59巻10号2964頁",areas:["行政"],
 holdings:"外国税額控除の余裕枠を利用して利益を得ることを目的として、本来は外国税額控除の対象とならない取引を仕組んだ場合、その取引に基づいて外国税額控除を適用することは制度の濫用であり許されない。",
 summary:"銀行が外国法人の税負担を軽減するために取引に介在し、自らの外国税額控除の余裕枠を利用して利益を得た事案。租税回避目的の取引に対する外国税額控除の適用を制度の趣旨目的から否定した。",
 laws:["法人税法69条"],tags:["外国税額控除", "租税回避", "制度の濫用", "法人税"]},
{id:"c297",lid:81080,name:"武富士事件（贈与税と住所）",caseNo:"平成20(行ヒ)139",date:"2011-02-18",wareki:"平成23年2月18日",court:"最高裁判所",bench:"第二小法廷",kind:"判決",result:"破棄自判",reporter:"集民 第236号71頁",areas:["行政"],
 holdings:"相続税法にいう「住所」とは生活の本拠をいい、その判断は客観的な事実によるべきであり、贈与税回避の目的があったとしても、香港に滞在していた日数が日本より多いなどの事情があれば、日本国内に住所があったとはいえない。",
 summary:"消費者金融会社の創業者から海外居住中の長男への巨額の株式贈与について、長男の住所が日本国内にあるとして贈与税が課された事案。租税回避目的を考慮して住所を認定することは許されないとし、課税処分を取り消した。",
 laws:["相続税法1条の2", "民法22条"],tags:["住所", "贈与税", "租税回避", "客観的事実"]},
{id:"c298",lid:85710,name:"ヤフー事件（組織再編税制と不当性要件）",caseNo:"平成27(行ヒ)75",date:"2016-02-29",wareki:"平成28年2月29日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第70巻2号242頁",areas:["行政"],
 holdings:"法人税法132条の2にいう「法人税の負担を不当に減少させる結果となると認められるもの」とは、組織再編税制に係る各規定を租税回避の手段として濫用することにより法人税の負担を減少させるものをいう。",
 summary:"買収先企業の未処理欠損金を引き継ぐために買収前に役員を送り込んだ行為について、組織再編税制の否認規定の適用が争われた事案。否認の要件を「濫用」として定式化し、課税処分を適法とした。",
 laws:["法人税法132条の2", "法人税法57条"],tags:["組織再編税制", "租税回避", "濫用", "欠損金"]},
{id:"c299",lid:54240,name:"盛岡用途地域指定事件（行政計画の処分性）",caseNo:"昭和53(行ツ)62",date:"1982-04-22",wareki:"昭和57年4月22日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"棄却",reporter:"民集 第36巻4号705頁",areas:["行政"],
 holdings:"都市計画法に基づく用途地域の指定は、その効果が当該地域内の不特定多数の者に対する一般的抽象的なものにすぎず、個人に対する具体的な処分とはいえないから、抗告訴訟の対象となる処分に当たらない。",
 summary:"工業地域の指定により建築制限を受けた者が指定の取消しを求めた事案。用途地域指定は法令の制定と同様の性質を持つとして処分性を否定し、建築確認拒否等の具体的処分を待って争うべきとした。",
 laws:["行政事件訴訟法3条2項", "都市計画法8条"],tags:["処分性", "行政計画", "用途地域", "一般的抽象的"]},
{id:"c300",lid:52498,name:"大阪府知事交際費情報公開事件",caseNo:"平成3(行ツ)18",date:"1994-01-27",wareki:"平成6年1月27日",court:"最高裁判所",bench:"第一小法廷",kind:"判決",result:"破棄差戻",reporter:"民集 第48巻1号53頁",areas:["行政"],
 holdings:"知事の交際費に関する文書のうち、交際の相手方が識別されうる文書については、相手方との信頼関係や相手方の私的な事柄に関する情報が含まれるため、公開することにより交際事務の目的が達成できなくなるおそれがあるとして非公開とすることができる。",
 summary:"府民が知事の交際費に関する文書の公開を求めた事案。交際の相手方が特定される文書は非公開事由に該当するが、相手方が識別されない文書は公開すべきとした。情報公開条例における非公開事由の解釈を示した初期の判例。",
 laws:["大阪府公文書公開等条例"],tags:["情報公開", "交際費", "非公開事由", "プライバシー"]},
{id:"c301",lid:52270,name:"中嶋学資保険訴訟（生活保護と貯蓄）",caseNo:"平成11(行ツ)38",date:"2004-03-16",wareki:"平成16年3月16日",court:"最高裁判所",bench:"第三小法廷",kind:"判決",result:"棄却",reporter:"民集 第58巻3号647頁",areas:["行政", "憲法"],
 holdings:"生活保護受給世帯が保護費を原資として子どもの高等学校修学のために学資保険の保険料を支払い、満期保険金を受領したことは、生活保護法の趣旨目的にかなった使用であり、これを収入と認定して保護費を減額した処分は違法である。",
 summary:"保護費を切り詰めて学資保険に加入していた受給世帯に対し、満期保険金を収入認定して保護を減額した事案。高校進学のための貯蓄は自立助長という生活保護法の目的に沿うものであり、収入認定の対象とすることは許されないとした。",
